00−300,000=$300,000，D/E=1。 | No-tax Proposition I gives equal firm values of $600,000. XYZ therefore has debt of $300,000 and D/E=1.", "formula": ""}, {"text": "ABC 是全股权，所以股权成本、资产成本及 WACC 都相等。 | ABC is all equity, so its equity cost, asset cost, and WACC are equal.", "formula": "Rᵁ = 80,000/600,000 = 13.3333%"}, {"text": "对 XYZ 用无税命题 II，再用 50/50 复算 WACC。 | Apply no-tax Proposition II to XYZ and recompute WACC with equal weights.", "formula": "Rᴱ = 13.3333%+(13.3333%−8%)×1 = 18.6667%\nWACC = 0.5×18.6667%+0.5×8% ≈ 13.3333%"}], "answer": "ABC 股权成本和 WACC 都约为 13.33%；XYZ 股权成本约为 18.67%，WACC 仍约为 13.33%。 | ABC’s equity cost and WACC are both about 13.33%. XYZ’s equity cost is about 18.67%, while its WACC remains about 13.33%.", "related": [{"ref": "L12:25", "title": "无税下练杠杆对股权 Beta 的影响 | Practice how leverage affects equity beta without tax"}, {"ref": "L12:27-32", "title": "MacBeth 案例，连接杠杆和每股收益 | MacBeth example connecting leverage and EPS"}, {"ref": "L12:33-34", "title": "进阶情形：举债后债务成本也变化 | Advanced case where the debt cost changes"}, {"ref": "T10:18-23", "title": "把同一比较扩展到有税情形 | Extend the comparison to the taxed case"}, {"ref": "L12:57-61", "title": "在税盾之外加入财务困境成本 | Add financial distress costs to the tax-shield analysis"}], "calculator": null, "note": "Tutorial 的中间行印有 23.44%，但代入原题 D/E=1 得 18.67%，其后 WACC 的加权式也用了约 18.66%。本页采用复算结果。 | The tutorial prints 23.44% in an intermediate line. The stated D/E=1 gives 18.67%, and its later WACC calculation uses about 18.66%. This guide uses the recomputed value."}], "quiz": [{"type": "choice", "prompt": "无税、无困境成本、投资政策不变时，增加杠杆会怎样影响总企业价值？ | With no tax, no distress costs, and unchanged investment policy, what happens to total firm value when leverage rises?", "options": ["总价值不变 | Total value is unchanged", "总价值一定增加 | Total value must rise", "总价值一定减少 | Total value must fall"], "answer": 0, "hint": "回想无税 M&M 命题 I。 | Recall no-tax M&M Proposition I.", "solution": "拆分投资者所获现金流不改变项目总现金流，所以总价值不变。 | Splitting investors’ claims does not change total asset cash flows, so total value is unchanged."}, {"type": "number", "prompt": "无杠杆价值 $900,000，永久债务市值 $200,000，公司税率 30%，无困境成本。求有杠杆公司价值。 | Unlevered value is $900,000, permanent debt is worth $200,000, corporate tax is 30%, and distress costs are zero. Find levered firm value.", "answer": 960000, "tolerance": 0.01, "hint": "永久债务的税盾现值为 T×D。 | The perpetual debt tax shield has PV T×D.", "solution": "Vᴸ=900,000+0.30×200,000=$960,000。 | Vᴸ=900,000+0.30×200,000=$960,000."}, {"type": "written", "prompt": "如果债务有税盾，为什么静态权衡模型仍可能给出低于 100% 的最优债务占比？ | If debt creates a tax shield, why can the static trade-off model still predict optimal debt below 100%?", "hint": "考虑再借一单位债务带来的额外收益及额外代价。 | Compare the extra benefit and cost of one more unit of debt.", "solution": "额外债务有税盾收益，也可能提高违约概率和预期财务困境成本。内点最优处两者的边际现值相抵。得分点：税盾、预期困境成本、边际权衡。 | Additional debt creates tax shields but can raise default probability and expected distress costs. At an interior optimum the marginal present values offset. Credit: tax shield, expected distress costs, marginal trade-off."}]}], "review": {"1": {"skills": [{"text": "三类财务决策 | Three financial decisions", "ref": "L1:3-18", "explanation": "资本预算看长期资产是否增值；资本结构看股权与债务如何筹资；营运资本管理看短期现金进出。分类后解释决策改变了哪项现金流。 | Capital budgeting evaluates long-term assets, capital structure chooses funding, and working capital management handles short-term cash. Explain which cash flows the decision changes."}, {"text": "企业形式和责任 | Business forms and liability", "ref": "L1:23-31", "explanation": "比较个人责任、持股转让、持续经营和筹资能力。普通合伙人的个人财产可能承担债务责任；公司股东通常以出资为限。 | Compare personal liability, ownership transfer, continuity and financing access. General partners can face personal liability, while corporate shareholders generally have limited liability."}, {"text": "代理冲突与控制机制 | Agency conflicts and controls", "ref": "L1:33-44", "explanation": "用股东与经理的不同利益解释行为。高管福利和监督费可直接列支；错失正 NPV 项目的损失属于间接成本。薪酬、董事会和控制权市场可影响激励。 | Explain actions using owners’ and managers’ incentives. Perks and monitoring involve direct costs; foregone valuable projects impose indirect costs. Pay, boards and corporate control can align incentives."}, {"text": "一级和二级市场 | Primary and secondary markets", "ref": "L1:46-48", "explanation": "新发行证券的资金流向发行者；已发行证券在投资者间交易提供流动性。答题说明谁收到钱。 | New issues raise money for the issuer. Trading existing securities among investors provides liquidity. Identify who receives the money."}], "traps": ["看到利润增长，仍须检查未来现金流、风险和股权价值。 | Higher accounting profit still requires checking future cash flows, risk and equity value."], "formulas": [], "examples": [], "questions": [{"type": "written", "prompt": "经理按营业收入拿奖金，即使扩张项目的 NPV 为负仍扩大销售。解释冲突及一项调整。 | A manager paid on revenue expands sales despite negative project NPV. Explain the conflict and one adjustment.", "hint": "先指出私人激励与股东目标。 | Identify private incentives and shareholder objectives.", "solution": "经理为增加奖金追求收入，股东承受价值损失。可将薪酬与长期股权价值或风险调整后的项目绩效挂钩。 | The manager gains bonus income while shareholders lose value. Link compensation to long-term equity value or risk-adjusted project performance."}]}, "2": {"skills": [{"text": "先画时间线再决定方向 | Timeline and valuation direction", "ref": "L2:6-7", "explanation": "今天为 t=0；题目未另说时款项在期末发生。未来金额折回今天，今天金额复利到目标日，只有同日金额可以相加。 | Today is time zero and payments default to period end. Discount future amounts or compound present amounts. Add amounts only at the same date."}, {"text": "单利和复利 | Simple and compound interest", "ref": "L2:14-23", "explanation": "单利只对原本金计息，复利对累计余额计息。多年的复利总回报需要开根号才能换算成年回报。 | Simple interest applies to original principal and compound interest to accumulated balances. Use a root of multi-year growth to obtain the annual compound return."}, {"text": "反求利率和期数 | Recover rates and horizons", "ref": "L2:39-43", "explanation": "求利率用增长倍数开根号，求期数用对数。一年计息多次时，统一每期利率和期数。 | Use a root for the rate and logarithms for time. Align periodic rates and counts when compounding occurs several times a year."}, {"text": "期初和期末日期 | Beginning and end dates", "ref": "T1:18-24", "explanation": "第 16 年开始等于第 15 年结束，从今天至此经过 15 年。用明确日期检查指数。 | The beginning of year 16 is the end of year 15, after 15 elapsed years. Check exponents against explicit date points."}], "traps": ["年利率用小数代公式，用百分数输入 BA II Plus 的 I/Y。 | Use decimals in algebra and percentages in the BA II Plus I/Y field."], "formulas": [], "examples": [], "questions": [{"type": "number", "prompt": "今天存 $1,500，年复利 7%，四年后的余额是多少？ | Invest $1,500 at 7% compounded annually for four years. Find the balance.", "answer": 1966.19, "tolerance": 0.02, "hint": "复利四期。 | Compound four periods.", "solution": "余额约为 $1,966.19。 | The balance is about $1,966.19."}]}, "3": {"skills": [{"text": "多笔、递延和先付现金流 | Uneven, deferred and due flows", "ref": "L3:6-14", "explanation": "年金标准现值位于首笔付款前一期。递延期需要再折现，先付年金和普通年金要保持相同笔数。 | Standard annuity PV is one period before the first payment. Deferral needs extra discounting. Compare due and ordinary annuities with the same payment count."}, {"text": "增长现金流和收敛条件 | Growing cash flows and convergence", "ref": "L3:42-44", "explanation": "有限增长年金可暂时有高增长；增长永续年金要求长期增长率低于贴现率。分子用下一期将付的金额。 | Finite annuities may have temporarily high growth. A growing perpetuity needs long-term growth below the discount rate. Use the next payment in the numerator."}, {"text": "APR 与 EAR 的转换 | Convert APR and EAR", "ref": "T2:22-28", "explanation": "APR 除以复利次数得到每期利率；EAR 要开根号才能变成月有效率。比较投资时统一时间口径。 | Divide APR by compounding count for its periodic rate. Take a root of the EAR growth factor for a monthly effective rate. Compare rates on a common basis."}, {"text": "变动利率和反求笔数 | Changing rates and payment counts", "ref": "T2:13-16", "explanation": "分段折现，把后段在交界日的价值折回今天。反求月存款笔数若不是整数，要上取整才达到目标。 | Discount each rate segment, then move the later segment’s boundary value to today. Round a fractional deposit count upward to reach a target."}], "traps": ["增长率、折现率和付款周期必须匹配。 | Match growth, discount rates and payment intervals."], "formulas": [{"title": "增长与递延年金 | Growing and deferred annuities", "explanation": "下式的年金 PV 在首笔付款前一期。第一笔在第 k 期时再折 k−1 期。 | The annuity PV is one period before its first payment. For a first payment at k, discount another k−1 periods.", "equations": ["\\mathrm{PV}=\\frac{C_1}{r-g}\\left[1-\\left(\\frac{1+g}{1+r}\\right)^n\\right]", "\\mathrm{PV}_{r=g}=\\frac{nC_1}{1+r}", "\\mathrm{PV}_0=\\frac{\\mathrm{PV}_{k-1}}{(1+r)^{k-1}}"]}], "examples": [{"title": "两段利率的月付年金 | A monthly annuity with two rate segments", "ref": "T2:15-16", "prompt": "每月末收 $1,500、共 15 年。头 7 年 APR 11%、月复利，之后 APR 7%、月复利。求今天的 PV。 | Receive $1,500 at each month end for 15 years. APR is 11% compounded monthly for seven years and 7% monthly thereafter. Find PV.", "steps": [{"text": "第一段 84 笔，后段 96 笔。后段先在第 84 个月末估值，再按第一段利率折回。 | There are 84 early and 96 later payments. Value the later stream at month 84, then discount at the first segment’s rate.", "equations": ["\\mathrm{PV}_0=1,500\\frac{1-(1+0.11/12)^{-84}}{0.11/12}+\\frac{1,500}{(1+0.11/12)^{84}}\\frac{1-(1+0.07/12)^{-96}}{0.07/12}"]}], "answer": "两段现值相加为 $138,724.68。每段使用其适用利率。 | The combined PV is $138,724.68. Apply each rate to its own segment.", "related": [{"ref": "L3:43", "title": "增长年金 | Growing annuity"}]}, {"title": "反求存款笔数 | Find a deposit count", "ref": "T2:13-14", "prompt": "每月末存 $340、APR 6% 月复利，目标 $20,000。要多少笔？ | Deposit $340 at month end at 6% APR compounded monthly, targeting $20,000. How many deposits?", "steps": [{"text": "月利率为 0.005，用年金 FV 反解。 | With a monthly rate of 0.005, invert the annuity FV.", "equations": ["n=\\frac{\\ln(1+20,000(0.005)/340)}{\\ln(1.005)}=51.6946"]}], "answer": "需 52 笔完整月存款才能至少达到目标。 | It takes 52 full monthly deposits to reach the target.", "related": []}], "questions": [{"type": "number", "prompt": "第 3、4、5、6 年末各收 $200，折现率 8%。求今天现值。 | Receive $200 at the ends of years 3, 4, 5 and 6. At 8%, find PV today.", "answer": 567.92, "tolerance": 0.02, "hint": "先在 t=2 算四笔年金，再折回。 | Value four payments at t=2, then discount to today.", "solution": "今天现值约为 $567.92。 | PV today is about $567.92."}]}, "4": {"skills": [{"text": "摊还和贷款余额 | Amortization and loan balances", "ref": "L4:4-11", "explanation": "月供由本金和期限反推。付完第 k 笔后余额是剩余付款在该日的现值；再融资以此余额作为新本金。 | Infer payment from principal and term. After payment k the balance is the PV of remaining payments. Refinance that balance as the new principal."}, {"text": "票息、YTM 和当前收益率 | Coupons, YTM and current yield", "ref": "L4:28-45", "explanation": "票息按面值计算，YTM 由市价反推。当前收益率只计票息。中途出售用出售日 YTM 重估剩余款项。 | Coupons depend on face value and YTM is inferred from market price. Current yield counts coupon income only. Reprice remaining payments at the sale-date YTM."}, {"text": "实际利率和即期利率 | Real rates and spot rates", "ref": "L4:46-63", "explanation": "名义现金流配名义利率、实际现金流配实际利率。期限结构给出不同期限即期利率时，逐笔用对应利率折现。 | Match nominal or real flows to their corresponding rates. When the spot curve varies by maturity, discount each payment at its matching rate."}, {"text": "债券特征与风险 | Bond features and risk", "ref": "L4:65-70", "explanation": "复习零息债、担保与无担保债、信用评级和国库券。其他条件相同，长期和低票息债通常更敏感于利率变化。 | Review zeroes, secured and unsecured bonds, ratings and Treasury securities. All else equal, longer and lower-coupon bonds are usually more rate sensitive."}], "traps": ["使用剩余期限；半年付息同时调整票息、利率和期数。 | Use remaining maturity and adjust coupons, rate and count together for semiannual payments."], "formulas": [{"title": "贷款余额与即期利率 | Loan balances and spot rates", "explanation": "余额在当期付款之后计量；z 为对应期限即期利率。 | Measure the balance immediately after the current payment. z is the matching spot rate.", "equations": ["C=\\frac{L_0r}{1-(1+r)^{-n}}", "B_k=C\\frac{1-(1+r)^{-(n-k)}}{r}", "P_0=\\sum_{s=1}^{n}\\frac{\\mathrm{CF}_s}{(1+z_s)^s}"]}], "examples": [{"title": "月供与再融资 | Mortgage refinancing", "ref": "Paper2022:7", "prompt": "旧试卷 Q11：$1m 贷款，30 年月供、APR 6%，已付 5 年。剩余本金转成 25 年、APR 4.5% 的月供贷款，忽略费用。 | Old paper Q11: a $1m 30-year mortgage at 6% APR has five years of monthly payments completed. Refinance into a 25-year monthly loan at 4.5% APR, ignoring fees.", "steps": [{"text": "先求旧月供。 | Calculate the old monthly payment.", "equations": ["C_{\\text{old}}=\\frac{1,000,000(0.06/12)}{1-(1+0.06/12)^{-360}}=\\$5,995.51"]}, {"text": "剩 300 笔，先按旧利率算余额，再按新利率求月供。 | There are 300 payments left. Find the balance at the old rate, then the payment at the new rate.", "equations": ["B_{60}=C_{\\text{old}}\\frac{1-(1+0.06/12)^{-300}}{0.06/12}=\\$930,543.57", "C_{\\text{new}}=\\frac{930,543.5682(0.045/12)}{1-(1+0.045/12)^{-300}}=\\$5,172.26"]}], "answer": "新月供约 $5,172.26。用旧贷款未偿余额作为新本金。 | The new payment is about $5,172.26, using the outstanding balance as new principal.", "related": [{"ref": "L4:9-11", "title": "固定本金与固定付款 | Fixed principal versus fixed payments"}, {"ref": "P3:8-9", "title": "月供上限反推贷款额 | Affordable principal from a payment ceiling"}]}, {"title": "即期利率估债券 | Bond price from spot rates", "ref": "L4:54", "prompt": "面值 £100、年票息 5%、剩 3 年；一年至三年即期利率分别 4%、4.5%、6%。 | A £100 par bond pays 5% annual coupons for three years. Spot rates are 4%, 4.5% and 6%.", "steps": [{"text": "逐笔折现 £5、£5、£105。 | Discount £5, £5 and £105 separately.", "equations": ["P_0=\\frac{5}{1.04}+\\frac{5}{1.045^2}+\\frac{105}{1.06^3}=97.55"]}], "answer": "价格约 £97.55。 | The price is about £97.55.", "related": []}], "questions": [{"type": "choice", "prompt": "同面值、同票息的普通债券，其他条件相同时，什么通常提高利率风险？ | For otherwise comparable bonds, which usually raises interest-rate risk?", "options": ["剩余期限更长 | Longer remaining maturity", "剩余期限更短 | Shorter remaining maturity", "缩短到期日 | Bringing maturity nearer"], "answer": 0, "hint": "考虑远期现金流的敏感度。 | Consider distant cash-flow sensitivity.", "solution": "其他条件相同，期限更长通常提高利率风险。 | Longer maturity generally raises rate sensitivity, all else equal."}]}, "5": {"skills": [{"text": "股利模型的起点和增长条件 | Dividend timing and growth conditions", "ref": "L5:31-41", "explanation": "刚付的是历史股利，估价用下一期股利。永续恒定增长需要求回报高于增长率。现金流每季支付时，股利和要求回报也要用每季口径。 | A just-paid dividend is historical. Value the next dividend. Perpetual growth requires return above growth. Quarterly dividends require a matching quarterly return."}, {"text": "高增长阶段和终值 | High-growth phase and terminal value", "ref": "L5:51-52", "explanation": "逐年推算股利，稳定增长第一笔前一期计算终值。终值和同日股利都要折回今天。 | Forecast each dividend and place terminal value one period before the first stable-growth dividend. Discount both terminal value and the same-date dividend."}, {"text": "收益率分解与反推增长 | Return decomposition and implied growth", "ref": "L5:46-49", "explanation": "要求回报由下一期股利收益率加增长率构成。在模型适用时可反求股价、要求回报或增长率。 | Required return equals the next dividend yield plus growth. When assumptions hold, solve for price, return or implied growth."}, {"text": "优先股、权利和估值倍数 | Preferred shares, rights and multiples", "ref": "L5:9-25", "explanation": "复习普通股表决权、优先股股息优先及 P/E。分红不是债券合约利息；倍数估值要说明盈利口径及可比性。 | Review common voting rights, preferred dividend priority and P/E. Dividends differ from contractual debt interest. State the earnings basis and comparability when using multiples."}], "traps": ["终值分子是稳定阶段第一笔股利；终值发生在该笔股利前一期。 | Terminal value uses the first stable-growth dividend and belongs one period before that dividend."], "formulas": [], "examples": [{"title": "先高增长四年再稳定 | Four high-growth years then stability", "ref": "T4:20-22", "prompt": "刚付 $1.80 股利，未来 4 年增长 25%，此后永续增长 6%，要求回报 10%。求股价。 | A just-paid dividend is $1.80, growing 25% for four years and 6% forever thereafter. Required return is 10%. Find price.", "steps": [{"text": "先逐年求四笔股利。 | Forecast the four early dividends.", "equations": ["D_t=1.80(1.25)^t,\\quad t=1,2,3,4"]}, {"text": "第 5 年股利进入稳定增长，因此终值在第 4 年。 | Dividend 5 starts stable growth, so terminal value is at year 4.", "equations": ["P_4=\\frac{1.80(1.25)^4(1.06)}{0.10-0.06}", "P_0=\\sum_{t=1}^{4}\\frac{1.80(1.25)^t}{1.10^t}+\\frac{P_4}{1.10^4}=\\$89.55"]}], "answer": "当前价格约每股 $89.55。 | Today’s price is about $89.55 per share.", "related": [{"ref": "L5:51-52", "title": "两年高增长的对应题 | Two-year high-growth variant"}]}], "questions": [{"type": "number", "prompt": "下一年股利 $3，股价 $60，稳定增长 4%。输入要求回报的百分数。 | Next year’s dividend is $3, price $60 and stable growth 4%. Enter required return as a percentage.", "answer": 9, "tolerance": 0.01, "hint": "下一年股利收益率加增长。 | Add next dividend yield to growth.", "solution": "要求回报为 9%。 | Required return is 9%."}]}, "6": {"skills": [{"text": "收入、价格变动与实际回报 | Income, price changes and real return", "ref": "L6:7-9", "explanation": "持有期回报把股利或票息加资本利得，再除以买入价。扣通胀时用名义财富倍数除以物价倍数。 | Add income and capital gain, then divide by purchase price. For real return divide nominal wealth growth by price growth."}, {"text": "历史算术与几何平均 | Historical arithmetic and geometric means", "ref": "L6:14-16", "explanation": "算术均值概括单期观察值，几何均值匹配实际累计复利增长。波动越大，两种均值通常越有差距。 | Arithmetic mean averages single-period observations. Geometric mean matches actual compound wealth growth. Greater variability generally widens the gap."}, {"text": "历史样本和概率方差 | Sample versus probability variance", "ref": "L6:13", "explanation": "历史样本围绕样本均值求平方差再除 n−1；已知全部情景概率时直接按概率加权。先用小数算方差，最后开方变成标准差。 | Divide squared historical sample deviations by n−1. With specified state probabilities, use probability weights. Compute variance in decimals and take the square root for standard deviation."}, {"text": "有效市场的信息集与证据 | Efficiency information sets and evidence", "ref": "L6:35-49", "explanation": "弱式含历史价格，半强式含全部公开信息，强式含私有信息。价格会变化与信息有效可同时成立。解释题写清哪一信息集能否持续获得风险调整后超额回报。 | Weak form covers price history, semi-strong all public information, and strong even private information. Changing prices can coexist with information efficiency. Discuss persistent risk-adjusted abnormal returns using the specified information set."}], "traps": ["样本标准差与概率标准差的分母和权重不同。 | Sample and state-based volatility use different denominators and weights."], "formulas": [], "examples": [{"title": "历史样本标准差 | Historical sample standard deviation", "ref": "L6:13", "prompt": "四年回报 15%、9%、6%、12%。计算样本均值、方差和标准差。 | Four annual returns are 15%, 9%, 6% and 12%. Calculate sample mean, variance and standard deviation.", "steps": [{"text": "用四个观察值求平均，再算小数形式的平方差。 | Average the four returns and calculate squared decimal deviations.", "equations": ["\\overline{R}=\\frac{0.15+0.09+0.06+0.12}{4}=0.105", "s^2=\\frac{(0.15-0.105)^2+(0.09-0.105)^2+(0.06-0.105)^2+(0.12-0.105)^2}{4-1}=0.0015", "s=\\sqrt{0.0015}=3.8730\\%"]}], "answer": "均值 10.50%，样本方差 0.0015，样本标准差约 3.87%。 | The mean is 10.50%, sample variance 0.0015 and sample standard deviation about 3.87%.", "related": [{"ref": "T5:13-17", "title": "缺失回报与波动率 | Missing return and volatility"}]}], "questions": [{"type": "choice", "prompt": "公开盈利公告发布后才出现稳定可预测的风险调整后超额收益，主要挑战哪项假设？ | Persistent predictable risk-adjusted abnormal returns after a public earnings announcement mainly challenge which form?", "options": ["半强式有效 | Semi-strong efficiency", "仅强式有效 | Only strong-form efficiency", "单利假设 | Simple interest"], "answer": 0, "hint": "公告属于公开信息。 | Earnings announcements are public information.", "solution": "公开信息应被半强式价格反映。 | Semi-strong efficiency requires prices to reflect public information."}]}, "7": {"skills": [{"text": "情景均值、方差和协方差 | State moments and covariance", "ref": "L7:7-13", "explanation": "每个情景先算组合回报，然后求概率加权均值和方差。两资产公式使用协方差，或相关系数乘两个标准差。 | Find portfolio return in each state before probability weighting. The two-asset formula uses covariance, or correlation times both standard deviations."}, {"text": "分散化与系统性风险 | Diversification and systematic risk", "ref": "L7:14-30", "explanation": "组合收益率是权重平均，标准差需考虑共同变动。CAPM 把系统性风险定价。个别风险可分散，市场风险仍存在。 | Returns are weighted averages; volatility depends on co-movement. CAPM prices systematic risk. Firm-specific risk can be diversified while market risk remains."}, {"text": "SML 定价、反求参数与 Alpha | SML pricing and implied parameters", "ref": "T6:20-24", "explanation": "两只定价正确证券可解风险溢价和无风险利率。预期回报高于相同 Beta 的要求回报时，Alpha 为正，价格相对偏低。 | Two correctly priced securities can identify the market premium and risk-free rate. Expected return above the beta-matched required return gives positive alpha and a relatively low price."}, {"text": "借款、负权重和目标组合 | Borrowing, negative weights and target portfolios", "ref": "L7:48-49", "explanation": "允许借贷时风险资产权重可以超过 100%，无风险权重可为负。加总仍为 1。与市场组合搭配时波动率等于市场权重的绝对值乘市场标准差。 | With borrowing, risky weights may exceed 100% and the risk-free weight may be negative. Weights still sum to one. Combining the market and cash gives volatility equal to absolute market weight times market volatility."}], "traps": ["市场风险溢价已经扣除无风险利率；题目直接给溢价时直接乘 Beta。 | The market premium already excludes the risk-free return. Multiply a given premium directly by beta."], "formulas": [{"title": "协方差、Alpha 和借贷组合 | Covariance, alpha and borrowing", "explanation": "Alpha 的预期回报与要求回报用同一期。无风险资产标准差为零。 | Use the same period for expected and required return in alpha. The risk-free asset has zero volatility.", "equations": ["\\mathrm{Cov}(A,B)=\\sum_s p_s(R_{A,s}-\\mu_A)(R_{B,s}-\\mu_B)", "\\rho_{AB}=\\frac{\\mathrm{Cov}(A,B)}{\\sigma_A\\sigma_B}", "\\alpha_i=\\mathrm{E}(R_i)-\\bigl[R_f+\\beta_i(\\mathrm{E}(R_m)-R_f)\\bigr]", "w_m=\\frac{R_{\\text{target}}-R_f}{\\mathrm{E}(R_m)-R_f},\\quad \\sigma_p=\\lvert w_m\\rvert\\sigma_m"]}], "examples": [{"title": "借款获得目标回报 | Borrow to reach a target return", "ref": "L7:48-49", "prompt": "总净投资 $15,000，目标回报 12%；无风险利率 5%，市场回报 10%、标准差 18%。按 CAPM 构造同回报、有效的市场与无风险组合。 | Net investment is $15,000 and target return 12%. Risk-free rate is 5%, market return 10% and volatility 18%. Construct the efficient market-and-cash combination under CAPM.", "steps": [{"text": "用目标回报解市场权重，剩余为无风险权重。 | Solve the market weight from the target return and allocate the rest to cash.", "equations": ["w_m=\\frac{0.12-0.05}{0.10-0.05}=1.4,\\quad w_f=-0.4"]}, {"text": "把权重乘净投资，并用市场组合的波动率求组合波动。 | Multiply weights by net wealth, then scale market volatility.", "equations": ["I_m=1.4(15,000)=\\$21,000,\\quad I_f=-\\$6,000", "\\sigma_p=1.4(18\\%)=25.2\\%"]}], "answer": "借 $6,000，合计投 $21,000 到市场组合，期望回报 12%，标准差 25.2%。 | Borrow $6,000 and invest $21,000 in the market, giving expected return 12% and volatility 25.2%.", "related": [{"ref": "FinalA:2", "title": "从股票权重构造目标 Beta | Construct a target beta from stock weights"}]}], "questions": [{"type": "number", "prompt": "无风险利率 4%，市场回报 10%。某股票 Beta 1.2，预测回报 13%。输入 Alpha 的百分点数。 | The risk-free rate is 4%, market return 10%, beta 1.2 and forecast stock return 13%. Enter alpha in percentage points.", "answer": 1.8, "tolerance": 0.01, "hint": "先算 CAPM 要求回报，再用预测减要求。 | Find the CAPM return and subtract it from the forecast.", "solution": "CAPM 回报 11.2%，Alpha 为正 1.8 个百分点。 | CAPM return is 11.2%, so alpha is positive 1.8 percentage points."}]}, "8": {"skills": [{"text": "独立、互斥和预算约束 | Independent, exclusive and constrained choices", "ref": "L8:9-12", "explanation": "独立项目接受正 NPV；互斥项目在可比条件下选更高正 NPV；预算有限时比较可行组合的总 NPV。 | Accept positive-NPV independent projects, choose the higher positive NPV for comparable exclusive projects, and compare feasible total NPV under a budget."}, {"text": "IRR 的适用条件和冲突 | Conditions and conflicts for IRR", "ref": "L8:29-38", "explanation": "先看现金流符号。常规投资型现金流通常有一个 IRR，多次变号可能多根，融资型现金流要重新理解比较方向。排序冲突按适用折现率的 NPV。 | Inspect signs first. Conventional investments typically have one IRR; repeated sign changes can create several. Financing-type patterns need a different comparison direction. Resolve rankings using NPV at the appropriate rate."}, {"text": "PB、DPB 和 PI | Payback, discounted payback and PI", "ref": "T7:3-8", "explanation": "折现回收期逐年累计折现现金流，普通回收期累计原现金流。年内比例估算法假设年内均匀流入。PI 衡量单位初始成本所获未来现值。 | Accumulate discounted cash flows for DPB and nominal flows for PB. Fractional-year interpolation assumes within-year flow. PI measures future PV per unit of initial cost."}, {"text": "AAR 与现金流指标 | AAR and cash-flow criteria", "ref": "L8:55-62", "explanation": "AAR 是平均净利润除以平均账面投资。直线折旧且账面终值为零时，平均投资是初始账面投资的一半。AAR 与基于现金流的 IRR 含义不同。 | AAR divides average accounting profit by average book investment. With straight-line depreciation to zero, average investment is half initial book value. Its interpretation differs from cash-flow IRR."}], "traps": ["写决定时要有金额、正负和明确接受／拒绝结论。 | State the value, sign and explicit accept/reject decision."], "formulas": [], "examples": [{"title": "多根 IRR | Multiple IRRs", "ref": "L8:33-34", "prompt": "现金流为今天 −20,000，第 1 年 50,000，第 2 年 30,000，第 3 年 −70,000，要求回报 10%。 | Cash flows are −20,000 now, 50,000 in year 1, 30,000 in year 2 and −70,000 in year 3. Required return is 10%.", "steps": [{"text": "有两次变号，先在给定要求回报下求 NPV。 | There are two sign changes. Calculate NPV at the specified required return.", "equations": ["\\mathrm{NPV}=-20,000+\\frac{50,000}{1.10}+\\frac{30,000}{1.10^2}-\\frac{70,000}{1.10^3}=-\\$2,344.10"]}], "answer": "NPV 为负，应拒绝。讲义给出约 14.68% 和 155% 两个正 IRR，因此单看其中一个 IRR 会误导。 | Reject because NPV is negative. The lecture gives two positive IRRs near 14.68% and 155%, so selecting just one is misleading.", "related": []}, {"title": "以 AAR 检查会计指标 | AAR as an accounting criterion", "ref": "L8:56", "prompt": "Coffee shop 四年净利润 $6,200、$7,800、$8,500、$1,200，平均账面投资 $25,000，要求 AAR 25%。 | The coffee shop has four annual profits of $6,200, $7,800, $8,500 and $1,200, average book investment $25,000 and an AAR target of 25%.", "steps": [{"text": "先求平均净利润，再除以平均账面投资。 | Average income first, then divide by average book investment.", "equations": ["\\mathrm{AAR}=\\frac{(6,200+7,800+8,500+1,200)/4}{25,000}=23.7\\%"]}], "answer": "按 AAR 规则未达 25%，不接受；作增值决策仍要看项目 NPV。 | It fails the 25% AAR target. Use project NPV for the value-creation decision.", "related": []}], "questions": [{"type": "choice", "prompt": "现金流的符号顺序为负、正、负。哪一判断正确？ | Cash-flow signs are negative, positive, negative. Which statement is correct?", "options": ["可能有多个 IRR | Multiple IRRs are possible", "一定有且仅有一个 IRR | Exactly one IRR is guaranteed", "所有贴现率下 NPV 都相同 | NPV is constant across rates"], "answer": 0, "hint": "先数变号次数。 | Count sign changes.", "solution": "两次变号可能产生多个 IRR，按风险匹配的要求回报判断 NPV。 | Two sign changes allow multiple IRRs; evaluate NPV at the risk-matched hurdle rate."}]}, "9": {"skills": [{"text": "与不做项目相比的增量现金流 | Incremental cash flow relative to no project", "ref": "L9:5-13", "explanation": "沉没成本已发生；机会成本、蚕食和协同效应要按增量计入。资产历史成本只在影响税务账面价值时重新发挥作用。 | Sunk costs have occurred. Include opportunity costs, cannibalization and synergies incrementally. Historical asset cost matters when determining tax book value."}, {"text": "OCF、折旧与税后出售 | OCF, depreciation and disposal taxes", "ref": "L9:15-39", "explanation": "在 EBIT 方法和税盾方法间互相检查。出售所得只对售价超过账面价值的差额计税；低于账面时，题设允许使用的税务损失可能带来节税。 | Cross-check the EBIT and tax-shield methods. Disposal tax applies to sale price less book value. A tax loss can create a benefit when usable under the assumptions."}, {"text": "替换、节约成本与逐期 NWC | Replacement, cost savings and NWC timing", "ref": "L9:42-60", "explanation": "设备替换必须比较新旧两条路径，既包括今天卖旧设备的税后收入，也包括未来放弃的旧设备残值。营运资本使用变动额，回收时点按题目。 | Compare new and old paths for replacement, including today’s old-asset proceeds and its foregone later salvage. Use changes in NWC and the specified release dates."}, {"text": "最低报价和不同寿命设备 | Minimum bids and unequal equipment lives", "ref": "L9:61-69", "explanation": "先令 NPV=0 求必要 OCF，再反求销售额和单位价格。相同服务、可重复更换时，用 EAC 比较不同寿命设备。 | Set NPV=0 to obtain required OCF, then revenue and unit price. Use EAC for unequal-lived equipment providing the same repeatable service."}], "traps": ["终期残值与营运资本回收必须逐项列明。MACRS 题按给定税务折旧表算当期折旧和剩余账面值。 | List terminal salvage and NWC recovery separately. For MACRS use the given tax depreciation table to calculate annual depreciation and book value."], "formulas": [{"title": "替换、最低报价与 EAC | Replacement, minimum bids and EAC", "explanation": "以新方案减旧方案。求最低报价时，终期其他现金流先折现扣除，再反求等额 OCF。AF 是普通年金现值因子。 | Subtract the old alternative from the new. For minimum bids, deduct terminal-flow PV before solving level OCF. AF denotes the ordinary annuity factor.", "equations": ["\\Delta\\mathrm{OCF}=\\Delta(\\mathrm{Sales}-\\mathrm{CashCosts})(1-T)+T\\Delta\\mathrm{Dep}", "\\mathrm{OCF}^{*}=\\frac{I_0-\\mathrm{PV}(\\text{terminal flows})}{\\mathrm{AF}(r,n)}", "\\mathrm{Price}^{*}=\\frac{\\mathrm{CashCosts}+(\\mathrm{OCF}^{*}-T\\mathrm{Dep})/(1-T)}{Q}"]}], "examples": [{"title": "旧设备是否应替换 | Should the old machine be replaced?", "ref": "L9:51-57", "prompt": "旧设备 BV $55,000、现价 $65,000，每年折旧 $9,000，五年后卖 $10,000。新设备 $150,000，五年直线折旧至零，残值零，每年节约成本 $50,000。税率 40%，要求回报 10%。 | Old machine BV is $55,000, current market value $65,000, annual depreciation $9,000 and five-year sale price $10,000. New machine costs $150,000, depreciates to zero over five years, has zero salvage and saves $50,000 annually. Tax 40%, required return 10%.", "steps": [{"text": "今天卖旧设备税后得 $61,000，所以初始净投入 $89,000。 | Sale of the old machine nets $61,000, giving a net initial outlay of $89,000.", "equations": ["\\mathrm{CF}_0=-150,000+65,000-0.40(65,000-55,000)=-\\$89,000"]}, {"text": "增量折旧为 $30,000−$9,000；最终失去旧设备的 $10,000 税后残值。 | Extra depreciation is $30,000−$9,000. Forego the old machine’s $10,000 terminal after-tax salvage.", "equations": ["\\Delta\\mathrm{OCF}=50,000(0.60)+(30,000-9,000)(0.40)=\\$38,400", "\\mathrm{NPV}=-89,000+38,400\\frac{1-1.10^{-5}}{0.10}-\\frac{10,000}{1.10^5}=\\$50,357.00"]}], "answer": "NPV 为正，应该替换。 | NPV is positive, so replace the machine.", "related": [{"ref": "FinalB:3", "title": "更换烤箱，分年维护费用不同 | Oven replacement with varying maintenance costs"}]}, {"title": "不同寿命机器的等额年成本 | Equivalent annual cost for unequal lives", "ref": "L9:66-69", "prompt": "A 成本 $100，每年运营 $10，寿命 2 年；B 成本 $140，每年运营 $8，寿命 3 年。可重复更换，服务相同，无税，折现率 10%。 | A costs $100 plus $10 annually for two years. B costs $140 plus $8 annually for three years. They provide equal repeatable service. Ignore tax and discount at 10%.", "steps": [{"text": "把资本成本折成年金，再加每年运营成本。 | Annualize capital cost, then add annual operating cost.", "equations": ["\\mathrm{EAC}_A=\\frac{100}{[1-1.10^{-2}]/0.10}+10=67.62", "\\mathrm{EAC}_B=\\frac{140}{[1-1.10^{-3}]/0.10}+8=64.30"]}], "answer": "B 的等额年成本更低，选 B。 | Choose B because its EAC is lower.", "related": [{"ref": "P9:10-12", "title": "含税和残值的电池 EAC | Battery EAC with taxes and salvage"}]}, {"title": "最低投标价 | Minimum bid price", "ref": "L9:61-65", "prompt": "五辆货车每年、共四年。年成本 $94,000，设备 $60,000、四年折旧至零，期末售 $5,000；NWC $40,000 期末收回，税率 39%，要求回报 20%。 | Deliver five trucks yearly for four years. Annual costs $94,000, equipment $60,000 depreciated to zero over four years, sale value $5,000, NWC $40,000 recovered at the end, tax 39%, return 20%.", "steps": [{"text": "初始现金支出 $100,000，终期非 OCF 为税后残值加 NWC。 | Initial outflow is $100,000; terminal non-operating flow combines after-tax salvage and NWC.", "equations": ["\\mathrm{Terminal}=5,000(1-0.39)+40,000=43,050"]}, {"text": "先反求 OCF，再从税盾式反求单价。 | Solve required OCF, then unit price through the tax-shield equation.", "equations": ["\\mathrm{OCF}^{*}=\\frac{100,000-43,050/1.20^4}{[1-1.20^{-4}]/0.20}=30,609.17", "p^{*}=\\frac{94,000+(30,609.1654-15,000(0.39))/0.61}{5}=\\$26,917.76"]}], "answer": "最低报价约每辆 $26,917.76，在题设下恰好达到 20% 回报。 | The minimum bid is about $26,917.76 per truck, just meeting the 20% required return.", "related": []}], "questions": [{"type": "number", "prompt": "售价 $10,000、账面值 $15,000、税率 20%，允许利用税务损失。税后出售所得多少？ | Sale price is $10,000, book value $15,000 and tax 20%, with the tax loss usable. Find after-tax proceeds.", "answer": 11000, "tolerance": 0.01, "hint": "出售亏损形成税务利益。 | The disposal loss gives a tax benefit.", "solution": "税后所得 $11,000。 | After-tax proceeds are $11,000."}]}, "10": {"skills": [{"text": "最好、基准和最差情景 | Best, base and worst scenarios", "ref": "L10:5-8", "explanation": "联合改变价格、销量、成本。最差情景同时低销量低价格高成本。情景标签本身不提供概率。 | Jointly change price, volume and costs. Worst combines low price and volume with high costs. Scenario names alone do not imply probabilities."}, {"text": "单变量敏感度和斜率 | Single-variable sensitivity and slopes", "ref": "L10:10-13", "explanation": "固定其他条件，改变一个输入并重算。说明斜率是每一元年固定成本、每一元售价还是每单位销量引起的 NPV 变化。 | Hold other inputs fixed, change one variable and recalculate. State whether slope is per dollar of annual fixed cost, price, or unit of volume."}, {"text": "三种平衡点和税务假设 | Three break-even points and taxes", "ref": "L10:16-20", "explanation": "会计平衡设 NI=0；现金平衡设 OCF=0；财务平衡设 NPV=0。有税时现金平衡可能受折旧税盾影响，必须从完整 OCF 公式解出。 | Set NI=0, OCF=0 and NPV=0 respectively. With taxes, depreciation shields can affect cash break-even, so derive it from the full OCF equation."}, {"text": "经营杠杆与预算下项目组合 | Operating leverage and constrained selection", "ref": "L10:22-28", "explanation": "DOL 以基准点衡量销量变化对 OCF 的百分比影响。不可拆分项目应枚举预算内可行组合，比总 NPV。 | DOL measures percentage OCF response to volume around the base case. For indivisible projects enumerate affordable combinations and compare total NPV."}], "traps": ["无税现金平衡公式在有税、可使用折旧税盾时需要调整。 | Adjust the no-tax cash break-even formula when taxes and usable depreciation shields apply."], "formulas": [{"title": "有税平衡与经营杠杆 | Taxed break-even and operating leverage", "explanation": "假设边际税率恒定且税盾可用。Qfinancial 还需先求覆盖初始投资及终期现金流的目标 OCF。 | Assume a constant marginal tax rate and usable shields. Financial break-even first requires an OCF target accounting for initial and terminal flows.", "equations": ["Q_{\\text{cash}}=\\frac{\\mathrm{FC}(1-T)-T\\mathrm{Dep}}{(P-v)(1-T)}", "Q_{\\text{financial}}=\\frac{\\mathrm{OCF}^{*}+\\mathrm{FC}(1-T)-T\\mathrm{Dep}}{(P-v)(1-T)}", "\\mathrm{DOL}=\\frac{Q(P-v)(1-T)}{\\mathrm{OCF}}"]}], "examples": [{"title": "三情景 NPV | NPV under three scenarios", "ref": "L10:5-8", "prompt": "设备投入 $200,000，5 年直线折旧至零，T=34%、r=12%。基准 Q=6000、p=80、v=60、FC=50000；最好 6500、85、58、45000；最差 5500、75、62、55000。 | Equipment costs $200,000 and depreciates to zero in five years. Tax 34%, rate 12%. Base Q,p,v,FC are 6000,80,60,50000; best 6500,85,58,45000; worst 5500,75,62,55000.", "steps": [{"text": "折旧 $40,000，分别代各情景到 OCF，随后按五年年金求 NPV。 | Depreciation is $40,000. Use each input set in OCF and value a five-year annuity.", "equations": ["\\mathrm{OCF}=[Q(p-v)-\\mathrm{FC}](0.66)+40,000(0.34)", "\\mathrm{NPV}=-200,000+\\mathrm{OCF}\\frac{1-1.12^{-5}}{0.12}"]}], "answer": "基准 OCF $59,800、NPV $15,565.62；最好 $99,730、$159,504.33；最差 $24,490、−$111,719.03。三情景呈现预测风险，不能直接把它们当等概率。 | Base OCF and NPV are $59,800 and $15,565.62; best $99,730 and $159,504.33; worst $24,490 and −$111,719.03. These reveal forecast risk without implying equal probabilities.", "related": []}, {"title": "预算约束下选择项目 | Choose projects under a budget", "ref": "L10:27-28", "prompt": "r=10%，A 的现金流 −10,30,5；B 为 −5,5,20；C 为 −5,5,15。项目不可拆分，预算 10 或 15 时选什么？ | At 10%, A has flows −10,30,5; B −5,5,20; C −5,5,15. Projects are indivisible. Choose under budgets of 10 and 15.", "steps": [{"text": "先分别算 NPV，再把可行组合加总。 | Calculate individual NPVs and compare affordable combinations.", "equations": ["\\mathrm{NPV}_A=21.40496,\\quad \\mathrm{NPV}_B=16.07438,\\quad \\mathrm{NPV}_C=11.94215"]}], "answer": "预算 10 时选 B+C，总 NPV 28.01653；预算 15 时选 A+B，总 NPV 37.47934。 | With budget 10 choose B+C, total NPV 28.01653. With budget 15 choose A+B, total NPV 37.47934.", "related": []}], "questions": [{"type": "number", "prompt": "Q=50，单价 40,000、单位成本 20,000、年固定成本 500,000，无税。输入 DOL。 | Q=50, price 40,000, unit cost 20,000 and fixed cost 500,000, with no tax. Find DOL.", "answer": 2, "tolerance": 0.001, "hint": "先算 OCF，再用贡献额除以 OCF。 | Calculate OCF and divide contribution by OCF.", "solution": "OCF=500,000，贡献额=1,000,000，DOL=2。 | OCF is 500,000, contribution 1,000,000, so DOL=2."}]}, "11": {"skills": [{"text": "融资成本与市场权重 | Financing costs and market weights", "ref": "L11:22-38", "explanation": "股权用 CAPM 或适用的 DGM；优先股用股息除市价；债务用当前 YTM。股数乘现价得 E，债券张数乘市价得 D。 | Use CAPM or an applicable DGM for equity, dividend/price for preferred, and current YTM for debt. Shares times current price gives E and bond count times market price gives D."}, {"text": "半年债务和税盾 | Semiannual debt and tax shields", "ref": "T9:18-23", "explanation": "半年收益率乘 2 给名义年 YTM；EAR 则要复利。按题设与课程口径年化，WACC 的债务成本乘一次税后因子。 | Twice the semiannual yield gives nominal annual YTM; EAR compounds it. Use the specified convention and apply the debt tax adjustment once."}, {"text": "由 WACC 或 D/E 反求权重 | Infer weights and leverage", "ref": "P11:2-4", "explanation": "D/E 和 D/V 不相同。先设 E=1、D=给定比率，再归一化。若反求 D/E，可把 WACC 先乘总权重的分母。 | D/E differs from D/V. Set E=1 and D to the given ratio, then normalize. To invert WACC, first multiply through by total funding."}, {"text": "项目资本成本和纯业务法 | Project capital cost and pure plays", "ref": "L11:8-12", "explanation": "按项目经营风险选回报，同业务、类似目标杠杆才使用公司 WACC。低息融资本身不能证明高风险项目该低折现。 | Match discount rate to project operating risk. Use company WACC for similar business risk and target leverage. Cheap funding alone does not justify a low rate for risky cash flows."}], "traps": ["WACC 项目现金流应使用融资之前的税后经营现金流，避免同时扣利息和再计债务成本。 | Use after-tax operating cash flow before financing when discounting at WACC."], "formulas": [{"title": "从 WACC 反求杠杆 | Infer leverage from WACC", "explanation": "仅有普通股和债务、且成本与税率保持给定时，下式可直接反解。 | With only equity and debt, hold the stated component costs and tax rate fixed.", "equations": ["\\frac{D}{E}=\\frac{R_E-\\mathrm{WACC}}{\\mathrm{WACC}-R_D(1-T)}"]}], "examples": [{"title": "由 WACC 反求 D/E | Recover D/E from WACC", "ref": "Paper2021:3", "prompt": "旧题：股权成本 12.7%、债务税前成本 5.6%、税率 40%、WACC 9.22%。求 D/E。 | Old question: equity cost 12.7%, pretax debt cost 5.6%, tax 40%, WACC 9.22%. Find D/E.", "steps": [{"text": "先求税后债务成本 3.36%，再代入杠杆反解式。 | Find after-tax debt cost of 3.36%, then invert the weighted average.", "equations": ["\\frac{D}{E}=\\frac{0.127-0.0922}{0.0922-0.056(0.60)}=0.5939"]}], "answer": "D/E 约 0.594。 | D/E is about 0.594.", "related": []}], "questions": [{"type": "number", "prompt": "D/E=0.5，税前债务成本 6%、股权成本 12%、税率 25%。输入 WACC 百分数。 | D/E=0.5, pretax debt cost 6%, equity cost 12%, tax 25%. Enter WACC as a percentage.", "answer": 9.5, "tolerance": 0.01, "hint": "债务权重三分之一、股权三分之二。 | Debt has weight one third, equity two thirds.", "solution": "WACC=9.50%。 | WACC=9.50%."}]}, "12": {"skills": [{"text": "无税 M&M 与自制杠杆 | No-tax M&M and homemade leverage", "ref": "L12:12-26", "explanation": "在无摩擦假设下，公司杠杆只是分配经营现金流。投资者借贷可复制杠杆，因此总价值不变。股权回报要求随财务风险上升。 | Under frictionless assumptions leverage reallocates operating flows. Investors can replicate leverage by borrowing, so total value is unchanged. Required equity return rises with financial risk."}, {"text": "有税公司价值与权益成本 | Taxed firm value and equity return", "ref": "L12:43-50", "explanation": "固定永久债务的税盾 PV 等于税率乘债务。先求无杠杆价值，加税盾求总值，再减 D 得股权市值。 | For fixed permanent debt, tax-shield PV is tax rate times debt. Find unlevered value, add the shield, then subtract debt for equity."}, {"text": "举债回购的股份数和价格 | Shares and prices in a debt-funded buyback", "ref": "L12:51-54", "explanation": "公告已被市场反映且公平回购时，先把新增税盾价值计入原股东总财富，再算每股价和回购数。回购后剩余股权为总值减债务。 | With an anticipated fair repurchase, first attribute tax-shield gains to original shareholders, then find price and repurchased shares. Remaining equity equals firm value less debt."}, {"text": "财务困境与融资优序 | Distress and pecking order", "ref": "L12:57-64", "explanation": "静态权衡比较税盾边际收益与预期困境边际成本。融资优序理论用信息不对称解释内部资金、债务、股权的融资顺序。题目没有数值时应解释机制。 | Static trade-off compares marginal tax benefits and expected distress costs. Pecking order uses asymmetric information to explain internal funds, debt, then equity. Explain mechanisms when no numbers are supplied."}], "traps": ["有税回购要先反映税盾带来的股价变化，再除出回购股数。 | Reflect the tax-shield price change before calculating shares repurchased."], "formulas": [{"title": "回购与杠杆 Beta | Repurchases and levered beta", "explanation": "回购公式针对原先全股权、固定永续债务、有税且无困境成本的理想化情形。Beta 式另假设债务 Beta 为零。 | The buyback equations assume an initially all-equity firm, permanent debt, taxes and no distress costs. The beta expression additionally assumes zero debt beta.", "equations": ["p_{\\text{buyback}}=\\frac{V_U+TD}{N_0}", "N_{\\text{repurchased}}=\\frac{D}{p_{\\text{buyback}}}", "N_{\\text{remaining}}=N_0-N_{\\text{repurchased}}", "\\beta_E=\\beta_U\\left[1+(1-T)\\frac{D}{E}\\right]"]}], "examples": [{"title": "有税举债回购 | A taxed debt-financed repurchase", "ref": "L12:53-54", "prompt": "永续 EBIT $20m，无杠杆成本 20%，原有 10m 股，税率 40%。举债 $30m 并全部公平回购，无困境成本。求回购价、股数和剩余权益。 | Perpetual EBIT is $20m, unlevered cost 20%, original shares 10m, tax 40%. Issue $30m of permanent debt and use it for a fair repurchase, with no distress costs. Find price, shares repurchased and remaining equity.", "steps": [{"text": "先求无杠杆与有杠杆公司价值。 | Find unlevered and levered firm value.", "equations": ["V_U=\\frac{20(0.60)}{0.20}=60\\text{m},\\quad V_L=60+0.40(30)=72\\text{m}"]}, {"text": "原股东在回购之前共同获得税盾带来的增值。先用原股数算公平价格，再求回购股数。 | Original shareholders receive the tax-shield gain before the repurchase. Divide by original shares to get fair price, then calculate shares bought.", "equations": ["p=\\frac{72}{10}=\\$7.20,\\quad N_{\\text{repurchased}}=\\frac{30}{7.20}=4.1667\\text{m}", "E=72-30=42\\text{m},\\quad N_{\\text{remaining}}=5.8333\\text{m}"]}], "answer": "回购价 $7.20，回购约 4.1667m 股，剩余权益 $42m；剩余股份乘回购价也等于 $42m。 | Repurchase at $7.20, buy about 4.1667m shares and leave $42m of equity. Remaining shares times price cross-checks equity value.", "related": [{"ref": "L12:51-52", "title": "无税回购作对照 | Compare the no-tax buyback"}, {"ref": "FinalA:5", "title": "同时练有税与无税回购 | Practice taxed and tax-free buybacks"}]}], "questions": [{"type": "number", "prompt": "无税，资产成本 10%、债务成本 6%、D/E=0.5。输入杠杆股权成本百分数。 | No taxes, asset cost 10%, debt cost 6%, D/E=0.5. Enter levered equity cost as a percentage.", "answer": 12, "tolerance": 0.01, "hint": "用无税 M&M II。 | Use no-tax M&M II.", "solution": "股权成本为 12%。 | Equity cost is 12%."}]}}, "mock": [{"points": 2, "lesson": 1, "type": "choice", "prompt": "管理层应优先采用哪项财务目标？ | Which financial objective should management use?", "options": ["提高当前股权市场价值 | Increase current market equity value", "最大化本季收入 | Maximize this quarter’s revenue", "不计风险扩大规模 | Expand regardless of risk"], "answer": 0, "hint": "看长期现金流在今天的价值。 | Consider the present value of future cash flows.", "solution": "股权价值同时反映现金流金额、时点与风险。 | Equity value incorporates cash-flow amount, timing and risk."}, {"points": 2, "lesson": 3, "type": "choice", "prompt": "从今天开始每年收等额款项，共十笔，采用什么模型？ | Ten equal annual payments begin today. Which model applies?", "options": ["先付年金 | Annuity due", "普通年金 | Ordinary annuity", "永续年金 | Perpetuity"], "answer": 0, "hint": "确定首笔和总笔数。 | Identify first payment and payment count.", "solution": "首笔今天、笔数有限，使用先付年金。 | The first payment is now and the stream is finite, so use an annuity due."}, {"points": 2, "lesson": 4, "type": "choice", "prompt": "其他条件相同，YTM 升高时普通固定票息债券价格怎样变化？ | All else equal, what happens to a fixed-coupon bond price as YTM rises?", "options": ["下降 | Falls", "上升 | Rises", "等于面值 | Becomes par"], "answer": 0, "hint": "现金流固定，贴现率改变。 | Cash flows stay fixed while discount rates change.", "solution": "更高折现率降低未来固定现金流现值。 | Higher discount rates reduce the PV of fixed cash flows."}, {"points": 2, "lesson": 6, "type": "choice", "prompt": "通过历史价格获得持续风险调整后超额回报，首先违反哪种有效性？ | Persistent risk-adjusted abnormal returns from past prices first contradict which form?", "options": ["弱式 | Weak form", "仅强式 | Only strong form", "无需任何假设 | No assumption"], "answer": 0, "hint": "历史价格属于最基本的信息集。 | Past prices are the narrowest information set.", "solution": "弱式有效已要求价格反映历史市场信息。 | Weak-form efficiency already incorporates historical market information."}, {"points": 2, "lesson": 7, "type": "choice", "prompt": "充分分散的组合仍需承担什么风险？ | Which risk remains in a broadly diversified portfolio?", "options": ["系统性市场风险 | Systematic market risk", "所有个别公司风险 | All firm-specific risk", "完全没有风险 | No risk"], "answer": 0, "hint": "考虑共同市场冲击。 | Consider common market shocks.", "solution": "系统性风险来自影响许多资产的共同因素。 | Common factors create systematic risk across many assets."}, {"points": 2, "lesson": 8, "type": "choice", "prompt": "两个可比互斥项目，一个 NPV 更高，另一个 IRR 更高；无其他约束，应优先哪项？ | For comparable mutually exclusive projects with conflicting NPV and IRR rankings and no other constraint, prioritize what?", "options": ["更高正 NPV | Higher positive NPV", "更高 IRR | Higher IRR", "较短回收期 | Shorter payback"], "answer": 0, "hint": "目标是新增价值的金额。 | Maximize the amount of value added.", "solution": "互斥时选适用折现率下更高正 NPV。 | Choose the higher positive NPV at the appropriate discount rate."}, {"points": 2, "lesson": 9, "type": "choice", "prompt": "去年已付、不可退回的调研费，今天做项目 NPV 时如何处理？ | How do you treat a nonrefundable study fee paid last year in today’s project NPV?", "options": ["排除，增量为零 | Exclude as non-incremental", "作为今天投入 | Include as today’s investment", "终期收回 | Recover at termination"], "answer": 0, "hint": "接受与拒绝项目会改变它吗？ | Does project acceptance change it?", "solution": "已发生且不因今天决策改变，是沉没成本。 | It is sunk because today’s decision cannot change it."}, {"points": 2, "lesson": 12, "type": "choice", "prompt": "无税 M&M 下增加杠杆、业务不变，哪项成立？ | Under no-tax M&M with unchanged business, which holds as leverage rises?", "options": ["股权成本提高，总价值不变 | Equity cost rises; firm value is unchanged", "总价值必然提高 | Firm value must rise", "股权风险必然下降 | Equity risk must fall"], "answer": 0, "hint": "总经营现金流不变，剩余股东承受更多风险。 | Operating cash flows are unchanged and shareholders bear more financial risk.", "solution": "无税命题 I 保持公司总值，命题 II 反映股权财务风险。 | Proposition I preserves firm value while Proposition II prices equity’s financial risk."}, {"points": 6, "lesson": 4, "type": "number", "prompt": "面值 $1,000、年票息率 8%，半年付息，剩 3 年，名义年 YTM 6%。输入债券价格。 | Price a $1,000 par bond with 8% coupons paid semiannually, three years left and 6% nominal annual YTM.", "answer": 1054.17, "tolerance": 0.02, "hint": "票息 $40、每期 3%、共 6 期。 | Use a $40 coupon, 3% per period and six periods.", "solution": "价格约 $1,054.17。 | Price is about $1,054.17.", "solutionEquations": ["P=40\\frac{1-1.03^{-6}}{0.03}+\\frac{1,000}{1.03^6}=\\$1,054.17"]}, {"points": 6, "lesson": 7, "type": "number", "prompt": "A、B 各投 50%，标准差分别 20%、30%，相关性 0.2。输入组合标准差的百分数。 | Invest 50% each in A and B with volatilities 20% and 30% and correlation 0.2. Enter portfolio standard deviation as a percentage.", "answer": 19.62, "tolerance": 0.02, "hint": "方差包含交叉项，先算方差再开方。 | Include the covariance cross term, then take the square root.", "solution": "组合方差 0.0385，标准差约 19.62%。 | Portfolio variance is 0.0385 and standard deviation about 19.62%.", "solutionEquations": ["\\sigma_p=\\sqrt{0.5^2(0.20)^2+0.5^2(0.30)^2+2(0.5)(0.5)(0.20)(0.20)(0.30)}=19.62\\%"]}, {"points": 6, "lesson": 10, "type": "number", "prompt": "无税，售价 $30、单位成本 $18、年固定成本 $6,000、年折旧 $3,600。输入会计平衡销量。 | With no tax, price $30, variable cost $18, annual fixed cost $6,000 and depreciation $3,600, find accounting break-even volume.", "answer": 800, "tolerance": 0.01, "hint": "会计利润为零时也要覆盖折旧。 | Zero accounting profit requires covering depreciation too.", "solution": "需要 800 单位。 | It requires 800 units.", "solutionEquations": ["Q=\\frac{6,000+3,600}{30-18}=800"]}, {"points": 6, "lesson": 11, "type": "number", "prompt": "D/E=0.5，股权成本 12%、债务成本 6%、税率 25%。输入 WACC 百分数。 | D/E=0.5, equity cost 12%, debt cost 6%, tax 25%. Enter WACC as a percentage.", "answer": 9.5, "tolerance": 0.01, "hint": "归一化成三分之二股权和三分之一债务。 | Normalize to two-thirds equity and one-third debt.", "solution": "WACC 为 9.50%。 | WACC is 9.50%.", "solutionEquations": ["\\mathrm{WACC}=\\frac{2}{3}(12\\%)+\\frac{1}{3}(6\\%)(1-0.25)=9.50\\%"]}], "cases": [{"points": 15, "lesson": 5, "title": "两阶段股利与终值 | Two-stage dividends and terminal value", "prompt": "刚付股利 $2，头两年增长 15%，以后增长 3%，要求回报 10%。(a) 求前 3 年股利（5 分）；(b) 求 t=2 终值（5 分）；(c) 求今天股价（5 分）。 | A $2 dividend was just paid. Growth is 15% for two years, then 3%, and required return 10%. (a) Find the first three dividends (5 marks); (b) terminal value at t=2 (5); (c) price today (5).", "steps": [{"text": "股利逐年相乘，D3 属于稳定阶段。 | Compound dividends year by year; dividend 3 is the first stable payment.", "equations": ["D_1=2(1.15)=2.30,\\quad D_2=2.645,\\quad D_3=2.72435"]}, {"text": "终值在首笔稳定增长股利前一期。 | Terminal value is one period before the first stable-growth dividend.", "equations": ["P_2=\\frac{2.72435}{0.10-0.03}=38.9193"]}, {"text": "D2 和 P2 一起折两年。 | Discount dividend 2 and terminal value together over two years.", "equations": ["P_0=\\frac{2.30}{1.10}+\\frac{2.645+38.9192857}{1.10^2}=\\$36.44"]}], "answer": "参考得分按各部分的公式、正确时间点、数值代入和结论分配。中间未四舍五入，答案约 $36.44。 | Award each part for formula, timing, substitution and result. Keep unrounded intermediate values; final price is about $36.44."}, {"points": 15, "lesson": 11, "title": "资本成本连接项目估值 | Connect cost of capital to project valuation", "prompt": "公司 D/E=0.5，股权成本 12%，债务成本 6%，税率 25%。同风险新项目今天投入 $100,000，未来 5 年末各收税后经营现金流 $25,000，无其他现金流。(a) 市值权重（5 分）；(b) WACC（5 分）；(c) NPV 与决策（5 分）。 | D/E=0.5, equity cost 12%, debt cost 6%, tax 25%. A same-risk project costs $100,000 and pays $25,000 after-tax operating cash flow at each of five year ends, with no other flows. (a) Market weights (5); (b) WACC (5); (c) NPV and decision (5).", "steps": [{"text": "从 D/E 转成占总资本的比率。 | Convert D/E into fractions of total capital.", "equations": ["\\frac{D}{V}=\\frac{1}{3},\\quad \\frac{E}{V}=\\frac{2}{3}"]}, {"text": "债务成本作一次税后调整。 | Apply the debt tax adjustment once.", "equations": ["\\mathrm{WACC}=\\frac{2}{3}(0.12)+\\frac{1}{3}(0.06)(0.75)=9.50\\%"]}, {"text": "年金现值减初始投资。 | Subtract the outlay from annuity PV.", "equations": ["\\mathrm{NPV}=-100,000+25,000\\frac{1-1.095^{-5}}{0.095}=-\\$4,007.28"]}], "answer": "按给定现金流和 9.50% 资本成本，NPV 为负，拒绝该独立项目。若使用 50% 债务权重或把税率作用于全部 WACC，应回到权重与税盾步骤重做。 | At a 9.50% capital cost, NPV is negative, so reject the independent project. Revisit weights and the tax shield if debt was incorrectly weighted at 50% or the tax adjustment applied to all WACC."}, {"points": 15, "lesson": 9, "title": "项目现金流全流程 | A complete project cash-flow analysis", "prompt": "设备今天 $120,000，税务寿命 4 年、直线折旧至零，项目经营 3 年。年销售 $180,000、现金成本 $80,000，税率 25%，折现率 10%。初始 NWC $15,000，第 3 年末全收回；设备届时卖 $20,000。忽略融资和其他影响。(a) 年折旧及 OCF（3 分）；(b) 年 3 账面值及税后残值（4 分）；(c) t=0 到 3 总现金流（4 分）；(d) NPV 及决策（4 分）。 | Equipment costs $120,000 today and has a four-year straight-line tax life to zero; the project operates for three years. Annual sales $180,000, cash costs $80,000, tax 25%, discount rate 10%. Initial NWC $15,000 is fully recovered at year 3, when equipment sells for $20,000. Ignore financing and other effects. (a) Depreciation and OCF (3); (b) year-3 book value and after-tax salvage (4); (c) full cash flows (4); (d) NPV and decision (4).", "steps": [{"text": "税务寿命为四年，所以按四年折旧。 | Use the four-year tax life for depreciation.", "equations": ["\\mathrm{Dep}=\\frac{120,000}{4}=30,000", "\\mathrm{OCF}=(180,000-80,000)(0.75)+30,000(0.25)=82,500"]}, {"text": "三年后尚有账面价值，出售亏损的税务利益按题设可用。 | Book value remains after three years; assume the disposal loss is usable.", "equations": ["\\mathrm{BV}_3=120,000-3(30,000)=30,000", "\\mathrm{Salvage}_{\\text{after tax}}=20,000-0.25(20,000-30,000)=22,500"]}, {"text": "初始投入加 NWC，终期经营现金流加税后残值与 NWC 回收。 | Include NWC with initial outlay, then add salvage and NWC recovery in year 3.", "equations": ["(\\mathrm{CF}_0,\\mathrm{CF}_1,\\mathrm{CF}_2,\\mathrm{CF}_3)=(-135,000,82,500,82,500,120,000)"]}, {"text": "逐期折现。 | Discount each period.", "equations": ["\\mathrm{NPV}=-135,000+\\frac{82,500}{1.10}+\\frac{82,500}{1.10^2}+\\frac{120,000}{1.10^3}=\\$98,339.59"]}], "answer": "NPV 为正，接受。关键得分点是区分三年项目期与四年折旧期，并计入最后的账面值、出售损失税盾和 NWC 回收。 | Accept because NPV is positive. Key credit is distinguishing project life from tax life and including terminal book value, disposal tax benefit and NWC recovery."}, {"points": 15, "lesson": 12, "title": "M&M、税盾与回购 | M&M, tax shields and a repurchase", "prompt": "原先全股权公司有 100,000 股，永续 EBIT $500,000，无杠杆资本成本 10%，税率 25%。借永久债务 $1m、利率 6%，全部用于公平回购，无困境成本。(a) VU、VL 和剩余权益（4 分）；(b) 回购价（3 分）；(c) 回购和剩余股数（4 分）；(d) 股权成本和 WACC（4 分）。 | An all-equity firm has 100,000 shares, perpetual EBIT $500,000, unlevered capital cost 10% and tax 25%. Issue $1m permanent debt at 6% for a fair repurchase, with no distress costs. (a) VU, VL and equity (4); (b) price (3); (c) repurchased and remaining shares (4); (d) equity cost and WACC (4).", "steps": [{"text": "先求税后经营收益的永续现值，再加债务税盾。 | Value after-tax perpetual operations, then add the debt tax shield.", "equations": ["V_U=\\frac{500,000(0.75)}{0.10}=3,750,000", "V_L=3,750,000+0.25(1,000,000)=4,000,000,\\quad E=3,000,000"]}, {"text": "税盾增值由原股东分享，得到公平价格和股份数。 | Attribute tax-shield gains to original owners to find fair price and shares.", "equations": ["p=\\frac{4,000,000}{100,000}=\\$40", "N_{\\text{repurchased}}=\\frac{1,000,000}{40}=25,000,\\quad N_{\\text{remaining}}=75,000"]}, {"text": "代有税 M&M II，然后市值加权。 | Apply taxed M&M II and market-value weights.", "equations": ["R_E=0.10+(0.10-0.06)\\frac{1}{3}(0.75)=11\\%", "\\mathrm{WACC}=0.75(0.11)+0.25(0.06)(0.75)=9.375\\%"]}], "answer": "VU=$3.75m、VL=$4m、E=$3m，回购价 $40，回购 25,000 股、剩 75,000 股，股权成本 11%、WACC 9.375%。 | VU=$3.75m, VL=$4m and E=$3m. Repurchase at $40, buy 25,000 shares and leave 75,000; equity cost is 11% and WACC 9.375%."}], "sources": {"ExamGuide": {"file": "FINA1310/FINA1310/Basic Information/FINA_1310_2M_Final Exam_Guidelines.pdf"}, "FinalA": {"file": "FINA1310/FINA1310/Problem Sets for Final/FINA 1310_Sample Problem Set (2)_2025A_Questions.pdf"}, "FinalB": {"file": "FINA1310/FINA1310/Problem Sets for Final/FINA 1310_Sample Problem Set (2)_2024B_Questions.pdf"}, "L1": {"file": "lecture notes/Lecture 1 - Overview of Corporate Finance.pdf"}, "L10": {"file": "lecture notes/Lecture 10 Project Analysis and Evaluation.pdf"}, "L11": {"file": "lecture notes/Lecture 11 Cost of Capital.pdf"}, "L12": {"file": "lecture notes/Lecture 12 Capital Structure.pdf"}, "L2": {"file": "lecture notes/Lecture 2 - Time Value of Money - Chapter 5.pdf"}, "L3": {"file": "lecture notes/Lecture 3 - Discounted Cash Flow Valuation - Chapter 6 (1).pdf"}, "L4": {"file": "lecture notes/Lecture 4 - Bond Valuation - Chapter 7.pdf"}, "L5": {"file": "lecture notes/Lecture 5 - Stock Valuation - Chapter 8.pdf"}, "L6": {"file": "lecture notes/Lecture 6 - Risk and Return - Chapter 12.pdf"}, "L7": {"file": "lecture notes/Lecture 7 - Risk and Return-CAPM - Chapter 13.pdf"}, "L8": {"file": "lecture notes/Lecture 8 - Net Present Values and Other Investment Criteria - Chapter 9.pdf"}, "L9": {"file": "lecture notes/Lecture 9 - Making Capital Investment Decisions - Chapter 10.pdf"}, "P11": {"file": "lecture notes/Lecture 11 - Practice Questions.pdf"}, "P2": {"file": "lecture notes/Lecture 2 - Practice Questions.pdf"}, "P3": {"file": "lecture notes/Lecture 3 - Practice Questions.pdf"}, "P4": {"file": "lecture notes/Lecture 4 - Practice Questions.pdf"}, "P5": {"file": "lecture notes/Lecture 5 - Practice Questions.pdf"}, "P6": {"file": "lecture notes/Lecture 6 - Practice Questions.pdf"}, "P7": {"file": "lecture notes/Lecture 7 - Practice Questions.pdf"}, "P8": {"file": "lecture notes/Lecture 8 - Practice Questions.pdf"}, "P9": {"file": "lecture notes/Lecture 9 - Practice Questions.pdf"}, "Paper2021": {"file": "FINA1310/FINA1310/PP/Final/2020-2021 Dec 19 pdf.pdf"}, "Paper2022": {"file": "FINA1310/FINA1310/PP/Final/2021-2022 May 13.pdf"}, "Ross": {"file": "FINA1310_Supp/Fundamentals of Corporate Finance - Stephen M. Ross.pdf"}, "Syllabus": {"file": "FINA1310/FINA1310/Basic Information/General Course Syllabus and Information_2025-26.pdf"}, "T1": {"file": "tutorial/Tutorial 1.pdf"}, "T10": {"file": "FINA1310_Supp/tutorial/Tutorial 10 (2).pdf"}, "T2": {"file": "tutorial/Tutorial 2.pdf"}, "T3": {"file": "tutorial/Tutorial 3.pdf"}, "T4": {"file": "tutorial/Tutorial 4.pdf"}, "T5": {"file": "tutorial/Tutorial 5.pdf"}, "T6": {"file": "tutorial/Tutorial 6.pdf"}, "T7": {"file": "tutorial/Tutorial 7.pdf"}, "T8": {"file": "tutorial/Tutorial 8.pdf"}, "T9": {"file": "tutorial/Tutorial 9.pdf"}}};
const mathMarkup = {"NWC = current assets − current liabilities": "<math display=\"block\"><mrow><mi mathvariant=\"normal\">NWC</mi><mo>=</mo><mtext>current&#160;assets</mtext><mo>−</mo><mtext>current&#160;liabilities</mtext></mrow></math>", "FVₙ = PV(1 + r)ⁿ": "<math display=\"block\"><mrow><msub><mi mathvariant=\"normal\">FV</mi><mi>n</mi></msub><mo>=</mo><mi mathvariant=\"normal\">PV</mi><mo stretchy=\"false\">(</mo><mn>1</mn><mo>+</mo><mi>r</mi><msup><mo stretchy=\"false\">)</mo><mi>n</mi></msup></mrow></math>", "FV(simple) = PV(1 + nr)": "<math display=\"block\"><mrow><msub><mi mathvariant=\"normal\">FV</mi><mrow><mtext>simple</mtext></mrow></msub><mo>=</mo><mi mathvariant=\"normal\">PV</mi><mo stretchy=\"false\">(</mo><mn>1</mn><mo>+</mo><mi>n</mi><mi>r</mi><mo stretchy=\"false\">)</mo></mrow></math>", "PV = FVₙ / (1 + r)ⁿ": "<math display=\"block\"><mrow><mi mathvariant=\"normal\">PV</mi><mo>=</mo><mfrac><mrow><msub><mi mathvariant=\"normal\">FV</mi><mi>n</mi></msub></mrow><mrow><mo stretchy=\"false\">(</mo><mn>1</mn><mo>+</mo><mi>r</mi><msup><mo stretchy=\"false\">)</mo><mi>n</mi></msup></mrow></mfrac></mrow></math>", "r = (FV/PV)^(1/n) − 1": "<math display=\"block\"><mrow><mi>r</mi><mo>=</mo><mo fence=\"true\" stretchy=\"true\">(</mo><mfrac><mrow><mi mathvariant=\"normal\">FV</mi></mrow><mrow><mi mathvariant=\"normal\">PV</mi></mrow></mfrac><msup><mo fence=\"true\" stretchy=\"true\">)</mo><mrow><mn>1</mn><mo>/</mo><mi>n</mi></mrow></msup><mo>−</mo><mn>1</mn></mrow></math>", "n = ln(FV/PV) / ln(1 + r)": "<math display=\"block\"><mrow><mi>n</mi><mo>=</mo><mfrac><mrow><mi>ln</mi><mo fence=\"true\" stretchy=\"true\">(</mo><mi mathvariant=\"normal\">FV</mi><mo>/</mo><mi mathvariant=\"normal\">PV</mi><mo fence=\"true\" stretchy=\"true\">)</mo></mrow><mrow><mi>ln</mi><mo stretchy=\"false\">(</mo><mn>1</mn><mo>+</mo><mi>r</mi><mo stretchy=\"false\">)</mo></mrow></mfrac></mrow></math>", "FV₂ = 1,000 × 1.05² = $1,102.50": "<math display=\"block\"><mrow><msub><mi mathvariant=\"normal\">FV</mi><mn>2</mn></msub><mo>=</mo><mn>1,000</mn><mo>×</mo><msup><mn>1.05</mn><mn>2</mn></msup><mo>=</mo><mo>$</mo><mn>1,102.50</mn></mrow></math>", "r = (600/500)^(1/5) − 1 = 3.7137%": "<math display=\"block\"><mrow><mi>r</mi><mo>=</mo><mo fence=\"true\" stretchy=\"true\">(</mo><mfrac><mrow><mn>600</mn></mrow><mrow><mn>500</mn></mrow></mfrac><msup><mo fence=\"true\" stretchy=\"true\">)</mo><mrow><mn>1</mn><mo>/</mo><mn>5</mn></mrow></msup><mo>−</mo><mn>1</mn><mo>=</mo><mn>3.7137</mn><mo>%</mo></mrow></math>", "PV₀ = Σ[CFₜ / (1 + r)ᵗ]": "<math display=\"block\"><mrow><msub><mi mathvariant=\"normal\">PV</mi><mn>0</mn></msub><mo>=</mo><munder><mo largeop=\"true\" movablelimits=\"true\">∑</mo><mrow><mi>t</mi></mrow></munder><mfrac><mrow><msub><mi mathvariant=\"normal\">CF</mi><mi>t</mi></msub></mrow><mrow><mo stretchy=\"false\">(</mo><mn>1</mn><mo>+</mo><mi>r</mi><msup><mo stretchy=\"false\">)</mo><mi>t</mi></msup></mrow></mfrac></mrow></math>", "FVₙ = Σ[CFₜ(1 + r)^(n−t)]": "<math display=\"block\"><mrow><msub><mi mathvariant=\"normal\">FV</mi><mi>n</mi></msub><mo>=</mo><munder><mo largeop=\"true\" movablelimits=\"true\">∑</mo><mi>t</mi></munder><msub><mi mathvariant=\"normal\">CF</mi><mi>t</mi></msub><mo stretchy=\"false\">(</mo><mn>1</mn><mo>+</mo><mi>r</mi><msup><mo stretchy=\"false\">)</mo><mrow><mi>n</mi><mo>−</mo><mi>t</mi></mrow></msup></mrow></math>", "PVordinary = C[1 − (1+r)⁻ⁿ]/r": "<math display=\"block\"><mrow><msub><mi mathvariant=\"normal\">PV</mi><mrow><mtext>ordinary</mtext></mrow></msub><mo>=</mo><mi>C</mi><mfrac><mrow><mn>1</mn><mo>−</mo><mo stretchy=\"false\">(</mo><mn>1</mn><mo>+</mo><mi>r</mi><msup><mo stretchy=\"false\">)</mo><mrow><mo>−</mo><mi>n</mi></mrow></msup></mrow><mrow><mi>r</mi></mrow></mfrac></mrow></math>", "PVdue = PVordinary(1+r)": "<math display=\"block\"><mrow><msub><mi mathvariant=\"normal\">PV</mi><mrow><mtext>due</mtext></mrow></msub><mo>=</mo><msub><mi mathvariant=\"normal\">PV</mi><mrow><mtext>ordinary</mtext></mrow></msub><mo stretchy=\"false\">(</mo><mn>1</mn><mo>+</mo><mi>r</mi><mo stretchy=\"false\">)</mo></mrow></math>", "FVordinary = C[(1+r)ⁿ − 1]/r": "<math display=\"block\"><mrow><msub><mi mathvariant=\"normal\">FV</mi><mrow><mtext>ordinary</mtext></mrow></msub><mo>=</mo><mi>C</mi><mfrac><mrow><mo stretchy=\"false\">(</mo><mn>1</mn><mo>+</mo><mi>r</mi><msup><mo stretchy=\"false\">)</mo><mi>n</mi></msup><mo>−</mo><mn>1</mn></mrow><mrow><mi>r</mi></mrow></mfrac></mrow></math>", "FVdue = FVordinary(1+r)": "<math display=\"block\"><mrow><msub><mi mathvariant=\"normal\">FV</mi><mrow><mtext>due</mtext></mrow></msub><mo>=</mo><msub><mi mathvariant=\"normal\">FV</mi><mrow><mtext>ordinary</mtext></mrow></msub><mo stretchy=\"false\">(</mo><mn>1</mn><mo>+</mo><mi>r</mi><mo stretchy=\"false\">)</mo></mrow></math>", "PVperpetuity = C₁/r": "<math display=\"block\"><mrow><msub><mi mathvariant=\"normal\">PV</mi><mrow><mtext>perpetuity</mtext></mrow></msub><mo>=</mo><mfrac><mrow><msub><mi>C</mi><mn>1</mn></msub></mrow><mrow><mi>r</mi></mrow></mfrac></mrow></math>", "PVgrowing perpetuity = C₁/(r−g), r>g": "<math display=\"block\"><mrow><msub><mi mathvariant=\"normal\">PV</mi><mrow><mtext>growing&#160;perpetuity</mtext></mrow></msub><mo>=</mo><mfrac><mrow><msub><mi>C</mi><mn>1</mn></msub></mrow><mrow><mi>r</mi><mo>−</mo><mi>g</mi></mrow></mfrac><mo>,</mo><mspace width=\"1em\"></mspace><mi>r</mi><mo>&gt;</mo><mi>g</mi></mrow></math>", "rperiod = APR/m": "<math display=\"block\"><mrow><msub><mi>r</mi><mrow><mtext>period</mtext></mrow></msub><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">APR</mi></mrow><mrow><mi>m</mi></mrow></mfrac></mrow></math>", "EAR = (1 + APR/m)ᵐ − 1": "<math display=\"block\"><mrow><mi mathvariant=\"normal\">EAR</mi><mo>=</mo><mo fence=\"true\" stretchy=\"true\">(</mo><mn>1</mn><mo>+</mo><mfrac><mrow><mi mathvariant=\"normal\">APR</mi></mrow><mrow><mi>m</mi></mrow></mfrac><msup><mo fence=\"true\" stretchy=\"true\">)</mo><mi>m</mi></msup><mo>−</mo><mn>1</mn></mrow></math>", "Effective rate over 1/m year = (1 + EAR)^(1/m) − 1": "<math display=\"block\"><mrow><msub><mi>r</mi><mrow><mn>1</mn><mo>/</mo><mi>m</mi></mrow></msub><mo>=</mo><mo stretchy=\"false\">(</mo><mn>1</mn><mo>+</mo><mi mathvariant=\"normal\">EAR</mi><msup><mo stretchy=\"false\">)</mo><mrow><mn>1</mn><mo>/</mo><mi>m</mi></mrow></msup><mo>−</mo><mn>1</mn></mrow></math>", "PV₀ = 1,000/1.10 + 2,000/1.10² + 3,000/1.10³ = $4,815.93": "<math display=\"block\"><mrow><msub><mi mathvariant=\"normal\">PV</mi><mn>0</mn></msub><mo>=</mo><mfrac><mrow><mn>1,000</mn></mrow><mrow><mn>1.10</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>2,000</mn></mrow><mrow><msup><mn>1.10</mn><mn>2</mn></msup></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>3,000</mn></mrow><mrow><msup><mn>1.10</mn><mn>3</mn></msup></mrow></mfrac><mo>=</mo><mo>$</mo><mn>4,815.93</mn></mrow></math>", "PVordinary = 10,000[1 − 1.11⁻⁵]/0.11 = $36,958.97": "<math display=\"block\"><mrow><msub><mi mathvariant=\"normal\">PV</mi><mrow><mtext>ordinary</mtext></mrow></msub><mo>=</mo><mn>10,000</mn><mfrac><mrow><mn>1</mn><mo>−</mo><msup><mn>1.11</mn><mrow><mo>−</mo><mn>5</mn></mrow></msup></mrow><mrow><mn>0.11</mn></mrow></mfrac><mo>=</mo><mo>$</mo><mn>36,958.97</mn></mrow></math>", "PVdue = PVordinary × 1.11 = $41,024.46": "<math display=\"block\"><mrow><msub><mi mathvariant=\"normal\">PV</mi><mrow><mtext>due</mtext></mrow></msub><mo>=</mo><msub><mi mathvariant=\"normal\">PV</mi><mrow><mtext>ordinary</mtext></mrow></msub><mo>×</mo><mn>1.11</mn><mo>=</mo><mo>$</mo><mn>41,024.46</mn></mrow></math>", "Interestₜ = opening balance × r": "<math display=\"block\"><mrow><msub><mi mathvariant=\"normal\">Interest</mi><mi>t</mi></msub><mo>=</mo><mtext>opening&#160;balance</mtext><mo>×</mo><mi>r</mi></mrow></math>", "Principalₜ = Paymentₜ − Interestₜ": "<math display=\"block\"><mrow><msub><mi mathvariant=\"normal\">Principal</mi><mi>t</mi></msub><mo>=</mo><msub><mi mathvariant=\"normal\">Payment</mi><mi>t</mi></msub><mo>−</mo><msub>< const $ = selector => document.querySelector(selector);
const esc = value => String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let language="zh";
try { const chosen=localStorage.getItem("fina1310-language");if(["zh","en","bi"].includes(chosen))language=chosen; }catch{}
let saved={checks:{},answers:{},manual:{}};
try { const previous=JSON.parse(localStorage.getItem("fina1310-final-progress")||"null");if(previous?.checks&&previous?.answers&&previous?.manual)saved=previous; }catch{}
const persist=()=>{try{localStorage.setItem("fina1310-final-progress",JSON.stringify(saved));}catch{}};
const inlineOrder=Object.keys(inlineMath).sort((a,b)=>b.length-a.length);
const escapedPattern=value=>value.replace(/[.*+?^$\{\}()|\[\]\\]/g,"\\$&");
const inlinePattern=new RegExp("(?<![A-Za-z0-9])(?:"+inlineOrder.map(escapedPattern).join("|")+")(?![A-Za-z0-9])","gu");
function prose(value) {
  let text="",offset=0;
  for(const match of value.matchAll(inlinePattern)) {
    text+=esc(value.slice(offset,match.index))+'<span class="inline-math-scroll">'+inlineMath[match[0]]+'</span>';
    offset=match.index+match[0].length;
  }
  return text+esc(value.slice(offset));
}
function pair(value,block=false) {
  const [zh,en]=value.split(" | ");
  if(en===undefined)return prose(zh);
  const tag=block?"p":"span";
  const zhText='<'+tag+' lang="zh-Hans">'+prose(zh)+'</'+tag+'>';
  const enText='<'+tag+' lang="en" class="minor">'+prose(en)+'</'+tag+'>';
  if(language==="zh")return zhText;
  if(language==="en")return enText;
  return '<'+(block?"div":"span")+' class="'+(block?"text-block bi":"heading")+'">'+zhText+enText+'</'+(block?"div":"span")+'>';
}
const paragraph=value=>pair(value,true);
function maths(value) {
  if(!value?.length)return "";
  const lines=Array.isArray(value)?value:value.split(/\n|\s*•\s*/).filter(Boolean);
  return '<div class="formula" dir="ltr">'+lines.map(line=>mathMarkup[line]||"").join("")+'</div>';
}
function source(ref,label) {
  return '<button class="source-pill" type="button" data-source="'+esc(ref)+'">'+pair(label||"题源与页码 | Source and page")+'</button>';
}
const topicHash=id=>"#topic-"+id;
