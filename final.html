  $("#toolbar-title").innerHTML=pair("FINA1310 期末复习 | FINA1310 Final Revision");
  $("#mobile-toggle").innerHTML=pair("复习目录 | Review menu");
  for(const b of document.querySelectorAll("[data-language]"))b.setAttribute("aria-pressed",String(b.dataset.language===language));
}
function heading(title,description,meta="") {
  return '<header class="hero"><div class="hero-meta">'+pair(meta||"FINA1310 · 期末复习 | FINA1310 · FINAL REVISION")+'</div><h1>'+pair(title)+'</h1><div class="hero-desc">'+paragraph(description)+'</div></header>';
}
function overview() {
  const topics=finalData.lessons;
  const totalChecks=topics.reduce((n,l)=>n+finalData.review[l.id].skills.length,0);
  const checked=Object.values(saved.checks).filter(Boolean).length;
  return heading("把知识点连接成解题能力 | Turn concepts into complete solutions",
    "按 Lecture 1–12 复习理论、公式选择、原题计算链和考试写法，完成逐讲自测后再做跨章节练习。 | Review theory, equation selection, source-based worked solutions and exam-style writing across Lectures 1–12, then move from topic checks to mixed practice.")+
    '<div class="stats"><span>'+pair("12 讲 | 12 lectures")+'</span><span>'+pair("40 道精讲题 | 40 worked examples")+'</span><span>'+pair("48 道逐讲自测 | 48 topic questions")+'</span><span>'+pair("100 分综合练习 | 100-mark mixed practice")+'</span></div>'+
    '<section class="section"><h2>'+pair("怎样使用这一页 | How to use this guide")+'</h2><div class="panel theory">'+
    paragraph("第一轮逐项检查自己能否独立完成题型，先练未掌握的内容。第二轮遮住精讲答案重做，每题写公式、代数、结果与解释。第三轮做综合练习，再按错题回到对应讲。 | First check which tasks you can do independently and review the gaps. Next redo worked examples with solutions hidden, writing formulas, substitutions, results and interpretations. Finally attempt mixed practice and return to the lectures behind your errors.")+
    '<p class="progress-line">'+pair("已勾选掌握 "+checked+" / "+totalChecks+" 项 | Checked as mastered: "+checked+" / "+totalChecks)+'</p>'+
    paragraph("勾选记录用于安排复习。仅在看到题目后能独立选模型、写出代入过程和解释结论时勾选；正确做过熟题还需要用新题检验。记录保存在当前设备。 | Use checks to organize revision. Check a skill when you can independently select the model, show substitutions and explain the conclusion. Use new questions to test familiar skills. Progress is stored on this device.")+'</div></section>'+
    '<section class="section"><h2>'+pair("完整复习清单 | Coverage checklist")+'</h2><div class="topic-grid">'+topics.map(l=>{
      const skills=finalData.review[l.id].skills;
      const done=skills.filter((_,i)=>saved.checks[l.id+"-"+i]).length;
      return '<a class="panel topic-card" href="'+topicHash(l.id)+'"><div class="files">Lecture '+l.id+' · '+done+'/'+skills.length+'</div><h3>'+pair(l.title)+'</h3><p>'+pair(skills.map(x=>x.text.split(" | ")[language==="en"?1:0]).join(" · "))+'</p></a>';
    }).join("")+'</div></section>'+
    '<section class="section"><h2>'+pair("短答题应怎样写 | How to present short answers")+'</h2><div class="panel theory">'+
    paragraph("先写已知条件与时间线，再选择适用理论。列出公式后必须代入题目数字，保留中间精度，最后给单位、结果与明确决策。计算器结果也需要可核查的算式。概念题按定义、条件、作用机制、题目结论组织。 | State the data and timeline, choose the theory and give the equation with numerical substitution. Retain intermediate precision and finish with units, result and decision. Calculator output still needs a verifiable calculation. For concepts, use definition, assumptions, mechanism and application.")+
    paragraph("例如债券题依次列每期票息、每期收益率和剩余付款数；项目题列 t=0、经营期、终结期现金流；回购题先求公司总值，再求价格、股数和股权成本。 | For bonds, identify coupon, periodic yield and remaining periods. For projects, show initiation, operating and terminal flows. For buybacks, find firm value before price, share count and equity cost.")+'</div></section>'+
    '<section class="section"><h2>'+pair("资料依据与范围 | Sources and coverage")+'</h2><div class="panel theory">'+
    paragraph("复习主线为你的 Lecture 1–12、Tutorial 1–10 和 Ross 教材的对应章节。补充题型参考了已有 Final Problem Sets 和旧试卷，题源按钮给出文件及 PDF 页码；网页包含必要题目条件与解答。 | The main scope is your Lectures 1–12, Tutorials 1–10 and corresponding Ross chapters. Additional problem types draw on the available final problem sets and old papers. Source buttons show file and PDF pages; the page itself includes the data and explanations needed to study.")+
    paragraph("文件夹的 2M Final Exam Guidelines 日期为 2026 年 5 月 16 日，属于历史资料。它强调累计考核、MCQ 与短答题、必须写数字代入，并提醒公式表不含全部所需公式。本页以这些答题要求作为练习参考；你当期的考试通知决定具体范围和规则。 | The folder’s 2M Final Exam Guidelines are dated 16 May 2026 and are historical. They describe cumulative assessment, MCQs and short answers, require numerical substitutions and warn that the formula sheet is incomplete. This guide uses those writing requirements for practice; your current notice determines the actual scope and rules.")+
    source("ExamGuide:1-2")+ " "+source("Syllabus:5","课程内容 | Course coverage")+
    '<p class="files">'+pair("原综合概览也可随时打开。 | You can also open the original lecture overview.")+' <a href="guide.html">'+pair("Lecture 1–12 指南 | Lecture 1–12 guide")+'</a></p></div></section>';
}
function theoryCard(t) {
  return '<article class="panel theory"><h3>'+pair(t.title)+'</h3>'+paragraph(t.explanation)+maths(t.equations||t.formula)+(t.use?'<div class="use"><strong>'+pair("什么时候用 | When to use it")+'</strong>'+paragraph(t.use)+'</div>':"")+'</article>';
}
function worked(e,idx) {
  const steps=e.steps.map(s=>'<li>'+paragraph(s.text)+maths(s.equations||s.formula)+'</li>').join("");
  return '<article class="panel example"><header><h3>'+pair(e.title)+'</h3>'+source(e.ref)+'</header><div class="example-body"><div class="prompt">'+paragraph(e.prompt)+'</div>'+
    '<details class="solution"><summary>'+pair("看解题过程和考卷写法 | Show worked solution and exam wording")+'</summary><ol class="steps">'+steps+'</ol><div class="answer">'+paragraph(e.answer)+'</div>'+
    (e.calculator?'<div class="note"><strong>BA II Plus</strong>'+paragraph(e.calculator)+'</div>':"")+
    (e.note?'<div class="note mismatch">'+paragraph(e.note)+'</div>':"")+'</details>'+
    (e.related?.length?'<details class="related"><summary>'+pair("同类题索引 | Related example index")+'</summary><ul>'+e.related.map(r=>'<li>'+source(r.ref,r.title)+'</li>').join("")+'</ul></details>':"")+'</div></article>';
}
function question(q,key,number) {
  const response=saved.answers[key]||{};
  let inputs="";
  if(q.type==="choice"){
    const orders=[[1,0,2],[2,1,0],[0,2,1]];
    const order=orders[number%3];
    inputs='<fieldset aria-labelledby="q-'+key+'">'+order.map(i=>'<label class="option"><input type="radio" name="'+key+'" value="'+i+'"'+(response.value!=null&&Number(response.value)===i?" checked":"")+'> '+pair(q.options[i])+'</label>').join("")+'</fieldset>';
  }else if(q.type==="number"){
    inputs='<input type="text" class="numeric" inputmode="decimal" aria-labelledby="q-'+key+'" value="'+esc(response.value||"")+'">';
  }
  return '<article class="panel quiz-card" id="question-'+key+'"><h3 id="q-'+key+'"><span class="q-num">'+number+'</span>'+pair(q.prompt)+'</h3>'+
    (q.points?'<p class="files">'+q.points+' '+pair("分 | marks")+'</p>':"")+
    (q.type==="written"?"":'<form data-question="'+key+'">'+inputs+'<button class="check" type="submit">'+pair("检查答案 | Check answer")+'</button><div class="feedback" role="status" data-feedback="'+key+'">'+feedbackText(response.status)+'</div></form>')+
    '<details><summary>'+pair("提示 | Hint")+'</summary><div class="reveal">'+paragraph(q.hint)+'</div></details>'+
    '<details class="answer-reveal"><summary>'+pair("参考答案与过程 | Solution and reasoning")+'</summary><div class="reveal">'+maths(q.solutionEquations)+paragraph(q.solution)+'</div></details>'+
    (q.lesson?'<a href="'+topicHash(q.lesson)+'">'+pair("回到相关知识 | Review the related topic")+'</a>':"")+'</article>';
}
function feedbackText(status){
  const labels={
    correct:"答对了。请再检查过程和单位。 | Correct. Also check the reasoning and units.",
    incorrect:"还需重试，可先看提示。 | Try again after using the hint.",
    missing:"请先作答。 | Enter or select an answer first.",
    invalid:"请输入有效数字。 | Enter a valid number."
  };
  return status?pair(labels[status]):"";
}
function topic(id) {
  const l=finalData.lessons[id-1],r=finalData.review[id];
  const quizzes=[...l.quiz,...r.questions];
  return heading(l.title,l.objective,"Lecture "+id+" · 期末复习 | Lecture "+id+" · Final Revision")+
    '<nav class="jump"><a href="#overview">'+pair("总览 | Overview")+'</a><a href="#formulas">'+pair("公式表 | Formula reference")+'</a><a href="#mock">'+pair("综合练习 | Mixed practice")+'</a></nav>'+
    '<section class="section"><h2>'+pair("独立完成这四项 | Four skills to master")+'</h2>'+
    r.skills.map((s,i)=>'<details class="panel skill-card"><summary><span class="skill-title">'+pair(s.text)+'</span></summary><div>'+paragraph(s.explanation)+source(s.ref)+
      '<label class="mastery"><input type="checkbox" data-check="'+id+'-'+i+'"'+(saved.checks[id+"-"+i]?" checked":"")+'> '+pair("我能独立解释并完成对应题型 | I can explain and perform this independently")+'</label></div></details>').join("")+
    '<div class="note mismatch">'+r.traps.map(paragraph).join("")+'</div></section>'+
    '<section class="section"><h2>'+pair("理论、公式和适用条件 | Theory, equations and conditions")+'</h2><div class="theory-list">'+l.theories.map(theoryCard).join("")+r.formulas.map(theoryCard).join("")+'</div>'+
    '<aside class="book-card"><h3>'+pair("Ross 教材补充 | Ross textbook context")+'</h3>'+paragraph(l.reading.explanation)+source(l.reading.ref)+'</aside></section>'+
    '<section class="section"><h2>'+pair("精讲题与变式 | Worked problems and variants")+'</h2><p class="section-help">'+pair("先独立写，再展开过程对照。 | Attempt the problem before revealing the solution.")+'</p>'+
    [...l.examples,...r.examples].map(worked).join("")+'</section>'+
    '<section class="section"><h2>'+pair("逐讲检验 | Check your understanding")+'</h2>'+quizzes.map((q,i)=>question(q,"topic-"+id+"-"+i,i+1)).join("")+'</section>'+
    '<nav class="footer-nav">'+(id>1?'<a class="outline" href="'+topicHash(id-1)+'">'+pair("上一讲 | Previous lecture")+'</a>':"")+
    (id<12?'<a class="outline" href="'+topicHash(id+1)+'">'+pair("下一讲 | Next lecture")+'</a>':'<a class="outline" href="#mock">'+pair("综合练习 | Mixed practice")+'</a>')+'</nav>';
}
function formulas() {
  return heading("选择公式前先确认条件 | Check assumptions before choosing an equation",
    "先看现金流类型、付款日期、利率周期、税务与项目约束，再选择模型。公式表按 12 讲归类。 | Identify the cash-flow pattern, payment timing, rate interval, taxes and constraints before choosing a model. Formulas are grouped by the twelve lectures.")+
    finalData.lessons.map(l=>'<section class="section"><h2><a href="'+topicHash(l.id)+'">Lecture '+l.id+' · '+pair(l.title)+'</a></h2><div class="theory-list">'+[...l.theories,...finalData.review[l.id].formulas].map(theoryCard).join("")+'</div></section>').join("");
}
function mockScore() {
  const auto=finalData.mock.reduce((total,q,i)=>total+(saved.answers["mock-"+i]?.status==="correct"?q.points:0),0);
  const manual=finalData.cases.reduce((total,c,i)=>total+Number(saved.manual[i]||0),0);
  const element=$("#mock-score");
  if(element)element.innerHTML=pair("客观题 "+auto+"/40 · 长题自评 "+manual+"/60 · 合计 "+(auto+manual)+"/100 | Objective "+auto+"/40 · Self-marked written "+manual+"/60 · Total "+(auto+manual)+"/100");
}
function mock() {
  return heading("综合模拟练习 | Mixed examination practice",
    "这是一套根据现有资料知识点编写的原创练习，总分 100。建议预留 120 分钟并闭卷完成，先写下算式再核对。 | This is an original 100-mark practice set based on the supplied course concepts. Allow about 120 minutes and work closed-book, writing calculations before checking.")+
    '<div class="note">'+paragraph("练习时长和分值为本页的训练安排。客观题自动检查 40 分，四道长题按各小问自评共 60 分。练习分数用于找缺口，不直接换算真实考试成绩。 | Duration and marks are practice settings. Objective questions contribute 40 automatically checked marks, and four written cases contribute 60 self-assessed marks. Use scores to locate gaps; they do not map directly to examination grades.")+'</div>'+
    '<div class="score" id="mock-score" role="status"></div>'+
    '<section class="section"><h2>'+pair("客观题与独立计算 · 40 分 | Concepts and standalone calculations · 40 marks")+'</h2>'+finalData.mock.map((q,i)=>question(q,"mock-"+i,i+1)).join("")+'</section>'+
    '<section class="section"><h2>'+pair("跨章节长题 · 60 分 | Multi-step written cases · 60 marks")+'</h2>'+
    finalData.cases.map((c,i)=>'<article class="panel example"><header><h3>'+(i+1)+' · '+pair(c.title)+'</h3><div class="files">'+c.points+' '+pair("分 | marks")+'</div></header><div class="example-body">'+paragraph(c.prompt)+
      '<details class="solution"><summary>'+pair("参考解答和分值 | Model solution and marks")+'</summary><ol class="steps">'+c.steps.map(s=>'<li>'+paragraph(s.text)+maths(s.equations)+'</li>').join("")+'</ol><div class="answer">'+paragraph(c.answer)+'</div></details>'+
      '<label class="self-mark">'+pair("按小问给自己评分（0–15） | Self-assessed marks (0–15)")+' <input type="number" min="0" max="15" step="0.5" inputmode="decimal" data-manual="'+i+'" value="'+esc(saved.manual[i]??"")+'"></label>'+
      '<a href="'+topicHash(c.lesson)+'">'+pair("复习相关讲次 | Review the related lecture")+'</a></div></article>').join("")+'</section>';
}
function render() {
  selected=route();
  document.documentElement.lang=language==="en"?"en":"zh-Hans";
  document.documentElement.dataset.lang=language;
  document.title="FINA1310 · Final Revision";
  navigation();
  const main=$("#main");
  main.innerHTML=selected==="overview"?overview():selected==="formulas"?formulas():selected==="mock"?mock():topic(Number(selected.split("-")[1]));
  mockScore();
}
function getQuestion(key) {
  if(key.startsWith("mock-"))return finalData.mock[Number(key.slice(5))];
  const [,id,i]=key.split("-");
  return [...finalData.lessons[Number(id)-1].quiz,...finalData.review[id].questions][Number(i)];
}
$("#main").addEventListener("submit",e=>{
  const form=e.target.closest("form[data-question]");
  if(!form)return;
  e.preventDefault();
  const key=form.dataset.question,q=getQuestion(key);
  const input=form.querySelector("input:checked,.numeric");
  const value=input?.value??"";
  let status="missing";
  if(q.type==="choice"&&value!=="")status=Number(value)===q.answer?"correct":"incorrect";
  if(q.type==="number"&&value.trim()){
    const raw=value.normalize("NFKC").replace(/[,，\s]/g,"").replace(/−/g,"-");
    const match=raw.match(/^\$?([+-]?(?:\d+(?:\.\d*)?|\.\d+))%?$/);
    const number=match?Number(match[1]):NaN;
    status=!Number.isFinite(number)?"invalid":Math.abs(number-q.answer)<=q.tolerance+1e-9?"correct":"incorrect";
  }
  saved.answers[key]={value,status};persist();
  form.querySelector("[data-feedback]").innerHTML=feedbackText(status);
  form.querySelector("[data-feedback]").dataset.status=status;
  mockScore();
});
$("#main").addEventListener("input",e=>{
  const form=e.target.closest("form[data-question]");
  if(form){
    const key=form.dataset.question;
    saved.answers[key]={value:(form.querySelector("input:checked,.numeric")?.value??""),status:""};
    form.querySelector("[data-feedback]").innerHTML="";persist();mockScore();
  }
  const input=e.target.closest("[data-manual]");
  if(input){
    const n=Number(input.value),index=input.dataset.manual;
    if(input.value===""||(Number.isFinite(n)&&n>=0&&n<=15&&n*2===Math.round(n*2))){
      saved.manual[index]=input.value===""?"":n;input.setCustomValidity("");
    }else input.setCustomValidity(language==="en"?"Enter 0–15 in half-mark steps.":"请输入 0–15，最小间隔 0.5。");
    persist();mockScore();
  }
});
$("#main").addEventListener("change",e=>{
  if(e.target.matches("[data-check]")){saved.checks[e.target.dataset.check]=e.target.checked;persist();}
});
$("#main").addEventListener("click",e=>{
  const sourceButton=e.target.closest("[data-source]");
  if(!sourceButton)return;
  const [key,pages]=sourceButton.dataset.source.split(":");
  const source=finalData.sources[key];
  $("#reference-title").innerHTML=pair("原资料位置 | Source location");
  $("#reference-location").textContent=source.file.split("/").at(-1);
  $("#reference-help").innerHTML=paragraph("PDF 第 "+pages+" 页，按文件第一页计数。 | PDF page "+pages+", counting from the first page of the file.")+
    paragraph("本页题目已包含需要的数据与解答。可用文件名和页码在原课程资料中定位类似题。 | The page includes the data and solution needed for this problem. Use the filename and page number to locate similar questions in the original course material.");
  $("#reference-close").innerHTML=pair("关闭 | Close");
  $("#reference-dialog").showModal();
});
document.querySelector(".language").addEventListener("click",e=>{
  const button=e.target.closest("[data-language]");
  if(!button||button.dataset.language===language)return;
  language=button.dataset.language;try{localStorage.setItem("fina1310-language",language);}catch{}
  render();window.scrollTo(0,0);
});
$("#mobile-toggle").addEventListener("click",()=>{
  const open=$("#mobile-toggle").getAttribute("aria-expanded")!=="true";
  $(".sidebar").dataset.open=String(open);$("#mobile-toggle").setAttribute("aria-expanded",String(open));
});
$("#lecture-nav").addEventListener("click",e=>{
  if(e.target.closest("a")){$(".sidebar").dataset.open="false";$("#mobile-toggle").setAttribute("aria-expanded","false");}
});
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0);});
render();
</script>
