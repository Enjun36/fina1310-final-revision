<script>const finalData = {"lessons": [{"id": 1, "title": "公司金融导论 | Introduction to Corporate Finance", "objective": "分清投资、融资和日常资金管理，并能用股东与经理人的利益解释代理问题。 | Classify investment, financing, and day-to-day cash decisions, then explain agency conflicts using the incentives of owners and managers.", "reading": {"ref": "Ross:49-63", "explanation": "Ross 第 1 章把项目判断拆成未来现金流的金额、时间与风险，并用经理薪酬和公司控制说明如何约束代理问题。这里的判断标准是当前股权价值，不能靠单看当期利润来代替。 | Ross Chapter 1 frames investment decisions around the amount, timing, and risk of future cash flows. It uses compensation and corporate control to explain how agency conflicts can be addressed. Current equity value is the objective; current earnings alone are an incomplete measure."}, "theories": [{"title": "财务经理的三类决策 | Three financial decisions", "explanation": "资本预算选长期项目，资本结构选长期资金来源，营运资本管理处理短期资产与负债。 | Capital budgeting selects long-term investments, capital structure chooses long-term funding, and working capital management handles short-term assets and liabilities.", "formula": "NWC = current assets − current liabilities", "use": "题目问短期资金缓冲时可计算 NWC。若问为什么出现流动性危机，还要看现金到期时点和融资可得性。 | Use NWC for the short-term balance-sheet cushion. To explain a liquidity crisis, also examine cash timing and access to financing."}, {"title": "企业形式与财务目标 | Business forms and the financial objective", "explanation": "独资的所有权集中，合伙由多个出资人共同经营或出资，公司法人通常让股东责任以出资为限，并较易转让持股与筹资。财务目标是提高当前股权的市场价值。 | A sole proprietor has concentrated ownership, a partnership combines multiple owners, and a corporation generally offers limited shareholder liability, more transferable ownership, and broader funding access. The financial objective is to increase the current market value of equity.", "formula": "", "use": "比较企业形式时写明比较维度，如责任、筹资、控制或持续经营。解释目标时联系未来现金流与风险。 | Compare legal forms using liability, capital access, control, or continuity. Explain the financial objective in terms of future cash flows and risk."}, {"title": "委托代理与金融市场 | Agency and financial markets", "explanation": "股东委托管理层经营，双方目标不一致时会产生代理成本。一级市场发行新证券，二级市场交易已发行证券并提供流动性。 | Shareholders delegate management, and conflicting incentives create agency costs. A primary market issues new securities. A secondary market trades existing securities and provides liquidity.", "formula": "", "use": "给出行为、谁获益以及股东价值受影响的渠道。区分发行所得与投资者之间的交易。 | Identify the action, beneficiary, and effect on shareholder value. Distinguish issuer proceeds from trading between investors."}], "examples": [{"title": "Northern Rock 的流动性问题 | Northern Rock’s liquidity problem", "ref": "L1:16-17", "prompt": "讲义指出 Northern Rock 此前盈利，但货币市场融资受阻，随后出现挤兑。解释这主要是哪类财务管理问题。 | The lecture describes a previously profitable Northern Rock losing access to money-market funding and then facing a run. Classify the immediate financial-management problem.", "steps": [{"text": "先抓题目中的时间线。融资收紧时，银行必须立即应对到期债务及存款提取。 | Start with timing. When funding tightened, the bank still had to meet maturing obligations and withdrawals.", "formula": ""}, {"text": "比较现金进出能否匹配。长期贷款不会同时收回，短期现金缺口可能在账面利润仍为正时出现。 | Compare the timing of cash inflows and outflows. Long-term loans do not all repay at once, so an immediate cash shortfall can coexist with positive accounting profit.", "formula": ""}, {"text": "用营运资本与流动性管理作归类，写出融资受阻如何导致无法持续覆盖短期现金需求。 | Classify the problem as working capital and liquidity management, and explain how lost funding can make short-term cash demands hard to meet.", "formula": ""}], "answer": "这是短期资产与负债管理问题。批发融资受阻，加上存款提取，使银行难以用可立即动用的资金履行短期义务。 | This is a short-term asset and liability management problem. Lost wholesale funding and deposit withdrawals made it difficult to meet immediate obligations with readily available cash.", "related": [{"ref": "L1:5-7", "title": "对比长期投资决策案例 | Contrast the long-term investment cases"}, {"ref": "L1:12-15", "title": "比较借款与短期现金管理 | Compare borrowing and short-term cash management"}, {"ref": "T1:3", "title": "用三类决策重做归类 | Reclassify using the three decision categories"}, {"ref": "Ross:64-65", "title": "教材的企业形式与资本预算概念题 | Textbook concept questions on business forms and capital budgeting"}]}, {"title": "私人飞机与审计费 | Private jet and audit fees", "ref": "T1:6", "prompt": "Tutorial 用高管私人飞机和审计费说明直接代理成本。解释各自为什么可能产生代理成本，并举出资料中的间接成本。 | The tutorial uses an executive’s private jet and audit fees as direct agency costs. Explain the mechanism for each and identify the indirect cost used in class.", "steps": [{"text": "写清委托人与代理人。股东是委托人，管理层是代理人。 | Identify the principal and agent. Shareholders are principals and managers are agents.", "formula": ""}, {"text": "把为高管私人利益支出的额外费用，与股东为了监督而付出的审计费分开。两者都可直接发生支出。 | Separate incremental spending on a managerial perk from audit costs paid to monitor management. Both can create a direct outlay.", "formula": ""}, {"text": "间接成本举出错失投资机会。经理为保住职位回避对股东有价值的项目，损失体现为本可以创造的价值。 | For the indirect cost, identify a lost investment opportunity. A manager protecting their job might avoid a valuable project, costing shareholders the value it could have created.", "formula": ""}], "answer": "额外的私人飞机支出是高管福利，审计费是监督成本，两者都属于直接代理成本。错过有价值的项目属于间接代理成本。 | Excess private-jet spending is a managerial perk and audit fees are monitoring costs. Both are direct agency costs. A foregone valuable project is an indirect agency cost.", "related": [{"ref": "L1:36-37", "title": "辨认直接与间接代理成本 | Identify direct and indirect agency costs"}, {"ref": "L1:42-44", "title": "比较薪酬激励和董事会监督案例 | Compare incentive pay and board oversight"}, {"ref": "Ross:65", "title": "第 1 章第 6–7 题，目标与代理关系 | Chapter 1 questions 6–7 on objectives and agency"}]}], "quiz": [{"type": "choice", "prompt": "公司发行新股时，资金通常先流向谁？ | Who usually receives the proceeds of a new share issue?", "options": ["发行公司 | The issuing firm", "二级市场卖出旧股的投资者 | A secondary-market seller", "所有竞争对手 | All competitors"], "answer": 0, "hint": "先判断证券是新发行还是已流通。 | Ask whether the shares are newly issued or already outstanding.", "solution": "新股首次发行属于一级市场，发行所得归发行公司。 | A primary-market issue raises funds for the issuer."}, {"type": "choice", "prompt": "经理为保住职位而拒绝了股东本可获益的项目。这是哪类成本？ | A manager turns down a shareholder-value-creating project to protect their job. What is this cost?", "options": ["间接代理成本 | Indirect agency cost", "票息 | Coupon interest", "监控费用 | Monitoring expense"], "answer": 0, "hint": "有没有一笔直接列账的支出？ | Is there a direct outlay to record?", "solution": "价值损失来自错失的机会，因此是间接代理成本。 | The value is lost through a missed opportunity, so this is an indirect agency cost."}, {"type": "written", "prompt": "公司能提高当期利润，但必须削减未来很可能创造大量现金流的研发。说明应如何评估。 | A company can raise current earnings by cutting R&D likely to generate substantial future cash flows. Explain how to evaluate the decision.", "hint": "先写目标，再写现金流的三项维度。 | Start with the objective, then state the three cash-flow dimensions.", "solution": "比较两种方案的未来增量现金流、时间和风险，选择提高当前股权价值的方案。得分点：股权价值目标、增量现金流、时间与风险。 | Compare future incremental cash flows, timing, and risk across the two options. Choose the option that increases current equity value. Credit: equity value objective, incremental cash flow, timing and risk."}]}, {"id": 2, "title": "货币时间价值 | Time Value of Money", "objective": "能画单笔现金流的时间线，并根据已知量求现值、终值、利率或期数。 | Draw a single-cash-flow timeline and solve for present value, future value, return, or number of periods.", "reading": {"ref": "Ross:172-187", "explanation": "Ross 第 5 章用复利说明利息也会继续赚利息，并把隐含回报与期数视为同一条 PV–FV 关系的不同未知数。 | Ross Chapter 5 shows why accrued interest itself earns interest and treats the implied rate and number of periods as different unknowns in the same PV–FV relationship."}, "theories": [{"title": "终值与复利 | Future value and compounding", "explanation": "复利每期在当前余额上计息，单利每期只对原本金计息。 | Compound interest applies to the running balance. Simple interest applies only to the original principal.", "formula": "FVₙ = PV(1 + r)ⁿ   •   FV(simple) = PV(1 + nr)", "use": "把今天的钱移到第 n 期。r 是每期利率，n 是同单位的期数。 | Move money from today to period n. The periodic rate r and count n must use the same interval."}, {"title": "现值与折现 | Present value and discounting", "explanation": "折现反向移动现金流，从未来金额得到现在需要投入的金额。 | Discounting moves a future amount backward to find what it is worth now.", "formula": "PV = FVₙ / (1 + r)ⁿ", "use": "已知未来金额、利率和期限时求现在的等价金额。正利率下 PV 应小于 FV。 | Find today’s equivalent amount given a future amount, rate and horizon. With a positive rate, PV should be smaller than FV."}, {"title": "反求利率与期数 | Solving for the rate and time", "explanation": "同一笔资金的增长倍数是 FV/PV。用开 n 次方求 r，或取对数求 n。 | The growth multiple is FV/PV. Take the nth root for r or logarithms for n.", "formula": "r = (FV/PV)^(1/n) − 1   •   n = ln(FV/PV) / ln(1 + r)", "use": "PV、FV 用正的金额大小代数求解；计算器的现金流输入则采用相反符号。 | Use positive magnitudes for algebra. Enter opposite cash-flow signs in the calculator."}], "examples": [{"title": "两年后的复利余额 | A balance after two years of compounding", "ref": "L2:19-20", "prompt": "今天存入 $1,000，年复利 5%，求第二年末余额。 | Deposit $1,000 today at 5% compounded annually. Find the end-of-year-two balance.", "steps": [{"text": "画 t=0、1、2。$1,000 在 t=0，目标是 t=2，沿时间线向前复利。 | Mark t=0, 1 and 2. The $1,000 is at t=0, so compound forward to t=2.", "formula": ""}, {"text": "第一年末变成 $1,050；第二年对 $1,050 计息，第二年利息为 $52.50。 | The first year ends at $1,050. The second year earns interest on $1,050, producing $52.50 in interest.", "formula": "FV₂ = 1,000 × 1.05² = $1,102.50"}, {"text": "用单利 $1,100 作检查。差额 $2.50 是首年 $50 利息在第二年赚到的利息。 | Compare with the simple-interest balance of $1,100. The extra $2.50 is year-two interest on the year-one interest.", "formula": ""}], "answer": "第二年末余额为 $1,102.50，计算式为 $1,000 × 1.05²。 | The account balance at the end of year two is $1,102.50, calculated as $1,000 × 1.05².", "related": [{"ref": "L2:14-15", "title": "对照同本金同利率的单利题 | Compare simple interest with the same principal and rate"}, {"ref": "L2:22-23", "title": "把存款期限拉长 | Extend the investment horizon"}, {"ref": "T1:18-21", "title": "练期初／期末与单复利对比 | Practice beginning/end timing and simple versus compound interest"}, {"ref": "P2:4-7", "title": "把终值问题反过来求 PV | Reverse the direction and find PV"}], "calculator": "N=2，I/Y=5，PV=−1000，PMT=0，CPT FV。 | Set N=2, I/Y=5, PV=−1000, PMT=0, then CPT FV."}, {"title": "从投入与收回金额反推利率 | Infer return from the initial and final amounts", "ref": "T1:26-31", "prompt": "取 Tutorial 三选一的前两个选项。A 今天投 $500、五年后获 $600；B 每年付 4%。只比较收益率时，哪项更高？ | Take the first two options from the tutorial. A costs $500 now and pays $600 in five years; B earns 4% annually. Which has the higher return?", "steps": [{"text": "A 的钱只在 t=0 和 t=5 流动，因此 PMT=0，未知量是每年回报。 | A has cash flows at t=0 and t=5 only, so PMT=0 and the unknown is the annual return.", "formula": ""}, {"text": "把五年总增长倍数开五次方，得到等效年增长倍数。 | Take the fifth root of the five-year growth multiple to obtain the annual growth factor.", "formula": "r = (600/500)^(1/5) − 1 = 3.7137%"}, {"text": "比较 3.71% 和 4.00%。同样的五年期限下，4% 对应的终值约为 $608.33。 | Compare 3.71% with 4.00%. On the same five-year horizon, 4% gives a future value of about $608.33.", "formula": ""}], "answer": "A 的隐含年回报约为 3.71%。只比较题设收益率，B 的 4.00% 较高。 | A has an implied annual return of about 3.71%. On the stated returns alone, B ranks higher at 4.00%.", "related": [{"ref": "T1:28-31", "title": "继续做扣费及第三个投资选项 | Continue to the fee adjustment and third investment"}, {"ref": "L2:39-40", "title": "再练从期末金额和持有期反求回报 | Infer rates from terminal values and horizons"}, {"ref": "L2:43", "title": "改成反求多少期才能达到目标 | Switch the unknown to the number of periods"}, {"ref": "Ross:184-188", "title": "教材的隐含利率与期数算例 | Textbook examples on the implied rate and time"}], "calculator": "N=5，PV=−500，FV=600，PMT=0，CPT I/Y。 | Set N=5, PV=−500, FV=600, PMT=0, then CPT I/Y."}], "quiz": [{"type": "choice", "prompt": "给定未来金额和固定期限，折现率升高时现值怎么变化？ | With the future amount and term fixed, what happens to PV as the discount rate rises?", "options": ["下降 | Falls", "上升 | Rises", "不变 | Stays the same"], "answer": 0, "hint": "检查 PV 公式的分母。 | Look at the denominator of the PV formula.", "solution": "分母随折现率升高而变大，因此现值下降。 | A higher discount rate increases the denominator, lowering PV."}, {"type": "number", "prompt": "今天存 $800，年复利 6%，3 年后余额是多少？填金额，保留两位小数。 | Deposit $800 today at 6% compounded annually. What is the balance after three years? Enter dollars to two decimals.", "answer": 952.81, "tolerance": 0.01, "hint": "向未来移动三期。 | Move forward three periods.", "solution": "FV = 800 × 1.06³ = $952.81。 | FV = 800 × 1.06³ = $952.81."}, {"type": "written", "prompt": "三年总收益率是 21%。为什么等效年利率一般不能直接写成 7%？ | The total return over three years is 21%. Why is 7% generally an incorrect equivalent annual rate?", "hint": "写出三年增长倍数。 | Write the three-year accumulation factor.", "solution": "应满足 (1+r)³=1.21，所以 r≈6.56%。得分点：复利乘积、正确开立方、年利率单位。 | Solve (1+r)³=1.21 to get r≈6.56%. Credit: compound growth, correct cube root, annual units."}]}, {"id": 3, "title": "折现现金流估值 | Discounted Cash Flow Valuation", "objective": "能识别不规则现金流、普通年金、先付年金、永续年金，并统一利率口径。 | Recognize uneven cash flows, ordinary annuities, annuities due, and perpetuities, and match rates to payment periods.", "reading": {"ref": "Ross:197-217", "explanation": "Ross 第 6 章先用逐笔折现建立直觉，再将重复现金流化成年金或永续年金，并区分报价年利率与实际年利率。在 r=g 的有限增长年金里，每一项折现后都相同，可逐项相加。 | Ross Chapter 6 starts with individual cash flows, then simplifies repeated payments into annuities or perpetuities and distinguishes quoted from effective annual rates. If r=g in a finite growing annuity, the discounted payments are equal and can be added directly."}, "theories": [{"title": "不规则现金流 | Uneven cash flows", "explanation": "每笔钱先折算到同一日期再加总，期限取该笔钱距离估值日的期数。 | Translate each payment to the same date before adding. The exponent is that payment’s distance from the valuation date.", "formula": "PV₀ = Σ[CFₜ / (1 + r)ᵗ]   •   FVₙ = Σ[CFₜ(1 + r)^(n−t)]", "use": "有不同金额，或有暂停付款时，可逐笔计算。C₀ 已发生在估值日，折现因子为 1。 | Discount separately for unequal amounts or payment gaps. A time-zero flow has a discount factor of 1."}, {"title": "年金与永续年金 | Annuities and perpetuities", "explanation": "普通年金首笔在 t=1。先付年金的每笔款项都早一期。永续年金一直支付。 | An ordinary annuity starts at t=1. Every payment in an annuity due comes one period earlier. A perpetuity pays indefinitely.", "formula": "PVordinary = C[1 − (1+r)⁻ⁿ]/r   •   PVdue = PVordinary(1+r)\nFVordinary = C[(1+r)ⁿ − 1]/r   •   FVdue = FVordinary(1+r)\nPVperpetuity = C₁/r   •   PVgrowing perpetuity = C₁/(r−g), r>g", "use": "C 是每期金额。有限增长年金的现值为 C₁[1−((1+g)/(1+r))ⁿ]/(r−g)，若 r=g 则为 nC₁/(1+r)。递延期要额外折回。 | C is the per-period payment. For a finite growing annuity, PV is C₁[1−((1+g)/(1+r))ⁿ]/(r−g), or nC₁/(1+r) when r=g. Discount again if payments are deferred."}, {"title": "APR 与 EAR | APR and EAR", "explanation": "APR 是报价口径，EAR 是一年实际复利增长。m 表示每年计息次数。 | APR is a quotation convention. EAR measures actual one-year compounded growth, and m is the number of compounding periods per year.", "formula": "rperiod = APR/m   •   EAR = (1 + APR/m)ᵐ − 1\nEffective rate over 1/m year = (1 + EAR)^(1/m) − 1", "use": "比较不同复利频率用 EAR，按月折现就用与月份相配的有效月利率。 | Use EAR to compare compounding frequencies. For monthly discounting, use an effective monthly rate."}], "examples": [{"title": "三笔不规则现金流的现值 | Present value of three uneven cash flows", "ref": "L3:7-8", "prompt": "未来第 1、2、3 年末分别收 $1,000、$2,000 和 $3,000。所需年回报为 10%，今天最多愿意付多少？ | Receive $1,000, $2,000 and $3,000 at the ends of years 1, 2 and 3. At a required return of 10%, what is the maximum price today?", "steps": [{"text": "列出 t=1、2、3 的金额。三笔不相等，逐笔折现。 | Label each amount at t=1, 2 and 3. Use individual discounting because the amounts differ.", "formula": ""}, {"text": "每笔的指数是它距离今天的年数，求和时保留未四舍五入的中间值。 | Each exponent is the number of years to today. Keep unrounded intermediate values when adding.", "formula": "PV₀ = 1,000/1.10 + 2,000/1.10² + 3,000/1.10³ = $4,815.93"}, {"text": "若实际价格就等于现值，按 10% 折现时 NPV 为零。 | If the purchase price equals this PV, NPV at 10% is zero.", "formula": ""}], "answer": "今天愿付的最高价约为 $4,815.93，即三笔未来现金流按 10% 折现后的合计。 | The maximum price is about $4,815.93, the sum of the three cash flows discounted at 10%.", "related": [{"ref": "L3:12-14", "title": "改练含初始成本的 NPV 和储蓄目标 | Add an initial cost or a future savings goal"}, {"ref": "P3:2-3", "title": "把各笔现金流复利到相同终点 | Compound each cash flow to a common future date"}, {"ref": "Ross:197-203", "title": "教材多笔现金流算例 | Textbook worked examples on multiple cash flows"}]}, {"title": "普通年金与先付年金对照 | Ordinary annuity versus annuity due", "ref": "T2:5-12", "prompt": "每年收到 $10,000，共 5 笔，年折现率 11%。比较第一笔在一年后和第一笔在今天时的现值。 | Receive five annual payments of $10,000 at an 11% discount rate. Compare present values when the first payment arrives in one year and when it arrives today.", "steps": [{"text": "一年后开始的付款在 t=1,2,3,4,5，使用普通年金。 | The first schedule pays at t=1,2,3,4,5, so use an ordinary annuity.", "formula": "PVordinary = 10,000[1 − 1.11⁻⁵]/0.11 = $36,958.97"}, {"text": "今天开始时付款改在 t=0,1,2,3,4。每笔少折现一期。 | The second schedule pays at t=0,1,2,3,4, so every payment is discounted for one fewer period.", "formula": "PVdue = PVordinary × 1.11 = $41,024.46"}, {"text": "合理性检查。两组的金额和笔数相同，收到钱更早的先付年金在正折现率下价值更高。 | Check the direction. The same payments arrive sooner in the due schedule, giving it a higher PV at a positive rate.", "formula": ""}], "answer": "普通年金现值 $36,958.97；先付年金现值 $41,024.46，等于普通年金现值乘 1.11。 | The ordinary annuity is worth $36,958.97. The annuity due is worth $41,024.46, equal to the ordinary annuity PV times 1.11.", "related": [{"ref": "T2:13-16", "title": "反求付款笔数，或处理不同利率 | Solve for payment count or handle changing rates"}, {"ref": "L3:40", "title": "把先付年金改求三年末终值 | Find the future value of a due annuity"}, {"ref": "L3:43-44", "title": "对比增长年金与增长永续年金 | Compare growing annuity and growing perpetuity"}, {"ref": "T2:17-21", "title": "永续与递延题 | Perpetuity and timing exercises"}, {"ref": "T2:22-28", "title": "把复利频率改成半年或每周，练 APR 与 EAR | Change compounding to semiannual or weekly and practice APR and EAR"}, {"ref": "P3:10-13", "title": "反求 APR，并把月利率或日利率用于估值 | Recover APR and use monthly or daily rates in valuation"}], "calculator": "N=5，I/Y=11，PMT=10000，FV=0，CPT PV。普通年金用 END；先付用 BGN，做完切回 END。 | Set N=5, I/Y=11, PMT=10000, FV=0, then CPT PV. Use END for ordinary and BGN for due. Restore END afterward."}], "quiz": [{"type": "choice", "prompt": "从今天开始每年收款，共六次，该选什么模型？ | You receive six annual payments starting today. Which model applies?", "options": ["先付年金 | Annuity due", "普通年金 | Ordinary annuity", "永续年金 | Perpetuity"], "answer": 0, "hint": "找第一笔和最后一笔。 | Locate the first and final payments.", "solution": "首笔现在发生且笔数有限，用先付年金。 | The first payment is immediate and the stream is finite, so use an annuity due."}, {"type": "number", "prompt": "APR 为 12%，按月复利。输入 EAR 的百分数，保留两位，例如 8.25 表示 8.25%。 | An APR of 12% compounds monthly. Enter the EAR as a percentage, to two decimals, e.g. 8.25 for 8.25%.", "answer": 12.68, "tolerance": 0.01, "hint": "月利率是 APR 除以 12，再复利 12 期。 | Divide APR by 12, then compound 12 times.", "solution": "EAR=(1+0.12/12)¹²−1≈12.68%。 | EAR=(1+0.12/12)¹²−1≈12.68%."}, {"type": "written", "prompt": "从 t=3 开始每年永续支付 $200，r=5%。写出今天的估值，解释为什么要再折现。 | A perpetuity pays $200 annually starting at t=3. At 5%, find its value today and explain the extra discounting.", "hint": "C/r 的估值点在首笔现金流前一期。 | C/r gives value one period before the first payment.", "solution": "t=2 的价值为 $4,000，再折两期得 $3,628.12。得分点：首笔 t=3、估值点 t=2、折回 t=0。 | Value at t=2 is $4,000. Discount it two periods to obtain $3,628.12. Credit: first payment t=3, valuation t=2, discount to t=0."}]}, {"id": 4, "title": "利率与债券估值 | Interest Rates and Bond Valuation", "objective": "先把到期年数、票息与收益率换成同一付款周期，再求价格或收益率。 | Align maturity, coupons, and yield to the payment period before finding price or yield.", "reading": {"ref": "Ross:243-253", "explanation": "Ross 第 7 章将债券拆成票息年金和面值一次性偿还。债券现金流既定时，市场要求的收益率一变，价格就要调整。第 7 章后段另区分名义利率、实际利率和期限结构。 | Ross Chapter 7 treats a bond as a coupon annuity plus a face-value payment. With promised payments fixed, price adjusts when the market-required yield changes. Later sections distinguish nominal rates, real rates, and the term structure."}, "theories": [{"title": "贷款摊还 | Loan amortization", "explanation": "纯贴现贷款只在期末付款，付息贷款定期付息并在到期偿还本金，摊还贷款逐期减少本金。 | A pure-discount loan makes one terminal payment. An interest-only loan pays interest periodically and repays principal at maturity. An amortizing loan reduces principal over time.", "formula": "Interestₜ = opening balance × r   •   Principalₜ = Paymentₜ − Interestₜ", "use": "固定分期额可由贷款现值反求 PMT。最后一期后余额应为零。 | Solve for PMT from the loan PV for level payments. The balance should be zero after the last installment."}, {"title": "票息、债券价格与 YTM | Coupons, bond price, and YTM", "explanation": "票息率决定合约支付，YTM 是把承诺现金流折现到市场价的收益率。 | The coupon rate determines contractual payments. YTM discounts promised payments to the market price.", "formula": "C = F × coupon rate/m   •   n = years remaining × m\nP = C[1 − (1+y)⁻ⁿ]/y + F/(1+y)ⁿ", "use": "F 是面值，y 是每期收益率。若 YTM 以名义年率报价，y=YTM/m。求 YTM 时把 P 代入、求 y，再按所需口径年化。 | F is face value and y is the periodic yield. For a nominal annual YTM, y=YTM/m. To find YTM, insert P, solve for y, and annualize to the requested convention."}, {"title": "收益率口径与利率风险 | Yield measures and interest-rate risk", "explanation": "当前收益率只衡量一年票息相对价格。价格随 YTM 反向变化；其他条件相同，较久到期或较低票息通常对利率更敏感。 | Current yield measures annual coupons relative to price. Price moves inversely with YTM. All else equal, longer maturity or a lower coupon generally increases rate sensitivity.", "formula": "Current yield = annual coupon/P   •   1 + nominal rate = (1 + real rate)(1 + inflation)", "use": "费雪关系用于匹配名义／实际现金流与贴现率。期限结构描述不同期限的利率；同期限债券的信用或流动性也会影响收益率。 | Match nominal or real cash flows to the corresponding Fisher-adjusted rate. The term structure describes rates across maturities. Credit and liquidity affect yields within a maturity."}], "examples": [{"title": "年付债券的折价 | Discount pricing for an annual-coupon bond", "ref": "P4:2", "prompt": "面值 $1,000，票息率 10%，每年付息，5 年到期，YTM 11%。求债券价格。 | Face value $1,000, 10% coupons paid annually, five years to maturity, YTM 11%. Find the price.", "steps": [{"text": "票息 $100 每年；t=5 同时收到最后一期票息和 $1,000 面值。 | The annual coupon is $100. At t=5 the final coupon and $1,000 face value both arrive.", "formula": ""}, {"text": "用 11% 分别折现五期票息年金和到期面值，再加总。 | At 11%, discount the five coupons as an annuity and face value as a lump sum, then add.", "formula": "P = 100[1 − 1.11⁻⁵]/0.11 + 1,000/1.11⁵ = $963.04"}, {"text": "11% 高于 10% 的票息率，价格应低于 $1,000。 | The 11% yield exceeds the 10% coupon rate, so price should be below $1,000.", "formula": ""}], "answer": "债券价值为 $963.04，低于面值，因此是折价债券。 | The bond is worth $963.04 and trades below par, making it a discount bond.", "related": [{"ref": "P4:6", "title": "把折价改成溢价情形 | Change to a premium-bond case"}, {"ref": "L4:34", "title": "区别当前收益率与 YTM | Distinguish current yield and YTM"}, {"ref": "Ross:249-251", "title": "用市场价格反求 YTM | Solve for YTM from market price"}], "calculator": "N=5，I/Y=11，PMT=100，FV=1000，CPT PV，显示约 −963.04。 | Enter N=5, I/Y=11, PMT=100, FV=1000, then CPT PV. The display is about −963.04."}, {"title": "已发行两年的半年付债券 | A semiannual bond issued two years ago", "ref": "T3:17-20", "prompt": "Raffles 的 12 年期债券已发行两年，票息 6.5%，面值 $1,000，半年付息。求名义年 YTM 为 7.4% 时的价格。再看 YTM 升至 9% 时的价格和当前收益率。 | Raffles issued 12-year bonds two years ago. They pay 6.5% coupons semiannually on $1,000 par. Price them at a 7.4% quoted annual YTM, then find the price and current yield at 9%.", "steps": [{"text": "剩余 10 年，每年两次，共 20 期。每期票息 $32.50，7.4% 对应每期收益率 3.7%。 | Ten years remain, so count 20 payments. The coupon is $32.50 per period and a 7.4% annual quote gives 3.7% per period.", "formula": ""}, {"text": "先折现票息，再折现面值。若报价 YTM 改为 9%，只改每期折现率。 | Discount coupons and face value separately. At a 9% annual quote, change only the discount rate.", "formula": "P₇.₄% = 32.5[1−1.037⁻²⁰]/0.037 + 1,000/1.037²⁰ = $937.19\nP₉% = 32.5[1−1.045⁻²⁰]/0.045 + 1,000/1.045²⁰ = $837.40"}, {"text": "当前收益率的分子是一年两笔票息 $65。 | Use a full year’s coupons of $65 for current yield.", "formula": "Current yield at 9% quoted YTM = 65/837.4008 = 7.76%"}], "answer": "7.4% 和 9% 对应价格分别为 $937.19 和 $837.40。后一情形的当前收益率约为 7.76%。 | The prices at 7.4% and 9% are $937.19 and $837.40. Current yield in the second case is about 7.76%.", "related": [{"ref": "P4:3-5", "title": "半年付息和变更收益率 | Semiannual cash flows and a change in yield"}, {"ref": "T3:21-22", "title": "把未知量换成剩余到期时间 | Solve for the time remaining to maturity"}, {"ref": "T3:24-25", "title": "加入通胀与实际现金流 | Add inflation and real cash flows"}, {"ref": "L4:9-12", "title": "同样用年金处理分期贷款 | Apply annuity logic to amortizing loans"}], "calculator": "确认 P/Y=C/Y=1，手动用每半年的输入。N=20，I/Y=3.7 或 4.5，PMT=32.5，FV=1000，CPT PV。 | Verify P/Y=C/Y=1 and enter the semiannual values manually. Use N=20, I/Y=3.7 or 4.5, PMT=32.5, FV=1000, then CPT PV."}], "quiz": [{"type": "choice", "prompt": "两只同面值同到期日的普通债券，市场 YTM 相同，哪只价格较高？ | Two otherwise comparable bonds share face value, maturity and YTM. Which is worth more?", "options": ["票息较高的债券 | The higher-coupon bond", "票息较低的债券 | The lower-coupon bond", "必定同价 | They must have the same price"], "answer": 0, "hint": "只改变票息现金流。 | Only the coupon cash flows change.", "solution": "较高票息的现值较大。 | Larger coupons have a larger present value."}, {"type": "number", "prompt": "面值 $1,000，票息率 8%，半年付息，还剩 3 年，报价年 YTM 6%。求价格，保留两位。 | A $1,000 par bond pays 8% semiannually, has three years left, and yields 6% quoted annually. Enter its price to two decimals.", "answer": 1054.17, "tolerance": 0.02, "hint": "六期，票息 $40，每期收益率 3%。 | Use six periods, $40 per coupon, and 3% per period.", "solution": "P=40[1−1.03⁻⁶]/0.03+1,000/1.03⁶≈$1,054.17。 | P=40[1−1.03⁻⁶]/0.03+1,000/1.03⁶≈$1,054.17."}, {"type": "written", "prompt": "一个债券的票息率是 4%，YTM 是 6%。说明为什么票息仍按 4% 算、求价格却用 6% 折现。 | A bond’s coupon rate is 4% and YTM is 6%. Explain why coupons use 4% but valuation discounts at 6%.", "hint": "区分合约现金流和市场要求。 | Distinguish contractual cash flows from market return requirements.", "solution": "票息率作用在面值上，决定合约支付；YTM 是市场给定的折现率。其他条件标准时，市场回报高于票息率意味着折价。得分点：面值基数、折现角色、折价方向。 | The coupon rate is applied to face value to determine promised payments. YTM is the market discount rate. In the standard case, yield above coupon rate implies a discount. Credit: par-value base, discounting role, price direction."}]}, {"id": 5, "title": "股票估值 | Stock Valuation", "objective": "能根据股利增长路径划分阶段，正确定位终值并反推要求回报。 | Split dividends into growth phases, place terminal value correctly, and infer required return when appropriate.", "reading": {"ref": "Ross:287-296", "explanation": "Ross 第 8 章从下一年股利和未来出售价值出发，并把出售价格继续展开成未来股利。非恒定增长时，先逐笔估计早期股利，再在稳定增长开始前一期计算终值。 | Ross Chapter 8 starts with next year’s dividend and resale price, then expands the resale price into later dividends. For nonconstant growth, forecast early dividends separately and place terminal value one period before stable-growth payments begin."}, "theories": [{"title": "股利折现与优先股 | Dividend discounting and preferred stock", "explanation": "一股的价值是未来股利折现值。固定股利无限期支付时可用永续年金，有限期则按年金处理，并把赎回额单独折现。 | A share is worth the present value of its future dividends. Use a perpetuity for indefinite fixed dividends, or an annuity plus any separately discounted redemption amount for a finite stream.", "formula": "P₀ = Σ[Dₜ/(1+R)ᵗ]   •   Pfixed perpetual = D/R", "use": "Dₜ 是第 t 期股利，R 是风险匹配的每期要求回报。 | Dₜ is the period-t dividend and R is the risk-matched periodic required return."}, {"title": "恒定增长与收益率分解 | Constant growth and return decomposition", "explanation": "Gordon 模型适合股利永续按 g 增长且 R>g。D₀ 是刚发的股利，D₁ 才是买入者将收到的下一期股利。 | The Gordon model assumes perpetual dividend growth g and R>g. D₀ was just paid. D₁ is the next payment a buyer receives.", "formula": "D₁ = D₀(1+g)   •   P₀ = D₁/(R−g)   •   R = D₁/P₀ + g", "use": "可求股价或反求回报。恒定增长假设下，g 同时是资本利得收益率。 | Find price or infer required return. Under constant growth, g is also the capital gains yield."}, {"title": "多阶段股利与估值倍数 | Multi-stage dividends and valuation multiples", "explanation": "先预测至 t=N 的每笔股利。若稳定增长从 Dₙ₊₁ 开始，终值 Pₙ 只覆盖此后的股利。没有可用股利预测时，讲义也介绍基于可比公司的倍数。 | Forecast each dividend through time N. If stable growth starts at Dₙ₊₁, Pₙ covers only later payments. The lecture also introduces comparable multiples when dividend forecasts are impractical.", "formula": "Pₙ = Dₙ₊₁/(R−g)\nP₀ = Σₜ₌₁ⁿ[Dₜ/(1+R)ᵗ] + Pₙ/(1+R)ⁿ   •   Price ≈ comparable P/E × EPS", "use": "Dₙ 和 Pₙ 同在 t=N，但代表不同金额。用 P/E 时比较风险、增长与盈利口径相近的公司。 | Dₙ and Pₙ share a date but represent different amounts. For P/E, compare companies with similar risk, growth, and earnings definitions."}], "examples": [{"title": "刚发过股利时的 Gordon 估值 | Gordon valuation when a dividend was just paid", "ref": "L5:36", "prompt": "Y 公司刚派 $0.50 股利，预计每年增长 2%。要求回报 15%。求现在的股价。 | Y just paid a $0.50 dividend. Dividends are expected to grow at 2% annually, and the required return is 15%. Find today’s price.", "steps": [{"text": "“刚派”说明 $0.50 是 D₀，向前增长一期才得到 D₁。 | “Just paid” makes $0.50 D₀. Grow it one period to get D₁.", "formula": "D₁ = 0.50 × 1.02 = $0.51"}, {"text": "确认 15% > 2%，再用稳定增长永续公式。 | Verify 15% > 2%, then apply the constant-growth perpetuity formula.", "formula": "P₀ = 0.51/(0.15−0.02) = $3.92"}, {"text": "回报检查：下一年的股利收益率约为 13%，加上约 2% 的价格增长，合计约 15%。 | Check the return. The next dividend yield is about 13%, which together with about 2% price growth gives 15%.", "formula": ""}], "answer": "下一期股利为 $0.51，按 Gordon 模型，当前股价约为每股 $3.92。 | Next year’s dividend is $0.51, so the Gordon model gives a price of about $3.92 per share.", "related": [{"ref": "L5:37-41", "title": "辨别给定的是 D₀ 还是 D₁ | Distinguish whether the input is D₀ or D₁"}, {"ref": "T4:12-15", "title": "固定增长题及增长假设变化 | Practice constant growth and changes to the assumption"}, {"ref": "P5:2-3", "title": "反求增长率 | Solve for growth from the share price"}, {"ref": "T4:4-10", "title": "优先股固定股利的有限与无限期对照 | Contrast finite and perpetual preferred dividends"}]}, {"title": "三年不同股利，之后稳定增长 | Three uneven dividends followed by stable growth", "ref": "T4:17-18", "prompt": "Lab Series 未来三年分别派 $2、$4、$6，此后以 6% 永续增长，要求回报为 12%。求股价。 | Lab Series pays $2, $4 and $6 over the next three years, then grows dividends at 6% forever. At a 12% required return, find today’s price.", "steps": [{"text": "先画时间线：D₁=2、D₂=4、D₃=6。第一笔稳定增长阶段股利是 D₄。 | Draw the timeline: D₁=2, D₂=4, D₃=6. The first stable-growth dividend is D₄.", "formula": "D₄ = 6 × 1.06 = $6.36"}, {"text": "D₄ 在第 4 年到达，所以用它计算的终值位于第 3 年末，价值覆盖第 4 年起的股利。 | D₄ arrives in year 4, so terminal value is at the end of year 3 and covers year-4 onward dividends.", "formula": "P₃ = 6.36/(0.12−0.06) = $106"}, {"text": "把 D₁、D₂、D₃ 和 P₃ 折回今天。第 3 年两笔同时间，可合并成 $112。 | Discount D₁, D₂, D₃ and P₃. The latter two share year 3 and can be combined as $112.", "formula": "P₀ = 2/1.12 + 4/1.12² + (6+106)/1.12³ = $84.69"}], "answer": "稳定增长阶段在 t=3 的价值为 $106。连同前三年股利折现后，当前每股价值约为 $84.69。 | The stable-growth phase is worth $106 at t=3. Discounting it together with the first three dividends gives $84.69 per share today.", "related": [{"ref": "T4:20-22", "title": "前四年高增长，再进入稳定增长 | Four high-growth years before stable growth"}, {"ref": "L5:51-52", "title": "讲义的非恒定增长及终值题 | Lecture example on nonconstant growth and terminal value"}, {"ref": "Ross:292-295", "title": "教材的非恒定与两阶段增长算例 | Textbook nonconstant and two-stage growth examples"}, {"ref": "L5:55-57", "title": "缺少股利预测时，查看 P/E 倍数与可比公司的例子 | Explore P/E and comparables when dividend forecasts are unavailable"}]}], "quiz": [{"type": "choice", "prompt": "如果 D₆ 是第一笔稳定增长的股利，终值 D₆/(R−g) 是哪一期的价格？ | If D₆ is the first stable-growth dividend, when is D₆/(R−g) valued?", "options": ["第 5 年末 | End of year 5", "第 6 年末 | End of year 6", "今天 | Today"], "answer": 0, "hint": "公式的分子是估值日下一期的股利。 | The formula uses the dividend one period after the valuation date.", "solution": "D₆ 是 t=5 的下一期股利，因此终值在 t=5。 | D₆ is the next dividend as of t=5, so the terminal value belongs at t=5."}, {"type": "number", "prompt": "刚付股利 $2，恒定增长 3%，要求回报 8%。求每股价格。 | A $2 dividend was just paid. With 3% constant growth and an 8% required return, find today’s price.", "answer": 41.2, "tolerance": 0.01, "hint": "先从 D₀ 算 D₁。 | Advance D₀ to D₁ first.", "solution": "P₀=2(1.03)/(0.08−0.03)=$41.20。 | P₀=2(1.03)/(0.08−0.03)=$41.20."}, {"type": "written", "prompt": "分析师说股利将永续增长 11%，要求回报 9%。你会怎样处理 Gordon 模型？ | An analyst assumes perpetual dividend growth of 11% and a required return of 9%. How should you handle the Gordon model?", "hint": "想想无限折现级数需要怎样才收敛。 | Think about what makes the discounted infinite series converge.", "solution": "11% 超过 9%，该永续增长设定不满足收敛条件。可独立预测有限的高增长阶段，再用可持续且 g<R 的长期增长率估值。得分点：不适用、条件、合理调整。 | Growth at 11% exceeds 9%, so the assumed perpetuity does not converge. Forecast a finite high-growth phase and use a sustainable long-term g<R. Credit: inapplicability, correct condition, coherent revision."}]}, {"id": 6, "title": "历史回报、风险与市场有效性 | Historical Returns, Risk, and Market Efficiency", "objective": "能从价格及收入算持有期回报，并知道何时用历史平均、波动率或市场有效性概念。 | Compute holding-period return from price and income and choose an appropriate average, risk measure, or efficiency concept.", "reading": {"ref": "Ross:430-458", "explanation": "Ross 第 12 章把持有回报分成投资收入与价格变动，并用样本方差量化历史波动。几何平均回答财富实际上以多快的等效速度增长。读有效市场时留意不同形式对应的信息集。 | Ross Chapter 12 separates investment income from price changes and uses sample variance to quantify historical variability. Geometric average measures the equivalent growth of actual wealth. In market efficiency, focus on the information set for each form."}, "theories": [{"title": "持有期回报 | Holding-period return", "explanation": "债券的票息或股票的股利都要计入回报，价格变化也要计入。分母是买入价。 | Include interest or dividends and the price change. The denominator is the purchase price.", "formula": "Dollar return = Income + P₁ − P₀\nR = (Income + P₁ − P₀)/P₀   •   Rreal = (1+R)/(1+inflation) − 1", "use": "算持有期的名义或实际回报。历史超额回报可用 R−Rf。 | Find nominal or real holding-period return. Use R−Rf for historical excess return."}, {"title": "平均回报与样本波动 | Averages and sample volatility", "explanation": "算术平均给出单期回报的样本平均，几何平均使每期按同一增速复利得到相同的终值。样本标准差衡量回报围绕样本均值的波动。 | The arithmetic mean averages single-period observations. The geometric mean is the constant compound rate producing the same final wealth. Sample standard deviation measures spread around the sample mean.", "formula": "R̄ = ΣRₜ/n   •   Rgeo = [Π(1+Rₜ)]^(1/n) − 1\ns² = Σ(Rₜ−R̄)²/(n−1)   •   s = √s²", "use": "用历史样本算波动时用 n−1。若给的是未来情景及其概率，改用概率加权方差（Lecture 7）。 | Use n−1 for sample variance. For future states with specified probabilities, use the probability-weighted variance in Lecture 7."}, {"title": "市场有效性 | Market efficiency", "explanation": "弱式看历史市场信息，半强式涵盖公开信息，强式还包括私有信息。 | Weak form covers past market information, semi-strong form covers public information, and strong form also covers private information.", "formula": "", "use": "先辨题目使用的是什么信息，再写相关有效性假设及其对获得持续风险调整后超额收益的含义。 | Identify the information set first and state its implication for persistent risk-adjusted abnormal returns."}], "examples": [{"title": "算术平均与复利平均 | Arithmetic versus compound average", "ref": "L6:15-16", "prompt": "三年回报为 5%、−3%、12%。求算术和几何平均。 | Annual returns are 5%, −3%, and 12%. Find the arithmetic and geometric averages.", "steps": [{"text": "算术平均直接把三项百分数求和再除以三。 | Add the three returns and divide by three for the arithmetic average.", "formula": "R̄ = (5%−3%+12%)/3 = 4.67%"}, {"text": "几何平均先把收益率变成财富倍数。亏损 3% 对应 0.97。 | For the geometric mean, convert returns to wealth factors. A 3% loss gives a 0.97 factor.", "formula": "Rgeo = (1.05×0.97×1.12)^(1/3)−1 = 4.49%"}, {"text": "解释口径。每年复利 4.49% 约等于这三年真实累计增长；4.67% 是三次年度观察值的平均。 | Interpret the two measures. Compounding annually at about 4.49% matches actual cumulative growth. The 4.67% is the mean of three annual observations.", "formula": ""}], "answer": "算术平均是 4.67%，几何平均是 4.49%。几何平均是这段历史的等效年复利回报。 | The arithmetic average is 4.67% and the geometric average is 4.49%. The geometric mean is the equivalent annual compound return for this history.", "related": [{"ref": "T5:11-12", "title": "对照两种均值和样本标准差 | Compare the two averages and sample volatility"}, {"ref": "T5:13-17", "title": "由平均值反推缺失回报，再求波动率 | Infer a missing return and calculate volatility"}, {"ref": "Ross:449-452", "title": "教材算术与几何均值案例 | Textbook treatment of arithmetic and geometric means"}, {"ref": "L6:43-49", "title": "把历史收益与市场有效性的实证案例连起来 | Connect historical returns to market efficiency evidence"}, {"ref": "L6:55-57", "title": "对照概率分布下的均值与方差 | Contrast with probability-weighted mean and variance"}]}, {"title": "债券持有回报及购买力变化 | Bond holding-period return and purchasing power", "ref": "T5:4-9", "prompt": "一年前以 $1,030 买入面值 $1,000、年票息 8% 的债券。今天还剩六年，已收到一笔票息，市场 YTM 为 7%。通胀 4.2%，求卖出所得价格及这一年的回报。 | You bought a $1,000 par, 8% annual-coupon bond for $1,030 one year ago. You have received one coupon. Six years remain and today’s YTM is 7%. With 4.2% inflation, find the sale price and one-year return.", "steps": [{"text": "用今天的 7% 和剩余六期现金流为出售时点估价。已经收到的 $80 单独计入持有期收入。 | Value the six remaining payments at today’s 7% yield. Count the $80 coupon already received separately as holding-period income.", "formula": "P₁ = 80[1 − 1.07⁻⁶]/0.07 + 1,000/1.07⁶ = $1,047.67"}, {"text": "卖出价格减买入成本是资本利得，再加票息，除以原投资。 | Sale price less purchase price is the capital gain. Add the coupon and divide by the original investment.", "formula": "Dollar return = 80 + 1,047.6654 − 1,030 = $97.67\nNominal return = 97.6654/1,030 = 9.48%"}, {"text": "名义增长倍数除以物价增长倍数，得到购买力的增长倍数。 | Divide the nominal growth factor by the price-level growth factor.", "formula": "Real return = (1+0.0948208)/1.042−1 = 5.07%"}], "answer": "出售价格约为 $1,047.67。一年总收益 $97.67，名义回报 9.48%，实际回报 5.07%。 | The bond sells for about $1,047.67. The one-year gain is $97.67, a nominal return of 9.48% and real return of 5.07%.", "related": [{"ref": "L6:7-9", "title": "分开练金额回报和百分比回报 | Practice dollar and percentage returns"}, {"ref": "T3:17-20", "title": "先练用当前 YTM 重估债券价格 | Reprice a bond using the current YTM"}, {"ref": "L4:49-52", "title": "再练费雪公式与实际金额 | Practice the Fisher relation and real cash flows"}, {"ref": "Ross:430-435", "title": "教材回报组成与持有期算例 | Textbook return-component and holding-period examples"}]}], "quiz": [{"type": "number", "prompt": "以 $50 买入股票，收 $2 股利，以 $54 卖出。输入持有期回报的百分数。 | Buy a share at $50, receive a $2 dividend and sell at $54. Enter holding-period return as a percentage.", "answer": 12, "tolerance": 0.01, "hint": "把股利和价格变化加在一起。 | Add the dividend to the price change.", "solution": "(2+54−50)/50=12%。 | (2+54−50)/50=12%."}, {"type": "choice", "prompt": "想描述过去五年财富实际的等效年增长率，应选哪项？ | Which measure describes the equivalent annual growth of wealth over the past five years?", "options": ["几何平均 | Geometric average", "算术平均 | Arithmetic average", "样本标准差 | Sample standard deviation"], "answer": 0, "hint": "想想每一期是否都乘在上一期财富上。 | Think about whether each period compounds on the preceding wealth.", "solution": "几何均值保持同一个累计财富倍数。 | The geometric mean preserves the cumulative wealth multiplier."}, {"type": "written", "prompt": "有人声称只用三年前的公开股价走势，就能持续赚到风险调整后的超额收益。这与哪一种最基本的有效市场假设冲突？ | Someone claims that past public prices alone consistently produce risk-adjusted abnormal returns. What is the weakest form of efficiency contradicted?", "hint": "历史价格属于哪个信息集？ | Which information set includes past prices?", "solution": "弱式已经包含历史市场价格，因此最基本的冲突在弱式。得分点：历史价格、弱式、持续的风险调整后超额收益。 | Weak form already includes past market prices, so this contradicts weak-form efficiency. Credit: price history, weak form, persistent risk-adjusted abnormal returns."}]}, {"id": 7, "title": "投资组合与 CAPM | Portfolios and CAPM", "objective": "能用情景或协方差求组合风险，并用 Beta 找与系统性风险匹配的要求回报。 | Measure portfolio risk using states or covariance, then use beta to estimate the required return for systematic risk.", "reading": {"ref": "Ross:468-492", "explanation": "Ross 第 13 章说明组合回报可以按权重平均，但组合波动率取决于资产共同变动。分散化降低个别风险，CAPM 用 Beta 衡量市场相关风险。 | Ross Chapter 13 shows that portfolio returns are weighted averages while volatility depends on co-movement. Diversification reduces asset-specific risk, and CAPM uses beta to price market-related risk."}, "theories": [{"title": "情景加权回报与方差 | State-weighted return and variance", "explanation": "先在每个情景算组合收益，再根据情景出现的概率求均值和方差。 | Compute portfolio return in each state, then use state probabilities for the mean and variance.", "formula": "Rₚ,ₛ = Σᵢ wᵢRᵢ,ₛ   •   E(Rₚ) = Σₛ pₛRₚ,ₛ\nVar(Rₚ) = Σₛ pₛ[Rₚ,ₛ−E(Rₚ)]²   •   σₚ = √Var(Rₚ)", "use": "wᵢ 是资产权重，pₛ 是情景概率，两者各自加总为 1。用小数算方差，开方后才还原成百分数。 | Asset weights wᵢ and state probabilities pₛ each sum to 1. Compute variance in decimals and convert the square root back to a percentage."}, {"title": "相关性与分散化 | Correlation and diversification", "explanation": "组合风险既取决于单项资产的波动，也取决于它们是否一起涨跌。 | Portfolio risk reflects both standalone volatility and whether assets move together.", "formula": "σₚ² = wA²σA² + wB²σB² + 2wAwBρABσAσB", "use": "只给定两资产各自波动率、相关系数和权重时用此式。ρ 越低，两个多头头寸的分散化效果通常越强。 | Use this formula with two volatilities, correlation and weights. Lower ρ generally offers more diversification for two long positions."}, {"title": "Beta、CAPM 与 SML | Beta, CAPM, and the SML", "explanation": "Beta 是相对于市场回报的敏感度。证券市场线截距为无风险利率，斜率为市场风险溢价。 | Beta measures sensitivity to market returns. The security market line has the risk-free rate as its intercept and the market risk premium as its slope.", "formula": "βᵢ = Cov(Rᵢ,Rₘ)/Var(Rₘ)   •   βₚ = Σwᵢβᵢ\nE(Rᵢ) = Rf + βᵢ[E(Rₘ)−Rf]", "use": "根据系统性风险算要求回报。题目直接给市场风险溢价时直接乘 Beta。总波动率用于衡量总风险。 | Find required return for systematic risk. Multiply beta by the stated market premium directly. Total volatility measures total risk."}], "examples": [{"title": "使用微软的 Beta 求要求回报 | Using Microsoft’s beta to find required return", "ref": "L7:31-32", "prompt": "讲义示例给定 Beta 1.5、标准差 18%、无风险利率 5% 和市场风险溢价 6%。按 CAPM 求要求回报。 | The lecture gives beta 1.5, standard deviation 18%, a 5% risk-free rate, and a 6% market risk premium. Find the CAPM required return.", "steps": [{"text": "区分 18% 总波动率与 Beta 1.5。CAPM 的风险输入是 Beta。 | Separate total volatility of 18% from beta of 1.5. Beta is the CAPM risk input.", "formula": ""}, {"text": "题目直接给出 6% 的市场风险溢价。乘 Beta 得个股风险溢价，再加无风险利率。 | The market premium is already supplied as 6%. Multiply by beta for the stock premium, then add the risk-free rate.", "formula": "E(R) = 5% + 1.5×6% = 14%"}, {"text": "检查：Beta 高于 1，在市场风险溢价为正时，要求回报应高于市场的 11%。 | Check direction. Beta exceeds 1, so with a positive market premium the required return should exceed the market’s 11%.", "formula": ""}], "answer": "按 CAPM，要求回报是 14%，其中 5% 为无风险回报，9% 是由 Beta 决定的风险溢价。 | CAPM gives a 14% required return, consisting of a 5% risk-free return and a 9% beta-based premium.", "related": [{"ref": "P7:3-5", "title": "市场回报给定时先求溢价，再扩展到组合 | Derive the premium from market return, then extend to portfolios"}, {"ref": "L7:43-46", "title": "回报风险比和 CAPM 应用 | Reward-to-risk and CAPM applications"}, {"ref": "T6:22-24", "title": "由两只定价正确的证券反推 SML | Recover the SML from two correctly priced securities"}, {"ref": "T6:17-19", "title": "从目标收益率反求组合权重和 Beta | Recover weights and portfolio beta from a target return"}]}, {"title": "用三种经济情景算组合风险 | Portfolio risk across three economic states", "ref": "T6:7-13", "prompt": "衰退、正常和繁荣的概率分别为 15%、55%、30%。A 在三种情景回报为 4%、9%、17%；B 为 −17%、12%、27%。求 90% A、10% B 的组合均值和标准差。 | Recession, normal and boom have probabilities 15%, 55%, and 30%. A returns 4%, 9%, and 17%; B returns −17%, 12%, and 27%. Find the mean and standard deviation of a 90% A, 10% B portfolio.", "steps": [{"text": "先对每个状态应用 0.9Rᴬ+0.1Rᴮ，衰退时 B 的回报是负数。 | Apply 0.9Rᴬ+0.1Rᴮ in each state. B’s recession return is negative.", "formula": "Rₚ = [1.9%, 9.3%, 18.0%]"}, {"text": "用状态概率乘各自回报，得到期望回报。 | Weight the state returns by their probabilities to get the expected return.", "formula": "E(Rₚ) = 0.15(0.019)+0.55(0.093)+0.30(0.18) = 0.108"}, {"text": "算每个状态与均值的差，平方后按概率加总，再开方。 | Square each deviation from the mean, sum the probability-weighted terms, then take the square root.", "formula": "σₚ = √[0.15(0.019−0.108)² + 0.55(0.093−0.108)² + 0.30(0.18−0.108)²] = 5.35%"}], "answer": "组合期望回报为 10.80%，标准差为 5.35%。二者都建立在先求各情景的组合回报上。 | The portfolio has expected return of 10.80% and standard deviation of 5.35%, based on the portfolio return computed in each state.", "related": [{"ref": "P6:2-3", "title": "同样做情景加权的标准差 | More probability-weighted standard deviation practice"}, {"ref": "L7:9-14", "title": "对照用协方差复算同类组合 | Compare the covariance approach"}, {"ref": "L7:48-49", "title": "从组合目标反推资产配置 | Work backward from a portfolio objective"}, {"ref": "Ross:472-476", "title": "教材的组合回报与风险算例 | Textbook portfolio return and risk examples"}]}], "quiz": [{"type": "choice", "prompt": "哪一种风险在充分分散后仍由投资者承担？ | Which type of risk remains after broad diversification?", "options": ["市场系统性风险 | Systematic market risk", "单一公司特有风险 | Single-firm specific risk", "任何可能风险都消失 | All possible risk disappears"], "answer": 0, "hint": "想想整个市场同时下跌时会发生什么。 | Think about a downturn that affects the entire market.", "solution": "分散化抵消个别公司的冲击，但市场共同冲击仍会影响组合。 | Diversification offsets firm-specific shocks, but common market shocks still affect the portfolio."}, {"type": "number", "prompt": "无风险利率 3%，市场期望回报 9%，Beta 1.4。输入 CAPM 要求回报的百分数。 | The risk-free rate is 3%, the market return is 9%, and beta is 1.4. Enter CAPM required return as a percentage.", "answer": 11.4, "tolerance": 0.01, "hint": "先求市场超出无风险资产的部分。 | First find the market’s excess above the risk-free asset.", "solution": "3%+1.4(9%−3%)=11.4%。 | 3%+1.4(9%−3%)=11.4%."}, {"type": "written", "prompt": "两只股票的预期回报和标准差保持不变。相关性从 +0.8 降到 −0.2，两个持仓均为正时，组合的均值和方差怎么变？ | Two stocks keep the same expected returns and volatilities. Correlation falls from +0.8 to −0.2. With both positions long, how do portfolio mean and variance change?", "hint": "均值公式里有没有 ρ？方差的交叉项是正系数乘哪个数？ | Does ρ enter the mean? Which variable is multiplied by a positive coefficient in the variance?", "solution": "均值不变；方差下降，因为协方差项变小。得分点：权重和单项均值保持、相关性影响交叉项、正确方向。 | Mean is unchanged and variance falls because the covariance term falls. Credit: fixed weights and means, effect on cross term, correct direction."}]}, {"id": 8, "title": "投资决策准则 | Investment Decision Rules", "objective": "能算 NPV、IRR、回收期与 PI，并能处理不同准则给出不同排序的情况。 | Calculate NPV, IRR, payback and PI, and resolve rankings that disagree.", "reading": {"ref": "Ross:319-346", "explanation": "Ross 第 9 章从增值金额解释 NPV，再比较其他准则遗漏的信息。现金流多次变号可能产生多个 IRR，互斥项目也可能因规模或时点出现 IRR 与 NPV 排序冲突。 | Ross Chapter 9 interprets NPV as value created and contrasts the information omitted by other criteria. Repeated sign changes can produce multiple IRRs. Scale or timing can make IRR and NPV rankings conflict for mutually exclusive projects."}, "theories": [{"title": "净现值 | Net present value", "explanation": "NPV 把全部增量现金流（含 t=0）按风险匹配的资本成本折现，给出今天新增的价值。 | NPV discounts all incremental cash flows, including t=0, at a risk-matched cost of capital to measure value added today.", "formula": "NPV = CF₀ + Σₜ₌₁ⁿ[CFₜ/(1+r)ᵗ]", "use": "独立项目 NPV>0 则接受。有同等约束的互斥项目用最大正 NPV 排序。 | Accept an independent project if NPV>0. For mutually exclusive projects under the same constraints, choose the largest positive NPV."}, {"title": "IRR 与 PI | IRR and PI", "explanation": "IRR 把 NPV 设成零；PI 衡量每投入一单位初始投资所对应的未来净现金流现值。 | IRR sets NPV to zero. PI measures the present value of future net flows per unit of initial investment.", "formula": "0 = CF₀ + Σ[CFₜ/(1+IRR)ᵗ]   •   PI = PV(future net cash flows)/|CF₀|", "use": "常规独立项目可与要求收益率比较 IRR。互斥时，比例指标可能偏好小项目。现金流多次变号时查 NPV 曲线。 | Compare IRR with the required rate for conventional independent projects. Ratios may favor smaller mutually exclusive projects. With repeated sign changes, examine the NPV profile."}, {"title": "回收期与会计平均收益率 | Payback and average accounting return", "explanation": "普通回收期用原始现金流，折现回收期用折现后的现金流。会计平均收益率用会计利润和账面价值。 | Ordinary payback uses nominal cash flows. Discounted payback uses their present values. AAR uses accounting income and book value.", "formula": "Payback = full years + unrecovered amount / next year’s flow\nAAR = average net income / average book value", "use": "年内比例法假定均匀流入，若只在年末支付则报告到年末。两种回收期都会忽略 cutoff 之后的现金流。 | Fractional-year interpolation assumes flows are spread through the year. Use the year end for strictly lump-sum flows. Both payback measures ignore flows after the cutoff."}], "examples": [{"title": "用 NPV 检查独立项目 | NPV for an independent project", "ref": "L8:16-17", "prompt": "初始投资 $165,000，随后三年现金流分别为 $63,120、$70,800、$91,080，要求回报 12%。是否投资？ | An independent project costs $165,000 and pays $63,120, $70,800, and $91,080 in the next three years. Required return is 12%. Should it proceed?", "steps": [{"text": "现金流向写对：CF₀=−165,000，三年流入为正。t=0 不再折现。 | Record outflows and inflows with the right signs. CF₀ is −165,000 and is already at time zero.", "formula": ""}, {"text": "把每年流入移到今天，再扣今天的投资额。 | Move each inflow to today and subtract the time-zero investment.", "formula": "NPV = −165,000 + 63,120/1.12 + 70,800/1.12² + 91,080/1.12³ = $12,627.41"}, {"text": "NPV 已扣除资本成本，因此正值代表项目预期增加今天的价值。 | NPV already accounts for the required return; a positive number is value added today.", "formula": ""}], "answer": "NPV 为 $12,627.41，大于零。若项目独立且假设成立，应接受。 | NPV is positive at $12,627.41. Accept the independent project under the stated assumptions.", "related": [{"ref": "P8:2-3", "title": "一道题同时做 NPV、IRR 和回收期 | Compute NPV, IRR and payback together"}, {"ref": "L8:22-24", "title": "对照同类现金流反求 IRR | Find IRR for a comparable cash-flow pattern"}, {"ref": "Ross:321-323", "title": "教材的独立项目 NPV 算例 | Textbook independent-project NPV example"}], "calculator": "CF，2ND CLR WORK；CF₀=−165000，C01=63120，C02=70800，C03=91080，各 F=1；NPV，I=12，↓，CPT。 | Open CF, 2ND CLR WORK. Enter CF₀=−165000, C01=63120, C02=70800, C03=91080, all F=1. Open NPV, enter I=12, press ↓ and CPT."}, {"title": "互斥项目的 NPV 与 IRR 排序 | NPV versus IRR for mutually exclusive projects", "ref": "T7:10-23", "prompt": "要求回报为 15%。A 的 t=0 到 4 现金流为 −300,000、20,000、50,000、50,000、390,000。B 为 −40,000、19,000、12,000、18,000、10,500。比较回收期、NPV、IRR 与 PI，给出选择。 | The hurdle rate is 15%. Project A’s cash flows at t=0–4 are −300,000, 20,000, 50,000, 50,000, 390,000. B’s are −40,000, 19,000, 12,000, 18,000, 10,500. Compare payback, NPV, IRR and PI and choose one.", "steps": [{"text": "普通回收期先累计未折现现金流。A 在第 3 年末还差 180,000；B 在第 2 年末还差 9,000。按题解的年内插值口径计算。 | For ordinary payback, accumulate undiscounted flows. A still needs 180,000 after year 3; B needs 9,000 after year 2. Use the worksheet’s fractional-year convention.", "formula": "Payback A = 3+180,000/390,000 ≈ 3.46 years\nPayback B = 2+9,000/18,000 = 2.50 years"}, {"text": "用同一个 15% 折现，不遗漏第四年现金流。PI 用未来流入现值除以初始投入。 | Discount both projects at 15%, including year 4. Divide the PV of future inflows by the initial cost for PI.", "formula": "NPV A = $11,058.07   •   NPV B = $3,434.16\nPI A = (300,000+11,058.07)/300,000 ≈ 1.037\nPI B = (40,000+3,434.16)/40,000 ≈ 1.086"}, {"text": "逐组用方程 NPV=0 反求 IRR。B 回收更快、比例收益指标更高；A 在 15% 下增加的价值更多。 | Solve NPV=0 separately for each project. B pays back faster and has higher ratios. A adds more value at the 15% hurdle rate.", "formula": "IRR A ≈ 16.20%   •   IRR B ≈ 19.50%"}], "answer": "选 A。虽然 B 的回收期较短、IRR 和 PI 更高，但项目互斥，按 15% 折现时 A 的 NPV 比 B 多约 $7,623.90。 | Choose A. B has the shorter payback, higher IRR and higher PI, but the projects are mutually exclusive and A produces about $7,623.90 more NPV at 15%.", "related": [{"ref": "T7:13-14", "title": "用同一组现金流计算折现回收期 | Calculate discounted payback on the same flows"}, {"ref": "L8:32-37", "title": "多重 IRR 和互斥排序冲突 | Multiple IRRs and mutually exclusive ranking conflicts"}, {"ref": "P8:4", "title": "比较普通和增长永续项目的 NPV | Compare NPVs of level and growing perpetuities"}, {"ref": "L8:43-44", "title": "比较 PI 与金额规模的冲突 | Compare PI with project scale"}, {"ref": "T7:9", "title": "对照以利润和账面价值为基础的 AAR | Contrast AAR based on income and book value"}], "calculator": "两项目分别清空 CF 工作表；重复等额流可用 F。NPV 用 I=15；IRR 在输入 CF 后按 IRR、CPT。 | Clear CF before each project and use frequency F for consecutive equal flows. Use I=15 for NPV. For IRR, enter cash flows, then press IRR and CPT."}], "quiz": [{"type": "choice", "prompt": "互斥项目 X 和 Y 的 NPV 分别为 $70,000 和 $40,000，Y 的 IRR 较高。没有其他约束，选哪个？ | Mutually exclusive X and Y have NPVs of $70,000 and $40,000. Y has the higher IRR. With no other constraint, which do you choose?", "options": ["选择 X | Choose X", "选择 Y | Choose Y", "同时接受 X 和 Y | Accept both"], "answer": 0, "hint": "需要最大化今天增加的金额。 | Maximize the amount of value added today.", "solution": "选择 NPV 较高的 X，互斥项目只能选一个。 | Choose X because it has higher NPV and the projects cannot both be selected."}, {"type": "number", "prompt": "项目今天投入 $1,000，两年各收 $600，要求回报 10%。求 NPV，保留两位。 | A project costs $1,000 and returns $600 in each of the next two years. At 10%, find NPV to two decimals.", "answer": 41.32, "tolerance": 0.01, "hint": "第一笔折一年，第二笔折两年。 | Discount the first flow once and the second twice.", "solution": "NPV=−1,000+600/1.10+600/1.10²=$41.32。 | NPV=−1,000+600/1.10+600/1.10²=$41.32."}, {"type": "written", "prompt": "某项目 t=0 大额流出，t=1 大额流入，t=2 又需清理成本。为什么只报告一个 IRR 可能误导？ | A project has a large outflow at t=0, a large inflow at t=1, and a cleanup outflow at t=2. Why might reporting a single IRR mislead?", "hint": "看现金流有多少次变号。 | Count the sign changes.", "solution": "现金流变号两次，可能存在多个 IRR；应按与风险匹配的要求收益率计算 NPV。得分点：两次变号、多根可能、改用风险匹配的 NPV。 | There are two sign changes, so multiple IRRs can exist. Evaluate NPV at the risk-matched required return. Credit: sign changes, possible multiple roots, appropriate NPV criterion."}]}, {"id": 9, "title": "项目现金流与资本投资 | Project Cash Flow and Capital Investment", "objective": "能把项目条件翻译成 t=0、经营期和结束期的增量现金流，再作投资判断。 | Translate project data into incremental cash flows at initiation, during operations, and at termination.", "reading": {"ref": "Ross:360-383", "explanation": "Ross 第 10 章用独立项目原则划定现金流边界，并用 MMCC 案例贯穿营运资本、折旧、税后残值与最终 NPV。折旧不是现金支出，但会改变应付税款。 | Ross Chapter 10 uses the stand-alone principle to define project cash flows and integrates working capital, depreciation, disposal and NPV in the MMCC case. Depreciation affects taxes without being a cash payment."}, "theories": [{"title": "增量现金流 | Incremental cash flow", "explanation": "比较做项目与不做项目时公司现金流的差额。已经发生的沉没成本不变，机会成本与对其他业务的溢出效应则可能改变。 | Compare the firm’s cash flows with and without the project. Sunk costs are unchanged; opportunity costs and effects on other businesses may change.", "formula": "Incremental CF = CF(with project) − CF(without project)", "use": "纳入可归因的机会成本、营运资本及业务影响。WACC 折现框架下，不从项目 OCF 再扣利息。 | Include attributable opportunity cost, working capital, and spillovers. With WACC discounting, do not also deduct interest from project OCF."}, {"title": "经营现金流与折旧税盾 | Operating cash flow and depreciation tax shield", "explanation": "项目税是对经营利润计算的税。折旧降低应税利润，借由节税提高 OCF。 | Project taxes are calculated on operating earnings. Depreciation reduces taxable income and raises OCF through the tax shield.", "formula": "OCF = EBIT(1−T) + Dep\nOCF = (Sales − Cash Costs)(1−T) + Dep×T", "use": "Dep 是当期税务折旧。没有其他非现金项目时，两种写法等价。 | Dep is the period’s tax depreciation. These expressions are equivalent when there are no other noncash adjustments."}, {"title": "总项目现金流、残值与 EAC | Total cash flow, salvage, and EAC", "explanation": "营运资本增加占用现金，释放时流入。设备出售时以售价与账面价值差额计税。可重复且服务相同的不同寿命设备，可比较等额年成本。 | Working capital increases absorb cash and releases restore it. Asset disposal taxes the sale-price/book-value difference. Compare equivalent annual costs for repeatable assets providing the same service but with different lives.", "formula": "Project CF = OCF − net capital spending − ΔNWC\nAfter-tax sale proceeds = S − T(S−BV)\nEAC = PV(cost as positive amounts) / annuity factor(r,n)", "use": "题目给定或可合理假设项目结束收回 NWC 时记入终期。EAC 选较低年成本，前提是可重复提供同等服务。 | Include the NWC recovery when the problem specifies or supports it. Choose lower EAC only for comparable, repeatable service."}], "examples": [{"title": "会计收益为何小于 OCF | Why accounting income is below OCF", "ref": "L9:40-41", "prompt": "机器成本 $1,000,000，十年直线折旧至零。年收入 $300,000、经营费用 $100,000，税率 40%。求年度会计收益和经营现金流。 | A $1,000,000 machine is depreciated straight-line to zero over ten years. Annual revenue is $300,000, operating expenses are $100,000, and tax is 40%. Find annual project accounting income and OCF.", "steps": [{"text": "机器初始成本留在 t=0 单独处理。年折旧等于安装成本除以寿命。 | Record the machine cost separately at t=0. Annual depreciation is installed cost divided by life.", "formula": "Dep = 1,000,000/10 = $100,000"}, {"text": "从收入减现金成本及折旧求 EBIT，再计算项目税与会计收益。 | Subtract cash costs and depreciation to get EBIT. Then compute project taxes and accounting income.", "formula": "EBIT = 300,000−100,000−100,000 = $100,000\nTaxes = $40,000   •   Net income = $60,000"}, {"text": "把非现金折旧加回，保留真实税款支出。 | Add back noncash depreciation while keeping the actual tax payment.", "formula": "OCF = 60,000+100,000 = $160,000"}], "answer": "每年会计收益为 $60,000，经营现金流为 $160,000。两者相差 $100,000 的非现金折旧。 | Annual accounting income is $60,000 and annual OCF is $160,000. The $100,000 difference is noncash depreciation.", "related": [{"ref": "L9:17-20", "title": "对照四种 OCF 写法 | Compare the alternative OCF constructions"}, {"ref": "L9:21-25", "title": "加上初始开支与营运资本后算 NPV | Add initial spending and working capital to find NPV"}, {"ref": "Ross:376-378", "title": "教材对 OCF 的不同计算方式 | Textbook alternative definitions of OCF"}]}, {"title": "扩张项目的整条现金流时间线 | Cash-flow timeline for an expansion project", "ref": "T8:8-9", "prompt": "设备 $3.9m，三年折旧至零，期末市值 $210,000。咨询费 $300,000 已支付，土地历史成本 $15,000、现在可售 $20,000。初始 NWC $300,000，终期收回。每年销售 $2.65m、成本 $840,000。税率 35%，折现率 12%。是否接受？ | Equipment costs $3.9m and is depreciated to zero over three years, with a $210,000 resale price. A $300,000 consulting fee has been paid. Land cost $15,000 historically and can be sold for $20,000 now. Invest $300,000 in NWC and recover it at termination. Annual sales are $2.65m and costs $840,000. Tax is 35%, discount rate 12%. Accept?", "steps": [{"text": "已付咨询费和历史购地款都是沉没成本。纳入放弃卖地的 $20,000，并沿用 Tutorial 把它作为已给定的机会成本处理。加上设备和 NWC。 | The paid consulting fee and past land cost are sunk. Include $20,000 of forgone land proceeds, treating the quoted amount as the opportunity cost as the tutorial does. Add equipment and NWC.", "formula": "CF₀ = −3,900,000−20,000−300,000 = −$4,220,000"}, {"text": "用每年固定的 $1.3m 折旧在税盾公式里算 OCF。 | Calculate OCF using the tax-shield formula and $1.3m of annual depreciation.", "formula": "OCF = (2,650,000−840,000)(0.65)+1,300,000(0.35) = $1,631,500"}, {"text": "第三年末设备账面价值为零，出售净额为 $136,500。NWC 回收 $300,000。 | Book value is zero at year 3. After-tax sale proceeds are $136,500. Recover $300,000 in NWC.", "formula": "CF₃ = 1,631,500 + 210,000(0.65) + 300,000 = $2,068,000"}, {"text": "把各年对应现金流以 12% 折现后加总，保持 t=0 为负。 | Discount each year’s appropriate cash flow at 12% and add the negative t=0 flow.", "formula": "NPV = −4,220,000+1,631,500/1.12+1,631,500/1.12²+2,068,000/1.12³ = $9,279.79"}], "answer": "NPV 约为 $9,279.79，在题设下应接受扩张。第三年现金流包含 OCF、税后残值与 NWC 回收。 | Accept the expansion under the stated assumptions: NPV is about $9,279.79. Year-three cash flow includes OCF, after-tax salvage and NWC recovery.", "related": [{"ref": "T8:10-13", "title": "设备替换，改算新旧两条现金流的差额 | Replacement: find the difference between new and old flows"}, {"ref": "L9:35-39", "title": "单独练直线折旧、账面价值与税后残值 | Drill straight-line depreciation, book value and after-tax salvage"}, {"ref": "L9:42-49", "title": "讲义 MMCC 的完整扩张案例 | Full MMCC expansion case in the lecture"}, {"ref": "P9:13-16", "title": "把扩张改成降成本项目 | Switch from expansion to a cost-cutting project"}, {"ref": "P9:10-12", "title": "用等额年成本比较不同寿命的设备 | Compare unequal-lived equipment using equivalent annual cost"}, {"ref": "Ross:372-376", "title": "教材 MMCC 的逐年现金流表 | Textbook MMCC year-by-year cash flows"}]}], "quiz": [{"type": "choice", "prompt": "项目开始前已付清且不可退还的调研费，评估是否上项目时应怎样处理？ | A study fee was paid before the decision and cannot be refunded. How do you treat it in the project analysis?", "options": ["排除，属于沉没成本 | Exclude it as sunk", "计为资本支出 | Include it as capex", "计为期末营运资本回收 | Count it as terminal NWC recovery"], "answer": 0, "hint": "无论接受还是拒绝，这笔费用会变吗？ | Does this fee change between acceptance and rejection?", "solution": "成本已发生且不会因为决策改变，增量现金流为零。 | The spending is unchanged by the decision, so its incremental cash flow is zero."}, {"type": "number", "prompt": "设备卖 $48,000，账面价值 $30,000，税率 25%。求税后出售收入。 | An asset sells for $48,000, has $30,000 book value, and is taxed at 25%. Find after-tax sale proceeds.", "answer": 43500, "tolerance": 0.01, "hint": "税作用在售价与账面价值的差额。 | Tax applies to the sale-price/book-value difference.", "solution": "税后收入 = 48,000−0.25(48,000−30,000)=$43,500。 | After-tax proceeds = 48,000−0.25(48,000−30,000)=$43,500."}, {"type": "written", "prompt": "项目开始投入存货 $20,000，结束全部按投入金额释放。写出对 t=0 和终结年现金流的影响。 | A project requires $20,000 of extra inventory at inception, fully released at cost at the end. State the cash-flow effects at t=0 and in the final year.", "hint": "现金什么时候被占用，什么时候被释放？ | When is cash tied up and when is it released?", "solution": "t=0 记 −$20,000，终期记 +$20,000，并按各自时间折现。得分点：两个时点、符号、作为 NWC 变动。 | Record −$20,000 at t=0 and +$20,000 at termination, discounted at their respective dates. Credit: both dates, signs, and NWC treatment."}]}, {"id": 10, "title": "项目分析与评估 | Project Analysis and Evaluation", "objective": "看出项目对哪些假设敏感，并能区分三种盈亏平衡点和资本约束。 | Identify sensitive project assumptions, distinguish three break-even points, and account for budget constraints.", "reading": {"ref": "Ross:398-418", "explanation": "Ross 第 11 章从预测误差切入：正 NPV 仍可能依赖脆弱的假设。情景分析检验一组同时发生的变化，敏感度分析找出对结果影响较大的单项输入。 | Ross Chapter 11 starts with forecasting risk: a positive NPV can still depend on fragile assumptions. Scenario analysis varies a coherent bundle of inputs, and sensitivity analysis isolates a single important driver."}, "theories": [{"title": "情景与敏感度分析 | Scenario and sensitivity analysis", "explanation": "情景分析同时变更多个输入；敏感度分析固定其他输入、只改变一个变量。 | Scenario analysis varies multiple inputs together. Sensitivity analysis changes one input at a time.", "formula": "Sensitivity ≈ ΔNPV/Δinput\nOCF = [Q(P−v)−FC](1−T) + Dep×T", "use": "Q 是销量、P 是单价、v 是单位变动成本、FC 是固定成本。比较同一口径计算的各组 NPV，并写清斜率单位。 | Q is volume, P price, v unit variable cost, and FC fixed cost. Compare consistently computed NPVs and state slope units."}, {"title": "三种盈亏平衡 | Three break-even points", "explanation": "会计盈亏平衡令净利润等于零，现金盈亏平衡令 OCF 等于零，财务盈亏平衡令 NPV 等于零。 | Accounting break-even sets net income to zero. Cash break-even sets OCF to zero. Financial break-even sets NPV to zero.", "formula": "No tax: Qaccounting = (FC+Dep)/(P−v)   •   Qcash = FC/(P−v)\nOCFfinancial = I₀/annuity factor(r,n)\nNo tax: Qfinancial = (FC+OCFfinancial)/(P−v)", "use": "财务平衡式假定等额 OCF、无残值或终期现金流；有税则将 OCF 目标代回有税公式。整单位销量要向上取整。 | The financial expression assumes level OCF and no salvage or other terminal flow. With taxes, substitute the OCF target into the after-tax equation. Round up when units are indivisible."}, {"title": "经营杠杆与资本限额 | Operating leverage and capital rationing", "explanation": "固定成本令 OCF 对销量变动更敏感。若有预算约束，应比较可行的项目组合。 | Fixed costs make OCF more responsive to changes in volume. If a funding constraint binds, compare feasible project combinations.", "formula": "DOL = %ΔOCF/%ΔQ   •   no tax: DOL = 1 + FC/OCF", "use": "无税线性成本时以基准 OCF 算杠杆。项目不可拆分时，在预算内比较组合总 NPV。 | For linear costs without tax, use baseline OCF for leverage. For indivisible projects, maximize total NPV across feasible portfolios."}], "examples": [{"title": "卖船时的三个盈亏平衡点 | Three break-even points for boat sales", "ref": "L10:16-20", "prompt": "投资 $3.5m，五年直线折旧至零。每艘售价 $40,000、变动成本 $20,000，年固定成本 $500,000，无税，要求回报 20%。求三种平衡销量。 | Invest $3.5m and depreciate straight-line to zero in five years. Each boat sells for $40,000 and costs $20,000 variable. Annual fixed cost is $500,000, tax is zero, and required return is 20%. Find three break-even volumes.", "steps": [{"text": "先写单位贡献 $20,000，年折旧 $700,000。分别写净利润及经营现金流。 | Find a $20,000 unit contribution and $700,000 annual depreciation. Write net income and OCF separately.", "formula": "NI = 20,000Q−500,000−700,000\nOCF = 20,000Q−500,000"}, {"text": "会计平衡令 NI=0，现金平衡令 OCF=0。 | Set NI=0 for accounting break-even and OCF=0 for cash break-even.", "formula": "Qaccounting = 60   •   Qcash = 25"}, {"text": "财务平衡要让五年 OCF 的现值刚好覆盖 $3.5m。反求所需 OCF，再解销量。 | For financial break-even, the five-year OCF stream must cover $3.5m in present value. Solve for required OCF, then for units.", "formula": "OCF* = 3,500,000 / ([1−1.20⁻⁵]/0.20)\nQfinancial = (500,000+OCF*)/20,000 = 83.52"}], "answer": "会计、现金、财务平衡分别为每年 60、25、约 83.52 艘。卖整艘时，至少 84 艘才能达到财务平衡。 | Accounting, cash, and financial break-even are 60, 25, and about 83.52 boats per year. With whole boats, at least 84 are needed for financial break-even.", "related": [{"ref": "T9:11-14", "title": "同样比较三个平衡点，换成四年期新产品 | Compare the three break-even points in a four-year product case"}, {"ref": "L10:22-24", "title": "沿用卖船例题计算经营杠杆 | Reuse the boat case to find operating leverage"}, {"ref": "Ross:408-414", "title": "教材的盈亏平衡计算与解释 | Textbook break-even calculations and interpretation"}]}, {"title": "固定成本每变一元，NPV 变多少 | How NPV changes per dollar of fixed cost", "ref": "T9:9-10", "prompt": "Southampton 的产品项目持续四年，折现率 12%、税率 35%，固定成本每年 $410,000。销量、价格、变动成本和折旧均保持不变。每年固定成本若增加 $1，NPV 会怎样变化？ | The Southampton product project lasts four years. Discount rate is 12%, tax is 35%, and annual fixed costs are $410,000. Volume, price, variable cost, and depreciation stay fixed. How does NPV change if each year’s fixed costs rise by $1?", "steps": [{"text": "只改 FC。固定成本每年多 $1，税前经营利润少 $1。在可使用税盾的题设下，税后每年 OCF 少 $0.65。 | Change FC alone. One extra dollar of fixed costs reduces annual pre-tax operating income by $1 and, assuming the tax reduction is usable, annual OCF by $0.65.", "formula": ""}, {"text": "同样变化发生在第 1 至第 4 年，用四年年金现值因子。初始投资没有变化。 | The same decrease occurs in years 1–4, so use a four-year annuity factor. Initial investment is unchanged.", "formula": "ΔNPV/ΔFC = −(1−0.35) × [1−1.12⁻⁴]/0.12 = −1.97428"}, {"text": "声明单位和方向。若每年固定成本增加 $10,000，NPV 下降约 $19,742.77。 | State units and direction. If annual fixed costs rise by $10,000, NPV falls by about $19,742.77.", "formula": ""}], "answer": "年固定成本每增加 $1，NPV 约下降 $1.97。这是其他输入保持不变的敏感度。 | NPV falls by about $1.97 per $1 increase in annual fixed costs, holding other inputs fixed.", "related": [{"ref": "T9:5-8", "title": "同一项目同时改变多个输入，做情景分析 | Vary several inputs together in the same project"}, {"ref": "L10:5-8", "title": "讲义的基准／最好／最差情景 | Lecture base, best and worst cases"}, {"ref": "L10:10-13", "title": "把单变量由成本换成售价 | Switch the sensitivity driver to unit price"}, {"ref": "L10:27-28", "title": "扩展到固定预算内的项目组合 | Extend project choice to a fixed budget"}]}], "quiz": [{"type": "choice", "prompt": "销量少 10%、售价也降 5%，其他输入不变。把两项变化一起计算属于哪种分析？ | Sales volume falls 10% and price falls 5%, with everything else fixed. What is the joint analysis called?", "options": ["情景分析 | Scenario analysis", "单变量敏感度分析 | One-variable sensitivity analysis", "计算内部收益率 | IRR calculation"], "answer": 0, "hint": "数数同时改变了几个输入。 | Count how many inputs changed together.", "solution": "两个输入同时变动，是情景分析。 | Two inputs change together, so this is scenario analysis."}, {"type": "number", "prompt": "无税，单价 $30、单位变动成本 $18、年固定成本 $6,000、折旧 $3,600。会计盈亏平衡需要多少单位？ | With no tax, price is $30, unit variable cost $18, annual fixed cost $6,000 and depreciation $3,600. Find accounting break-even units.", "answer": 800, "tolerance": 0.01, "hint": "会计平衡包含折旧。 | Accounting break-even includes depreciation.", "solution": "Q=(6,000+3,600)/(30−18)=800。 | Q=(6,000+3,600)/(30−18)=800."}, {"type": "written", "prompt": "项目刚好达到现金盈亏平衡，初始设备成本为正，没有残值或其他期末流入。为什么项目仍然可能不值得投？ | A project is exactly at cash break-even, has positive initial equipment cost, and no salvage or other terminal inflows. Why can it still fail the investment test?", "hint": "OCF=0 时，哪笔现金流还留在 NPV 里？ | If OCF=0, which cash flow remains in NPV?", "solution": "现金平衡只有 OCF=0，无法收回初始投入，因此此时 NPV 等于负初始成本。得分点：区分 OCF 与 NPV、解释初始支出。 | Cash break-even only sets OCF to zero. It does not recover initial outlay, so NPV equals negative initial cost here. Credit: distinguish OCF from NPV and explain the initial outlay."}]}, {"id": 11, "title": "资本成本与 WACC | Cost of Capital and WACC", "objective": "能从市场数据算出各融资成本与权重，并判断何时可把 WACC 用于项目折现。 | Determine component costs and weights from market data, then judge when WACC is an appropriate project discount rate.", "reading": {"ref": "Ross:505-525", "explanation": "Ross 第 14 章先用股利增长和 SML 解释股权成本，再引入市场权重与债务税盾。公司整体 WACC 对应整体业务风险；项目风险不同就需要项目适用的资本成本。 | Ross Chapter 14 develops the equity cost from dividend growth and the SML before introducing market weights and the interest tax shield. Company WACC reflects company-wide operating risk; a different-risk project needs an appropriate project rate."}, "theories": [{"title": "股权、优先股和债务成本 | Cost of equity, preferred stock, and debt", "explanation": "融资成本是市场投资者当前要求的回报。普通股可用 CAPM，稳定派息公司也可用股利增长模型；永续优先股可用固定股息／市价；债务成本通常用当前 YTM。 | Financing cost is what investors currently require. Estimate common equity with CAPM or dividend growth where applicable, perpetual preferred with dividend/price, and debt with current YTM.", "formula": "Rᴱ = Rf + βᴱ(E(Rₘ)−Rf), or D₁/P₀ + g\nRᴾ = Dᴾ/Pᴾ   •   Rᴰ = current YTM", "use": "票息率用于算合约支付，债务成本用当期市场要求的收益率。短券或长期债券用与题目定义一致的年化口径。 | Coupon rate gives contractual payments. Use the current market yield for debt cost and follow the problem’s annualization convention."}, {"title": "市场权重及债务税盾 | Market weights and the debt tax shield", "explanation": "按市场价值或目标市场权重加权。利息税前可扣的简化情形下，债务成本用税后值。 | Weight by market values or target market weights. If interest is tax deductible, use the after-tax debt cost in the simplified model.", "formula": "V = E + P + D\nWACC = (E/V)Rᴱ + (P/V)Rᴾ + (D/V)Rᴰ(1−T)", "use": "E、P、D 分别是普通股、优先股、债务市场价值。税后调整作用于债务成本。 | E, P and D are market values of common, preferred and debt. Apply the tax adjustment to debt cost."}, {"title": "项目折现率 | Project discount rate", "explanation": "折现率是同风险投资的机会成本。项目与公司现有业务风险及目标杠杆相近时，公司 WACC 才是合适近似。 | The discount rate is the opportunity cost of capital for investments of similar risk. Company WACC is a reasonable approximation when project risk and target leverage are comparable.", "formula": "NPV = CF₀ + Σ[unlevered project CFₜ/(1+matched WACC)ᵗ]", "use": "业务风险显著不同，可从类似业务的可比公司估计风险，再按目标资本结构调整。 | For substantially different business risk, estimate risk from a comparable pure play and adjust to the target capital structure."}], "examples": [{"title": "由 D/E 求 WACC，再估永续项目 | From D/E to WACC and perpetuity NPV", "ref": "L11:18", "prompt": "同业务的新项目需 $100m，之后每年税后现金流 $15m、持续无限期。目标 D/E=50%，Rᴰ=7%，Rᴱ=12%，税率 40%。求 NPV。 | A project in the same line of business costs $100m and generates $15m in after-tax cash flow annually forever. Target D/E is 50%, debt cost 7%, equity cost 12%, and tax 40%. Find NPV.", "steps": [{"text": "D/E=0.5，假设 E=1、D=0.5、V=1.5。因此 D/V=1/3，E/V=2/3。 | D/E=0.5. Use E=1, D=0.5, and V=1.5, giving debt weight 1/3 and equity weight 2/3.", "formula": ""}, {"text": "债务成本先乘 (1−40%)，然后按两个权重加总。 | First multiply debt cost by (1−40%), then apply the two weights.", "formula": "WACC = (1/3)×7%(1−0.40) + (2/3)×12% = 9.40%"}, {"text": "业务风险与杠杆假设匹配。首笔 $15m 一年后到达，按永续现金流估值后扣初始投入。 | Risk and leverage match. The first $15m arrives in year 1, so value the perpetuity and subtract the initial outlay.", "formula": "NPV = −100 + 15/0.094 = $59.57m"}], "answer": "WACC 为 9.40%；项目 NPV 为正，约 $59.57m。 | WACC is 9.40%. The project has a positive NPV of about $59.57m.", "related": [{"ref": "L11:8-12", "title": "比较同公司下风险不同的项目折现率 | Compare project discount rates across risk levels"}, {"ref": "L11:44-47", "title": "练部门和项目折现率选择 | Choose divisional and project-specific rates"}, {"ref": "L10:20", "title": "反向应用折现率求财务平衡 OCF | Work backward from NPV=0 to break-even OCF"}]}, {"title": "含普通股、优先股和债务的 WACC | WACC with common stock, preferred stock, and debt", "ref": "T9:18-23", "prompt": "Evenflow 有 8,000 张面值 $1,000、半年付息的债券，票息率 6.5%，剩 20 年，市价为面值 92%。另有普通股 250,000 股，每股 $57、Beta 1.05；优先股 15,000 股，每股 $93、年股利 $5（按题解的面值 $100）。无风险利率 4.5%，市场风险溢价 8%，税率 35%。求 WACC。 | Evenflow has 8,000 semiannual bonds, $1,000 par, 6.5% coupons, 20 years left, priced at 92% of par. It has 250,000 common shares at $57 with beta 1.05, and 15,000 preferred shares at $93 paying $5 per year (using the tutorial solution’s $100 par). The risk-free rate is 4.5%, the market premium 8%, and tax 35%. Find WACC.", "steps": [{"text": "先列市值。债券要用 $920 市价乘张数，股权分别使用各自股价。 | Start with market values. Use $920 per bond and the quoted share prices for common and preferred.", "formula": "D=$7.360m   •   E=$14.250m   •   P=$1.395m   •   V=$23.005m"}, {"text": "普通股用 CAPM，优先股用股息除以市价。 | Use CAPM for common stock and dividend over price for preferred stock.", "formula": "Rᴱ = 4.5% + 1.05×8% = 12.90%\nRᴾ = 5/93 = 5.3763%"}, {"text": "求债券的每期 IRR。40 个半年、票息 $32.50、现价 $920，得到半年收益率约 3.6323%。乘二得到名义年 YTM。 | Solve for the periodic bond yield. With 40 half-years, a $32.50 coupon and price of $920, the semiannual yield is about 3.6323%. Double it for the nominal annual YTM.", "formula": "Rᴰ ≈ 7.2647%   •   Rᴰ(1−T) ≈ 4.7220%"}, {"text": "用未四舍五入的权重和成本，按市值加权。 | Weight each component cost by market value, keeping unrounded intermediate values.", "formula": "WACC = [14.25(0.129)+1.395(5/93)+7.36(0.0726469)(0.65)]/23.005 ≈ 9.83%"}], "answer": "按市场价值加权，并仅对债务成本作税后调整后，Evenflow 的 WACC 约为 9.83%。 | Using market-value weights and applying the tax adjustment to debt, Evenflow’s WACC is about 9.83%.", "related": [{"ref": "P11:2-3", "title": "同样有三类证券，债券改为年付息 | Same three securities with annual-coupon bonds"}, {"ref": "L11:24-27", "title": "对照股利增长与 CAPM 估计股权成本 | Compare dividend growth and CAPM for equity cost"}, {"ref": "T3:17-22", "title": "加强半年债券 TVM 的周期设置 | Practice the semiannual bond TVM settings"}, {"ref": "Ross:516-522", "title": "教材市值权重与公司 WACC 算例 | Textbook market weights and company WACC examples"}], "calculator": "确认 P/Y=C/Y=1。N=40，PV=−920，PMT=32.5，FV=1000，CPT I/Y 后乘 2 年化。 | Verify P/Y=C/Y=1. Enter N=40, PV=−920, PMT=32.5, FV=1000, then CPT I/Y. Multiply the periodic quote by two."}], "quiz": [{"type": "choice", "prompt": "公司债券市价高于面值。为算市场价值 WACC，债务权重分子用什么？ | Company bonds trade above par. What belongs in the numerator of the WACC debt weight?", "options": ["所有债务的市场价值 | Total market value of debt", "所有债券面值 | Total bond face value", "当年的票息支出 | This year’s coupon expense"], "answer": 0, "hint": "权重反映投资者今天对相应融资索取权的估值。 | Weights reflect current financing claim values.", "solution": "债务权重为 D/V，D 用债务市场价值。 | Debt weight is D/V with D measured at market value."}, {"type": "number", "prompt": "普通股占 60%，成本 12%；债务占 40%，税前成本 6%；税率 25%。输入 WACC 的百分数。 | Equity is 60% at 12%; debt is 40% at a 6% pre-tax cost; tax is 25%. Enter WACC as a percentage.", "answer": 9, "tolerance": 0.01, "hint": "税后债务成本是 6%×0.75。 | After-tax debt cost is 6%×0.75.", "solution": "0.60(12%)+0.40(6%)(0.75)=9.00%。 | 0.60(12%)+0.40(6%)(0.75)=9.00%."}, {"type": "written", "prompt": "稳定公用事业公司要投资高风险新业务。用原公司的 WACC 可能导致什么偏差？如何处理？ | A stable utility is considering a risky new business. What bias can arise from using the utility’s WACC, and how should it be addressed?", "hint": "想想高风险现金流需要怎样的回报。 | Think about the required return on riskier cash flows.", "solution": "原 WACC 可能偏低，高估高风险项目的 NPV。用类似业务的风险估计项目回报，再按目标融资结构调整。得分点：偏差方向、项目风险、可比业务或项目折现率。 | The utility WACC may be too low, overstating NPV. Estimate the rate using comparable business risk and the target financing mix. Credit: direction, project risk, and a comparable or project-specific rate."}]}, {"id": 12, "title": "资本结构与财务杠杆 | Capital Structure and Financial Leverage", "objective": "能先辨认 M&M 的税务与破产成本假设，再计算杠杆影响，并解释最优资本结构的直觉。 | Identify the tax and distress assumptions before using M&M, then compute leverage effects and explain the intuition behind optimal capital structure.", "reading": {"ref": "Ross:584-605", "explanation": "Ross 第 16 章分三步推演：无税时融资拆分现金流，有公司税时债务产生税盾，加入财务困境成本后需比较借债的额外收益与额外成本。 | Ross Chapter 16 develops three cases. Financing allocates cash flows without taxes, debt brings a tax shield with corporate taxes, and distress costs create a trade-off between incremental benefit and cost."}, "theories": [{"title": "M&M 无税命题 | M&M without taxes", "explanation": "若资本市场无摩擦、投资政策不变且无税，融资方式改变债权与股权的分配。普通股承担更高的财务风险，资产所需总回报保持不变。 | In frictionless, tax-free markets with unchanged investment policy, financing changes the split of cash flows between claims. Equity takes more financial risk while the asset return stays fixed.", "formula": "Vᴸ = Vᵁ   •   Rᴱ = Rᵁ + (Rᵁ−Rᴰ)D/E   •   WACC = Rᵁ", "use": "Vᴸ、Vᵁ 是有杠杆和无杠杆公司价值；Rᵁ 是无杠杆资本成本。投资者可用自制杠杆解释价值不变。 | Vᴸ and Vᵁ are levered and unlevered firm values. Rᵁ is the unlevered cost of capital. Homemade leverage explains why values are equal."}, {"title": "有公司税时 | M&M with corporate taxes", "explanation": "利息抵税使公司整体税负下降。若固定债务永续维持，税盾按债务利率折现，税盾现值为公司税率乘债务价值。 | Deductible interest reduces corporate taxes. With permanent fixed debt and the tax shield discounted at the debt rate, its PV is tax rate times the debt value.", "formula": "Vᴸ = Vᵁ + T×D   •   E = Vᴸ − D\nRᴱ = Rᵁ + (Rᵁ−Rᴰ)(D/E)(1−T)\nWACC = (E/Vᴸ)Rᴱ + (D/Vᴸ)Rᴰ(1−T)", "use": "先估无杠杆价值，再加税盾。杠杆后的 D/E 用新的市场股权价值。 | Value the unlevered firm, then add the tax shield. Use the new market equity in the levered D/E ratio."}, {"title": "财务困境与权衡 | Distress costs and the trade-off", "explanation": "债务也增加违约概率以及直接和间接困境成本。静态权衡比较边际税盾与边际困境成本；融资优序理论强调信息不对称下公司的融资顺序。 | Debt increases default probability and the expected costs of distress. Static trade-off theory compares marginal tax benefits with marginal distress costs. Pecking order emphasizes financing order under asymmetric information.", "formula": "Vᴸ ≈ Vᵁ + PV(tax shields) − PV(expected financial distress costs)", "use": "若题目给预期困境成本就扣除。没有给数字时，用文字解释税盾与困境的权衡。 | Subtract expected distress costs when quantified. Otherwise explain the trade-off between tax benefits and distress."}], "examples": [{"title": "有公司税时的公司价值和 WACC | Firm value and WACC with corporate taxes", "ref": "L12:49-50", "prompt": "永久 EBIT $25m，税率 35%，债务 $75m，债务成本 9%，无杠杆成本 12%。按讲义的永续情形求 Vᵁ、Vᴸ、Rᴱ 和 WACC。 | Perpetual EBIT is $25m, tax is 35%, debt is $75m at 9%, and unlevered capital cost is 12%. Under the lecture’s perpetuity assumptions, find Vᵁ, Vᴸ, Rᴱ, and WACC.", "steps": [{"text": "先当公司全股权融资。使用未扣利息的税后经营收益，按无杠杆成本估永续。 | Start as if the firm is all equity. Value perpetual after-tax operating earnings before interest using the unlevered rate.", "formula": "Vᵁ = 25(1−0.35)/0.12 = $135.4167m"}, {"text": "固定永续债务带来税盾，增加公司总价值；再扣债务求股权市值。 | Permanent debt creates a tax shield that raises firm value. Subtract debt to find market equity.", "formula": "Vᴸ = 135.4167 + 0.35×75 = $161.6667m\nE = 161.6667−75 = $86.6667m"}, {"text": "代入有税的 M&M II，使用新的市值 D/E。随后以 E/V 和 D/V 算税后 WACC。 | Apply taxed M&M II with the new market D/E, then calculate WACC using E/V and D/V.", "formula": "Rᴱ = 12%+(12%−9%)(75/86.6667)(1−0.35) ≈ 13.69%\nWACC ≈ 10.05%"}, {"text": "核对：$16.25m 税后经营现金流除以 WACC，约等于有杠杆公司价值。 | Cross-check: $16.25m of after-tax operating cash flow divided by WACC is approximately the levered firm value.", "formula": ""}], "answer": "无杠杆价值约 $135.42m，有杠杆价值约 $161.67m。加杠杆后股权成本约 13.69%，税后 WACC 约 10.05%。 | Unlevered value is about $135.42m and levered value about $161.67m. Levered equity costs about 13.69% and after-tax WACC is about 10.05%.", "related": [{"ref": "T10:18-23", "title": "公司举债回购，依次求股权价值、股权成本和 WACC | Debt-financed repurchase: compute equity value, return and WACC"}, {"ref": "T10:11-12", "title": "已知 WACC 及杠杆，反推出股权和无杠杆成本 | Recover levered and unlevered equity costs from WACC"}, {"ref": "L12:53-55", "title": "讲义的有税回购与图示 | Taxed repurchase and diagram from the lecture"}, {"ref": "Ross:592-596", "title": "教材税盾和有税／无税命题汇总 | Textbook tax shield and propositions"}]}, {"title": "无税下用相同的经营现金流比较两公司 | Comparing two firms with the same operating cash flows and no taxes", "ref": "T10:13-17", "prompt": "ABC 全股权融资，市值 $600,000；XYZ 的经营现金流与其相同但使用永久债务，股权市值 $300,000，债务成本 8%。两家永续 EBIT $80,000，无税。求各自股权成本和 WACC。 | ABC is all equity with a $600,000 market value. XYZ has the same operating cash flows but uses permanent debt. XYZ equity is worth $300,000 and its debt costs 8%. Both have perpetual EBIT of $80,000 and no taxes. Find equity costs and WACC.", "steps": [{"text": "无税命题 I：两家经营现金流相同且其他假设相同，所以总价值皆为 $600,000。XYZ 的 D=600,0
