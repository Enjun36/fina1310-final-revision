const groups = [
  {first:1, title:"导论与估值 | Foundations and Valuation"},
  {first:6, title:"风险与回报 | Risk and Return"},
  {first:8, title:"资本预算 | Capital Budgeting"},
  {first:11, title:"融资与资本结构 | Financing and Capital Structure"}
];
const sections = [
  ["theory", "理论和公式 | Theory and Equations"],
  ["examples", "精讲与同类题 | Worked and Related Examples"],
  ["quiz", "自测 | Self-check"]
];
function bilingual(pair, mode = language) {
  const [zh, en] = split(pair);
  if (en === undefined) return formatMathInProse(zh);
  if (mode === "zh") return '<span lang="zh-Hans">' + formatMathInProse(zh) + '</span>';
  if (mode === "en") return '<span lang="en">' + formatMathInProse(en) + '</span>';
  return '<span lang="zh-Hans">' + formatMathInProse(zh) + '</span><span class="minor" lang="en">' + formatMathInProse(en) + '</span>';
}
function paragraph(pair) {
  const [zh, en] = split(pair);
  return '<div class="text-block '+language+'">' +
    (language === "en" ? "" : '<p lang="zh-Hans">'+formatMathInProse(zh)+'</p>') +
    (language === "zh" ? "" : '<p lang="en">'+formatMathInProse(en)+'</p>') + '</div>';
}
const inline = (pair) => '<span class="inline-pair">' + bilingual(pair) + '</span>';
const heading = (pair) => '<span class="heading">' + bilingual(pair) + '</span>';
function formula(value) {
  if (!value) return "";
  const equations = value.split(/\n|\s*•\s*/).filter(Boolean);
  return '<div class="formula" dir="ltr">'+equations.map(line=>displayMath[line]).join("")+'</div>';
}
const lessonName = (id) => inline('第 '+id+' 讲 | Lecture '+id);
function reference(ref) {
  const [key, section] = ref.split(":");
  const [first, end = first] = section.split("-").map(Number);
  const file = sourceFiles[key];
  const href = "#ref-" + encodeURIComponent(ref);
  const range = first === end ? String(first) : first+"–"+end;
  const pages = inline("PDF 第 "+range+" 页 | PDF "+(first===end?"p. ":"pp. ")+range);
  return {href, file, pages};
}
function sourceAnchor(ref, label, cls="") {
  const {href, file, pages} = reference(ref);
  return '<a class="'+cls+'" href="'+esc(href)+'" data-ref="'+esc(ref)+'" title="'+esc(file)+'">'+
    (label ? label+' · ' : '')+pages+'</a>';
}
function sourceName(ref) {
  const key = ref.split(":")[0];
  if (key === "Ross") return "Ross · Fundamentals of Corporate Finance";
  const n = key.slice(1);
  if (key[0] === "P") return inline("第 "+n+" 讲习题 | Lecture "+n+" practice questions");
  if (key[0] === "T") return "Tutorial "+n;
  return lessonName(Number(n));
}
function renderSidebar() {
  const nav = $("#lecture-nav");
  const offset = nav.scrollTop;
  nav.innerHTML = lessons.map((item) => {
    const group = groups.find(({first}) => first === item.id);
    return (group ? '<div class="nav-group">'+bilingual(group.title)+'</div>' : '')+
      '<a href="#lecture-'+item.id+'"'+(item.id===current.id ? ' aria-current="page"' : '')+'>'+
      '<span class="num" aria-hidden="true">'+String(item.id).padStart(2,"0")+'</span><span>'+
      bilingual(item.title)+'</span></a>';
  }).join("");
  nav.scrollTop = offset;
  const active = nav.querySelector('[aria-current="page"]');
  if (active && nav.clientHeight) {
    const region = nav.getBoundingClientRect();
    const item = active.getBoundingClientRect();
    if (item.bottom > region.bottom) nav.scrollTop += item.bottom - region.bottom + 8;
    if (item.top < region.top) nav.scrollTop -= region.top - item.top + 8;
  }
  $("#brand-caption").innerHTML = bilingual("公司金融 | Corporate Finance");
  $("#toolbar-title").innerHTML = inline("复习指南 | Study Guide");
  $("#mobile-toggle").innerHTML = inline("课程目录 | Lectures")+" · "+current.id+"/12";
  for (const button of document.querySelectorAll("[data-language]")) {
    button.setAttribute("aria-pressed", String(button.dataset.language === language));
  }
}
function renderTheory(item) {
  return '<article class="panel theory"><h3>'+heading(item.title)+'</h3>'+paragraph(item.explanation)+
    formula(item.formula)+'<div class="use"><strong>'+inline("什么时候用 | When to use it")+'</strong>'+
    paragraph(item.use)+'</div></article>';
}
function renderBook(item) {
  const {file} = reference(item.ref);
  return '<aside class="book-card"><h3>'+heading("Ross 教材补充 | From the Ross textbook")+'</h3>'+
    paragraph(item.explanation)+'<div class="files">'+sourceAnchor(item.ref, esc(file.split("/").at(-1)))+'</div></aside>';
}
function renderExample(item) {
  const mainRef = reference(item.ref);
  const extra = (pair, label, cls="") => pair ? '<div class="note '+cls+'"><strong>'+inline(label)+
    '</strong>'+paragraph(pair)+'</div>' : "";
  const related = item.related.map(({ref,title}) => {
    const {href, file, pages} = reference(ref);
    return '<li><a href="'+esc(href)+'" data-ref="'+esc(ref)+'" data-topic="'+esc(title)+'"><strong>'+inline(title)+
      '</strong><span class="file-loc">'+esc(file.split("/").at(-1))+' · '+pages+'</span></a></li>';
  }).join("");
  return '<article class="panel example"><header><h3>'+heading(item.title)+'</h3>'+
    sourceAnchor(item.ref, sourceName(item.ref), "source-pill")+
    '<div class="files">'+esc(mainRef.file.split("/").at(-1))+'</div></header><div class="example-body">'+
    '<div class="prompt">'+paragraph(item.prompt)+'</div><h4>'+inline("解题步骤 | Worked solution")+'</h4>'+
    '<ol class="steps">'+item.steps.map(s=>'<li>'+paragraph(s.text)+formula(s.formula)+'</li>').join("")+'</ol>'+
    '<div class="answer"><h4>'+inline("考卷写法 | What to write on the exam")+'</h4>'+
    paragraph(item.answer)+'</div>'+
    extra(item.calculator,"BA II Plus","")+extra(item.note,"原题复算说明 | Source correction","mismatch")+
    '<details class="related"><summary>'+inline("同类题与变式 | Related examples")+' · '+item.related.length+'</summary><ul>'+related+'</ul></details>'+
    '</div></article>';
}
const messageLabels = {
  correct: "答对了。可展开答案对照过程。 | Correct. Reveal the solution to compare your reasoning.",
  incorrect: "还没答对。可先看提示，再试一次。 | Not quite. Try the hint and give it another go.",
  missing: "请先选择或输入答案。 | Select or enter an answer first.",
  invalid: "请输入有效数字。 | Enter a valid number."
};
const responseKey = (id,i) => id+"-"+i;
function renderQuiz(question,i,id) {
  const key = responseKey(id,i);
  const value = responses.get(key) || {};
  let input = "";
  if (question.type === "choice") {
    // Keep option order stable when the reader switches languages.
    const orders = [[0,2,1],[1,0,2],[2,1,0]];
    const order = orders[(2*id+i)%orders.length];
    input = '<fieldset aria-labelledby="q-'+key+'">'+order.map((j) =>
      '<label class="option"><input type="radio" name="q-'+key+'" value="'+j+'"'+
      (value.input != null && Number(value.input)===j ? ' checked' : '')+'>'+inline(question.options[j])+'</label>'
    ).join("")+'</fieldset>';
  } else if (question.type === "number") {
    input = '<label><span class="visually-hidden">'+inline("数值答案 | Numerical answer")+'</span>'+
      '<input class="numeric" type="text" inputmode="decimal" autocomplete="off" value="'+esc(value.input ?? "")+
      '" aria-labelledby="q-'+key+'"></label>';
  }
  const objective = question.type !== "written";
  return '<article class="panel quiz-card"><h3 id="q-'+key+'"><span class="q-num">'+(i+1)+'</span>'+
    heading(question.prompt)+'</h3>'+
    (objective ? '<form data-question="'+i+'" novalidate>'+input+'<button type="submit" class="check">'+
      inline("检查答案 | Check answer")+'</button><span id="feedback-'+key+'" class="feedback" role="status">'+
      (value.status ? inline(messageLabels[value.status]) : "")+'</span></form>' : '')+
    '<details data-reveal="'+key+'-hint"'+(value.hint ? ' open':'')+'><summary>'+inline("看提示 | Show a hint")+
    '</summary><div class="reveal">'+paragraph(question.hint)+'</div></details>'+
    '<details data-reveal="'+key+'-answer"'+(value.answer ? ' open':'')+'><summary>'+
    inline(objective ? "看答案和过程 | Reveal the solution" : "看参考答案和得分点 | Reveal model answer and rubric")+
    '</summary><div class="reveal">'+paragraph(question.solution)+'</div></details></article>';
}
function renderScore() {
  const objective = current.quiz.map((q,i)=>q.type==="written" ? null : i).filter(i=>i!==null);
  const passed = objective.filter(i=>responses.get(responseKey(current.id,i))?.status==="correct").length;
  $("#score").innerHTML = inline("客观题已答对 "+passed+" / "+objective.length+" | Objective questions correct: "+passed+" / "+objective.length);
}
function nextLink(id, prev) {
  const target = lessons.find(item=>item.id === id);
  if (!target) return "<span></span>";
  const cue = prev ? "上一讲 | Previous lecture" : "下一讲 | Next lecture";
  return '<a class="outline" href="#lecture-'+id+'">'+inline(cue)+' · '+inline(target.title)+'</a>';
}

const featuredExample = [1,0,1,1,1,0,0,1,1,0,1,0];
function expandMore(label, contents) {
  return '<details class="extras"><summary>'+inline(label)+'</summary>'+contents+'</details>';
}
function render() {
  document.documentElement.lang = language==="en" ? "en" : "zh-Hans";
  document.documentElement.dataset.lang = language;
  document.title = 'FINA1310 · '+split(current.title)[language==="en" ? 1 : 0];
  renderSidebar();
  const {id,title,objective,reading,theories,examples,quiz} = current;
  const root = "lecture-"+id;
  $("#main").innerHTML =
    '<header id="'+root+'" class="hero"><div class="hero-meta">'+lessonName(id)+' / 12</div>'+
    '<h1>'+bilingual(title)+'</h1><div class="hero-desc">'+bilingual(objective)+'</div></header>'+
    '<nav class="jump" aria-label="本讲内容 / Lesson sections">'+sections.map(([section,label])=>
      '<a href="#'+root+'-'+section+'">'+inline(label)+'</a>').join("")+'</nav>'+
    '<section id="'+root+'-theory" class="section"><h2>'+inline(sections[0][1])+'</h2><div class="theory-list">'+
    theories.map(renderTheory).join("")+'</div>'+renderBook(reading)+'</section>'+
    '<section id="'+root+'-examples" class="section"><h2>'+inline(sections[1][1])+'</h2><div class="section-help">'+
    paragraph("先做代表题，再按需展开另一题。题源链接标明原文件和页码。 | Start with the featured example and expand the second if needed. Source links show the original file and page.")+
    '</div>'+renderExample(examples[featuredExample[id-1]])+
    expandMore("再做一道例题 | One more worked example", renderExample(examples[1-featuredExample[id-1]]))+'</section>'+
    '<section id="'+root+'-quiz" class="section"><h2>'+inline(sections[2][1])+'</h2>'+
    '<div class="section-help">'+paragraph("先独立作答，再展开提示或参考答案。解释题用得分点自查。 | Try each problem before opening its hint or solution. Use the rubric to check written responses.")+
    '</div><div id="score" class="score" role="status"></div>'+quiz.slice(0,2).map((q,i)=>renderQuiz(q,i,id)).join("")+
    expandMore("加练解释题 | Optional written question", renderQuiz(quiz[2],2,id))+'</section>'+
    '<nav class="footer-nav" aria-label="相邻课程 / Neighboring lectures">'+nextLink(id-1,true)+nextLink(id+1,false)+'</nav>'+
    '<div class="preface">'+paragraph("题源索引为原资料的 PDF 页码。 | References use the page numbers of the original PDFs.")+'</div>';
  renderScore();
  for (const [i] of quiz.entries()) {
    const key = responseKey(id,i);
    const status = responses.get(key)?.status;
    if (status && $("#feedback-"+key)) $("#feedback-"+key).dataset.status = status;
  }
}
function route() {
  const match = location.hash.match(/^#lecture-(\d+)(?:-(theory|examples|quiz))?$/);
  return {lesson:lessons.find(item=>item.id===Number(match?.[1])) || lessons[0], section:match?.[2], hasRoute:!!match};
}
function openRoute(scroll) {
  const {lesson,section,hasRoute} = route();
  const changed = current !== lesson;
  if (changed) {
    current = lesson;
    render();
  }
  if (scroll && (changed || section || hasRoute)) {
    if (section) document.getElementById("lecture-"+current.id+"-"+section)?.scrollIntoView();
    else window.scrollTo(0,0);
  }
}
function setMenu(open) {
  $(".sidebar").dataset.open = String(open);
  $("#mobile-toggle").setAttribute("aria-expanded", String(open));
}
$("#mobile-toggle").addEventListener("click", () => setMenu($("#mobile-toggle").getAttribute("aria-expanded") !== "true"));
const saveInput = (form) => {
  const key = responseKey(current.id,Number(form.dataset.question));
  const state = responses.get(key) || {};
  const field = form.querySelector("input:checked, .numeric");
  state.input = field?.value ?? null;
  responses.set(key,state);
  return state;
};
const feedback = (key, status) => {
  const result = $("#feedback-"+key);
  result.textContent = "";
  if (status) {
    result.dataset.status = status;
    result.innerHTML = inline(messageLabels[status]);
  }
};
$("#main").addEventListener("input", event => {
  const form = event.target.closest("form[data-question]");
  if (!form) return;
  const state = saveInput(form);
  state.status = "";
  feedback(responseKey(current.id,Number(form.dataset.question)), "");
  renderScore();
});
$("#main").addEventListener("submit", event=>{
  const form = event.target.closest("form[data-question]");
  if (!form) return;
  event.preventDefault();
  const i = Number(form.dataset.question);
  const question = current.quiz[i];
  const state = saveInput(form);
  let status = "missing";
  if (question.type==="choice" && state.input!==null) {
    status = Number(state.input)===question.answer ? "correct" : "incorrect";
  } else if (question.type==="number" && state.input?.trim()) {
    const text = state.input.normalize("NFKC").trim().replace(/[,，\s]/g,"").replace(/−/g,"-");
    const match = text.match(/^\$?([+-]?(?:\d+(?:\.\d*)?|\.\d+))%?$/);
    const value = match ? Number(match[1]) : NaN;
    status = !Number.isFinite(value) ? "invalid" :
      (Math.abs(value-question.answer)<=question.tolerance+1e-9 ? "correct" : "incorrect");
  }
  state.status = status;
  feedback(responseKey(current.id,i),status);
  renderScore();
});
$("#main").addEventListener("toggle", event => {
  const details = event.target;
  if (!details.dataset.reveal) return;
  const [id,i,kind] = details.dataset.reveal.split("-");
  const key = responseKey(id,i);
  const state = responses.get(key) || {};
  state[kind] = details.open;
  responses.set(key,state);
}, true);
document.querySelector(".language").addEventListener("click",event=>{
  const target = event.target.closest("[data-language]");
  if (!target || target.dataset.language===language) return;
  const from = [...document.querySelectorAll("#main .section")].reverse().find(el=>el.getBoundingClientRect().top<=110);
  language = target.dataset.language;
  try { localStorage.setItem("fina1310-language",language); } catch {}
  render();
  if (from) document.getElementById(from.id)?.scrollIntoView();
  else window.scrollTo(0,0);
});
$("#lecture-nav").addEventListener("click", event=>{
  if (!event.target.closest("a")) return;
  setMenu(false);
});

const referenceDialog = $("#reference-dialog");
$("#main").addEventListener("click",event=>{
  const trigger = event.target.closest("a[data-ref]");
  if (!trigger) return;
  event.preventDefault();
  const ref = trigger.dataset.ref;
  const {file,pages} = reference(ref);
  $("#reference-title").innerHTML = heading("题源与页码 | Source and page");
  $("#reference-topic").innerHTML = trigger.dataset.topic ? inline(trigger.dataset.topic) : sourceName(ref);
  $("#reference-location").innerHTML = esc(file.split("/").at(-1))+" · "+pages;
  $("#reference-help").innerHTML = paragraph("请用文件名和页码在你的课程资料中定位原题。 | Use the filename and page number to locate the original in your course materials.");
  $("#reference-close").innerHTML = inline("关闭 | Close");
  referenceDialog.showModal();
});
window.addEventListener("hashchange",()=>openRoute(true));
openRoute(!!location.hash);
</script>
</body>
</html>
